services:
  ggo-content:
    image: caddy:2-alpine
    container_name: ggo-content
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      GGO_HOST: ${GGO_HOST}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./public:/srv/ggo/public:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
