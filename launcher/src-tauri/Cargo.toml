[package]
name = "gungloryonline-launcher"
version = "0.2.7"
description = "GunGloryOnline Launcher"
authors = ["GunGloryOnline"]
edition = "2021"

[lib]
name = "gungloryonline_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
sha1 = "0.10"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
url = "2"
open = "5"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
tokio = { version = "1", features = ["fs", "io-util", "rt-multi-thread", "macros", "net", "time", "sync"] }
futures-util = "0.3"
zip = "2"
fastnbt = "2"
