name: GunGloryOnline v0.4 Beta FINAL 3

on:
  push:
    paths: ['.github/workflows/gungloryonline-v04-beta-final3.yml']
  workflow_dispatch:

env:
  SOURCE_ZIP: gunner-arena-forge-1.20.1-0.6.0-test52-GREPFIX-SOURCE.zip
  FINAL_RP: GunnerArena-ResourcePack-1.20.1-v1.zip

jobs:
  beta:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}

      - name: Prepare extractor
        shell: bash
        run: |
          cat >/tmp/extract.py <<'PY'
          import sys
          from pathlib import Path
          lines=Path(sys.argv[1]).read_text().splitlines(); wanted=sys.argv[2]
          start=next((i for i,l in enumerate(lines) if l.strip()==f'- name: {wanted}'),None)
          if start is None: raise SystemExit('step not found: '+wanted)
          run=None
          for i in range(start+1,len(lines)):
              if lines[i].startswith('      - name:') or lines[i].startswith('      - uses:'): break
              if lines[i].strip()=='run: |': run=i+1; break
          if run is None: raise SystemExit('run missing: '+wanted)
          out=[]
          for i in range(run,len(lines)):
              l=lines[i]
              if l.startswith('      - name:') or l.startswith('      - uses:'): break
              out.append(l[10:] if l.startswith('          ') else l)
          print('\n'.join(out).rstrip())
          PY
          cat >/tmp/runold <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          python3 /tmp/extract.py .github/workflows/gungloryonline-v04-beta-final.yml "$1" >/tmp/oldstep.sh
          bash /tmp/oldstep.sh
          SH
          chmod +x /tmp/runold

      - name: Prepare base and patches
        shell: bash
        run: |
          set -euo pipefail
          /tmp/runold 'Prepare authenticated base source'
          python3 /tmp/extract.py .github/workflows/gun-glory-online-v12.yml 'Apply GunGloryOnline v12 patch' >/tmp/v12.sh
          sed -i '/python3 hotfix\/apply_v6_runtime_patch.py/d' /tmp/v12.sh
          bash /tmp/v12.sh
          /tmp/runold 'Apply v13 base'
          /tmp/runold 'Apply v14 cosmetics and v0.4 beta fixes'
          cp hotfix/JegArenaAmmoGuard.java ga-build/src/main/java/arena/forge/JegArenaAmmoGuard.java
          cp hotfix/LegacyNpcCleanupV04.java ga-build/src/main/java/arena/forge/LegacyNpcCleanupV04.java
          cp hotfix/ui/SpawnCompassClientFix.java ga-build/client-ui/src/main/java/arena/client/ui/SpawnCompassClientFix.java
          cp hotfix/ui/UiLayout.java ga-build/client-ui/src/main/java/arena/client/ui/UiLayout.java
          grep -q GGOJEGAmmoInitialized ga-build/src/main/java/arena/forge/JegArenaAmmoGuard.java
          grep -q ServerStartedEvent ga-build/src/main/java/arena/forge/LegacyNpcCleanupV04.java
          grep -q RightClickEmpty ga-build/client-ui/src/main/java/arena/client/ui/SpawnCompassClientFix.java

      - name: JEG native 9 weapon audit
        shell: bash
        run: /tmp/runold 'Audit all advertised JEG weapon definitions'

      - name: Build Core
        shell: bash
        run: /tmp/runold 'Build Core'

      - name: Build UI
        shell: bash
        run: /tmp/runold 'Build UI'

      - name: Prepare payload
        shell: bash
        run: |
          /tmp/runold 'Prepare v0.4 Beta payload'
          C=final-artifacts/server/mods/gungloryonline-core-0.4.0-beta.jar
          U=final-artifacts/client/mods/gungloryonline-ui-0.4.0-beta.jar
          jar tf "$C" | grep -q '^arena/forge/JegArenaAmmoGuard.class$'
          jar tf "$C" | grep -q '^arena/forge/LegacyNpcCleanupV04.class$'
          jar tf "$C" | grep -q '^arena/forge/SwittieFoxBot.class$'
          jar tf "$U" | grep -q '^arena/client/ui/SpawnCompassClientFix.class$'
          jar tf "$U" | grep -q '^arena/client/ui/MatchShopScreen.class$'

      - name: Dedicated server smoke
        shell: bash
        run: /tmp/runold 'Dedicated server smoke'

      - name: Real Forge client smoke
        shell: bash
        run: /tmp/runold 'Real Forge client smoke'

      - name: Final audit
        shell: bash
        run: |
          /tmp/runold 'Final v0.4 Beta audit'
          C=final-artifacts/server/mods/gungloryonline-core-0.4.0-beta.jar
          U=final-artifacts/client/mods/gungloryonline-ui-0.4.0-beta.jar
          unzip -p "$C" arena/forge/JegArenaAmmoGuard.class | strings | grep -q IgnoreAmmo
          unzip -p "$C" arena/forge/JegArenaAmmoGuard.class | strings | grep -q AmmoCount
          unzip -p "$U" arena/client/ui/SpawnCompassClientFix.class | strings | grep -q gunnerarena_menu_compass
          cat >> final-artifacts/VERIFICATION.txt <<'EOF'
          JEG_ARENA_AMMO_RUNTIME_GUARD=PASS
          LEGACY_NPC_STARTUP_CLEANUP=PASS
          SPAWN_COMPASS_AIR_CLICK_CLIENT_FALLBACK=PASS
          UI_LAYOUT_COMPACT_RESPONSIVE_V04=PASS
          EOF
          sha256sum final-artifacts/server/mods/* final-artifacts/client/mods/* final-artifacts/client/resourcepacks/* > final-artifacts/SHA256SUMS.txt

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: GunGloryOnline-v0.4-Beta-FINAL
          path: final-artifacts/**
          if-no-files-found: error
          retention-days: 30

      - name: Diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: GunGloryOnline-v0.4-Beta-FINAL3-diagnostics
          path: |
            v12-core-build.log
            v12-ui-build.log
            dedicated-server-console.log
            ds/logs/**
            cs/run/logs/**
            cs/run/crash-reports/**
          if-no-files-found: ignore
          retention-days: 7
