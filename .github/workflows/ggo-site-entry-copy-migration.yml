name: GGO Site Entry Copy Migration

on:
  push:
    branches:
      - launcher/bootstrap-v0.1
    paths:
      - .github/workflows/ggo-site-entry-copy-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: launcher/bootstrap-v0.1
          fetch-depth: 0
      - name: Align site with current GGO entry flow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('site/index.html')
          s=p.read_text(encoding='utf-8')
          replacements={
            '<span>WINDOWS / LINUX</span><span>RUNTIME V1</span><span>ONE-CLICK ENTRY</span><span>EU NODE</span>':'<span>WINDOWS / LINUX</span><span>ONE-CLICK ENTRY</span><span>OFFICIAL ASSETS</span><span>OST · AFTERGLOW PROTOCOL</span>',
            'Обычный online-путь больше не требует команд входа внутри игры. Аккаунт и короткая игровая сессия подготавливаются самим GGO Launcher.':'Обычный online-путь больше не требует команд входа внутри игры. GGO Launcher проверяет клиент, синхронизирует официальные визуальные файлы и только затем создаёт короткую защищённую игровую сессию.',
            '<p><b>03</b><span>GAME FILES</span><strong>SYNCED</strong></p>\n          <p><b>04</b><span>SECURE SESSION</span><strong>ONE-SHOT</strong></p>\n          <p><b>05</b><span>OFFICIAL TARGET</span><strong>LOCKED</strong></p>':'<p><b>03</b><span>GAME FILES</span><strong>SYNCED</strong></p>\n          <p><b>04</b><span>OFFICIAL ASSETS</span><strong>VERIFIED</strong></p>\n          <p><b>05</b><span>SECURE SESSION</span><strong>ONE-SHOT</strong></p>\n          <p><b>06</b><span>OFFICIAL TARGET</span><strong>LOCKED</strong></p>',
          }
          for old,new in replacements.items():
              if old not in s:
                  raise SystemExit(f'missing expected site copy: {old}')
              s=s.replace(old,new)
          for required in ['GunGloryOnline-Launcher-Windows.msi','GunGloryOnline-Launcher-Linux.AppImage','GunGloryOnline-ClientPack-1.20.1-Forge47.4.10.zip','Resource Pack','ggo.kvicloud.ru','SHA1']:
              if required not in s:
                  raise SystemExit(f'site validation token lost: {required}')
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/index.html
          git commit -m 'feat(site): align secure entry flow with managed assets'
          git fetch origin launcher/bootstrap-v0.1
          git rebase origin/launcher/bootstrap-v0.1
          git push origin HEAD:launcher/bootstrap-v0.1
