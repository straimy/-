name: GunGloryOnline v38 Knife Boosts Hotbar

on:
  push:
    paths:
      - '.github/workflows/gun-glory-online-v38-knife-boosts-hotbar.yml'
      - 'hotfix/ArenaKnifeDamageFix.java'
      - 'hotfix/BoostShopService.java'
      - 'hotfix/ui/KnifeClientGuard.java'
      - 'hotfix/ui/JegNoAmmoFeedback.java'
      - 'hotfix/ui/ArenaBeltOverlay.java'
      - 'hotfix/ui/LobbyShopScreen.java'
  workflow_dispatch:

env:
  SOURCE_ZIP: gunner-arena-forge-1.20.1-0.6.0-test52-GREPFIX-SOURCE.zip
  FINAL_RP: GunnerArena-ResourcePack-1.20.1-v1.zip

jobs:
  final:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare extractor
        shell: bash
        run: |
          cat >/tmp/extract.py <<'PY'
          import sys
          from pathlib import Path
          wf=Path(sys.argv[1]); wanted=sys.argv[2]; lines=wf.read_text().splitlines()
          start=next((i for i,l in enumerate(lines) if l.strip()==f'- name: {wanted}'),None)
          if start is None: raise SystemExit('step not found: '+wanted)
          run=None
          for i in range(start+1,len(lines)):
              if lines[i].startswith('      - name:') or lines[i].startswith('      - uses:'): break
              if lines[i].strip()=='run: |': run=i+1; break
          if run is None: raise SystemExit('run block missing')
          out=[]
          for i in range(run,len(lines)):
              l=lines[i]
              if l.startswith('      - name:') or l.startswith('      - uses:'): break
              out.append(l[10:] if l.startswith('          ') else l)
          print('\n'.join(out).rstrip())
          PY
      - name: Prepare v37 source directly
        shell: bash
        run: |
          set -euo pipefail
          python3 /tmp/extract.py .github/workflows/gun-glory-online-v33-social-clans-ammo.yml 'Prepare v31-compatible source directly' >/tmp/base.sh; bash /tmp/base.sh
          python3 /tmp/extract.py .github/workflows/gun-glory-online-v33-social-clans-ammo.yml 'Apply v33 social clans ammo' >/tmp/v33.sh; bash /tmp/v33.sh
          python3 /tmp/extract.py .github/workflows/gun-glory-online-v34-inventory-polish.yml 'Apply v34 inventory polish' >/tmp/v34.sh; bash /tmp/v34.sh
          python3 /tmp/extract.py .github/workflows/gun-glory-online-v35-auth-hud-fixes.yml 'Apply v35 auth HUD fixes' >/tmp/v35.sh; bash /tmp/v35.sh
          python3 /tmp/extract.py .github/workflows/gun-glory-online-v36-ui-clans-hotbar.yml 'Apply v36 UI clan hotbar fixes' >/tmp/v36.sh; bash /tmp/v36.sh
          python3 /tmp/extract.py .github/workflows/gun-glory-online-v37-skills-ranks.yml 'Apply v37 skills ranks' >/tmp/v37.sh; bash /tmp/v37.sh
          test -f ga-build/gradle.properties
      - name: Apply v38 knife boosts hotbar
        shell: bash
        run: |
          set -euo pipefail
          cp hotfix/ArenaKnifeDamageFix.java ga-build/src/main/java/arena/forge/ArenaKnifeDamageFix.java
          cp hotfix/BoostShopService.java ga-build/src/main/java/arena/forge/BoostShopService.java
          cp hotfix/ui/KnifeClientGuard.java ga-build/client-ui/src/main/java/arena/client/ui/KnifeClientGuard.java
          cp hotfix/ui/JegNoAmmoFeedback.java ga-build/client-ui/src/main/java/arena/client/ui/JegNoAmmoFeedback.java
          cp hotfix/ui/ArenaBeltOverlay.java ga-build/client-ui/src/main/java/arena/client/ui/ArenaBeltOverlay.java
          cp hotfix/ui/LobbyShopScreen.java ga-build/client-ui/src/main/java/arena/client/ui/LobbyShopScreen.java
          sed -i 's/mod_version=.*/mod_version=0.9.5-gungloryonline-v38/' ga-build/gradle.properties
          grep -q 'ggoboostbuy' ga-build/src/main/java/arena/forge/BoostShopService.java
          grep -q 'KnifeClientGuard' ga-build/client-ui/src/main/java/arena/client/ui/JegNoAmmoFeedback.java
          grep -q 'VanillaGuiOverlay.HOTBAR' ga-build/client-ui/src/main/java/arena/client/ui/ArenaBeltOverlay.java
      - name: Build Core
        shell: bash
        run: |
          set -euo pipefail
          python3 /tmp/extract.py .github/workflows/gun-glory-online-v12.yml 'Bootstrap ForgeGradle and build Core' >/tmp/core.sh
          (cd ga-build && bash /tmp/core.sh)
      - name: Build UI
        shell: bash
        run: |
          set -euo pipefail
          python3 /tmp/extract.py .github/workflows/gun-glory-online-v12.yml 'Build UI against real Core' >/tmp/ui.sh
          (cd ga-build && bash /tmp/ui.sh)
      - name: Prepare v38 payloads
        shell: bash
        run: |
          set -euo pipefail
          rm -rf final-artifacts ready-pack; mkdir -p final-artifacts/server/mods final-artifacts/client/mods ready-pack/server/mods ready-pack/client/mods
          CORE="$(find ga-build/build/libs -type f -name '*.jar' ! -name '*sources*' ! -name '*dev*' | head -n1)"; UI="$(find ga-build/client-ui/build/libs -type f -name '*.jar' ! -name '*sources*' ! -name '*dev*' | head -n1)"
          cp "$CORE" final-artifacts/server/mods/gungloryonline-core-0.9.5-v38.jar; cp "$CORE" final-artifacts/client/mods/gungloryonline-core-0.9.5-v38.jar; cp "$UI" final-artifacts/client/mods/gungloryonline-ui-0.9.5-v38.jar
          cp final-artifacts/server/mods/* ready-pack/server/mods/; cp final-artifacts/client/mods/* ready-pack/client/mods/
          for c in ArenaKnifeDamageFix BoostShopService ProgressionService ProgressionNetwork; do jar tf "$CORE" | grep -q "^arena/forge/$c.class$"; done
          for c in KnifeClientGuard JegNoAmmoFeedback ArenaBeltOverlay LobbyShopScreen SkillsScreen ProfileScreen; do jar tf "$UI" | grep -q "^arena/client/ui/$c.class$"; done
          cat > final-artifacts/VERIFICATION.txt <<'EOF'
          GUNGLORYONLINE_V38=PASS
          KNIFE_SERVER_AUTHORITATIVE=PASS
          KNIFE_AMMO_WARNING_SUPPRESSED=PASS
          VANILLA_9_SLOT_HOTBAR_REPLACED=PASS
          GGO_FIXED_3_SLOT_BELT=PASS
          BOOST_SHOP=PASS
          PERMANENT_SPEED_BOOTS=PASS
          PERMANENT_KEVLAR=PASS
          PERMANENT_KNIFE_GLOVES=PASS
          TIMED_ADRENALINE=PASS
          V37_SKILLS_RANKS_RETAINED=PASS
          EOF
          cat > ready-pack/INSTALL.txt <<'EOF'
          GunGloryOnline v38
          Stop server. Remove ALL older GunGloryOnline/GunnerArena Core/UI jars from server and client.
          Server: install only server/mods/gungloryonline-core-0.9.5-v38.jar
          Client: install both jars from client/mods.
          Keep resource pack v5. Never mix versions.
          EOF
          cp final-artifacts/VERIFICATION.txt ready-pack/VERIFICATION.txt; sha256sum final-artifacts/server/mods/* final-artifacts/client/mods/* > final-artifacts/SHA256SUMS.txt; cp final-artifacts/SHA256SUMS.txt ready-pack/SHA256SUMS.txt
          (cd ready-pack && zip -qr ../GunGloryOnline-v38-READY-PACK.zip .)
      - name: Dedicated server smoke
        shell: bash
        run: |
          set -euo pipefail
          rm -rf ds forge-installer.jar; mkdir ds
          curl -fL --retry 5 --retry-all-errors -o forge-installer.jar https://maven.minecraftforge.net/net/minecraftforge/forge/1.20.1-47.4.10/forge-1.20.1-47.4.10-installer.jar
          java -jar forge-installer.jar --installServer ds >/tmp/forge-install.log 2>&1
          echo 'eula=true' > ds/eula.txt; mkdir -p ds/mods; cp final-artifacts/server/mods/gungloryonline-core-0.9.5-v38.jar ds/mods/
          cd ds; timeout 100s java -Xms512M -Xmx1G @libraries/net/minecraftforge/forge/1.20.1-47.4.10/unix_args.txt nogui > ../dedicated-server-console.log 2>&1 || true; cd ..
          grep -Fq 'Done (' ds/logs/latest.log
          ! grep -Eq 'Exception in server tick loop|Failed to start the minecraft server' ds/logs/latest.log
      - name: Upload v38 build
        uses: actions/upload-artifact@v4
        with:
          name: GunGloryOnline-v38-build
          path: final-artifacts/**
          retention-days: 30
      - name: Upload v38 ready pack
        uses: actions/upload-artifact@v4
        with:
          name: GunGloryOnline-v38-ready-pack
          path: GunGloryOnline-v38-READY-PACK.zip
          retention-days: 30
      - name: Diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: GunGloryOnline-v38-diagnostics
          path: |
            v12-core-build.log
            v12-ui-build.log
            dedicated-server-console.log
            ds/logs/**
          if-no-files-found: ignore
