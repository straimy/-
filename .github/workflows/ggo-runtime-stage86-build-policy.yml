name: GGO Runtime Stage 86 Build Policy

on:
  workflow_dispatch:
  push:
    branches:
      - server/runtime-hardening-v1
    paths:
      - '.github/workflows/ggo-runtime-stage86-build-policy.yml'
      - 'hotfix/GgoClientBuildPolicy.java'
      - 'hotfix/GgoLaunchTicketNetwork.java'
      - 'hotfix/apply_ggo_anticheat_stage82.py'
      - 'deploy/stage85-build-policy.env.example'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      SOURCE_ZIP: gunner-arena-forge-1.20.1-0.6.0-test52-GREPFIX-SOURCE.zip
      EXPECTED_BUILD: runtime-stage85
      EXPECTED_CORE_SHA: 20436c304da3f891f1514fd0e0cf969f61020306d510e8f30353b66be36db403
      EXPECTED_UI_SHA: 0e4f2e7e81e3f460b1d01d5f15bcc087b0d0adafbc1f6134f366f0d44c04af79
    steps:
      - uses: actions/checkout@v4
        with:
          ref: server/runtime-hardening-v1
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Capture exact ref
        id: refs
        run: echo "server_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Validate Stage85 allowlist candidate
        id: config
        shell: bash
        run: |
          set -euo pipefail
          F=deploy/stage85-build-policy.env.example
          test -f "$F"
          grep -qx "GGO_ALLOWED_CLIENT_BUILDS=${EXPECTED_BUILD}" "$F"
          grep -qx "GGO_ALLOWED_CORE_SHA256=${EXPECTED_CORE_SHA}" "$F"
          grep -qx "GGO_ALLOWED_UI_SHA256=${EXPECTED_UI_SHA}" "$F"
          grep -qx 'GGO_ENFORCE_CLIENT_BUILD=0' "$F"
          ! grep -q 'GGO_SERVER_KEY=' "$F"
          ! grep -qi 'bearer\|password\|secret=' "$F"

      - name: Validate policy source boundary
        id: policy
        shell: bash
        run: |
          set -euo pipefail
          P=hotfix/GgoClientBuildPolicy.java
          N=hotfix/GgoLaunchTicketNetwork.java
          test -f "$P" && test -f "$N"
          grep -q 'GGO_ALLOWED_CLIENT_BUILDS' "$P"
          grep -q 'GGO_ALLOWED_CORE_SHA256' "$P"
          grep -q 'GGO_ALLOWED_UI_SHA256' "$P"
          grep -q 'GGO_ENFORCE_CLIENT_BUILD' "$P"
          grep -q 'CLIENT_INTEGRITY' "$P"
          grep -q 'PROTOCOL.*3\|protocol.*3\|PROTOCOL_VERSION.*3' "$N" || grep -q '"3"' "$N" || grep -q '= 3' "$N"
          ! grep -qi 'GGO_SERVER_KEY\|Authorization' "$P"
          ! grep -q 'System.exit' "$P"

      - name: Prepare Forge wrapper
        run: |
          set -euo pipefail
          rm -rf /tmp/ggo-mdk /tmp/ggo-mdk.zip
          curl -fL --retry 3 -o /tmp/ggo-mdk.zip https://maven.minecraftforge.net/net/minecraftforge/forge/1.20.1-47.4.10/forge-1.20.1-47.4.10-mdk.zip
          mkdir -p /tmp/ggo-mdk
          unzip -q /tmp/ggo-mdk.zip 'gradlew' 'gradlew.bat' 'gradle/*' -d /tmp/ggo-mdk

      - name: Build hardened Core with build policy
        id: core
        shell: bash
        run: |
          set -euo pipefail
          rm -rf ga-build stage86 && mkdir ga-build
          unzip -q "$SOURCE_ZIP" -d ga-build
          for patch in \
            apply_ggo_contract_rewards_stage26.py \
            apply_ggo_contract_map_stage27.py \
            apply_ggo_contract_push_stage28.py \
            apply_ggo_contract_persistence_stage29.py \
            apply_ggo_contract_lifecycle_stage30.py \
            apply_ggo_contract_balance_stage31.py \
            apply_ggo_contract_eligibility_stage32.py \
            apply_ggo_supply_lifecycle_stage33.py \
            apply_ggo_extraction_runtime_stage34.py \
            apply_ggo_contract_network_guard_stage36.py \
            apply_ggo_contract_reward_order_stage37.py \
            apply_ggo_compile_baseline_stage27.py \
            apply_ggo_spawn_presence_stage38.py \
            apply_ggo_deminecraft_world_stage39.py \
            apply_ggo_deminecraft_loot_stage41.py \
            apply_ggo_inventory_stage42.py \
            apply_ggo_visible_content_stage43.py \
            apply_ggo_medicine_stage47.py \
            apply_ggo_death_recap_stage48.py \
            apply_ggo_recovery_bag_stage49.py \
            apply_ggo_map_integrity_stage51.py \
            apply_ggo_map_palette_stage54.py \
            apply_ggo_official_auth_stage55.py \
            apply_ggo_pre_auth_quarantine_stage59.py \
            apply_ggo_ui_packets_stage65.py \
            apply_ggo_ui_channel_ownership_stage71.py \
            apply_ggo_anticheat_stage82.py; do
              python3 "hotfix/$patch"
          done
          cp /tmp/ggo-mdk/gradlew ga-build/gradlew
          cp /tmp/ggo-mdk/gradlew.bat ga-build/gradlew.bat
          rm -rf ga-build/gradle && cp -a /tmp/ggo-mdk/gradle ga-build/gradle
          chmod +x ga-build/gradlew
          (cd ga-build && ./gradlew --no-daemon clean build --stacktrace)
          CORE="$(find ga-build/build/libs -type f -name '*.jar' ! -name '*sources*' ! -name '*dev*' | head -n1)"
          test -n "$CORE" && test -f "$CORE"
          mkdir -p stage86
          cp "$CORE" stage86/gungloryonline-core-stage86-policy-check.jar
          cp deploy/stage85-build-policy.env.example stage86/stage85-build-policy.env.example
          (cd stage86 && sha256sum gungloryonline-core-stage86-policy-check.jar stage85-build-policy.env.example > SHA256SUMS)
          jar tf "$CORE" | grep -q 'arena/forge/GgoClientBuildPolicy.class'
          jar tf "$CORE" | grep -q 'arena/forge/GgoLaunchTicketNetwork.class'
          echo "sha256=$(sha256sum "$CORE" | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Verify Stage86 artifact payload
        id: artifact_gate
        shell: bash
        run: |
          set -euo pipefail
          (cd stage86 && sha256sum -c SHA256SUMS)
          grep -qx "GGO_ALLOWED_CLIENT_BUILDS=${EXPECTED_BUILD}" stage86/stage85-build-policy.env.example
          grep -qx "GGO_ALLOWED_CORE_SHA256=${EXPECTED_CORE_SHA}" stage86/stage85-build-policy.env.example
          grep -qx "GGO_ALLOWED_UI_SHA256=${EXPECTED_UI_SHA}" stage86/stage85-build-policy.env.example
          grep -qx 'GGO_ENFORCE_CLIENT_BUILD=0' stage86/stage85-build-policy.env.example

      - uses: actions/upload-artifact@v4
        id: upload
        if: success()
        with:
          name: GunGloryOnline-Stage86-Build-Policy-Check
          path: stage86/**
          if-no-files-found: error
          retention-days: 30

      - name: Publish Stage86 receipt
        if: always()
        env:
          CONFIG_OUTCOME: ${{ steps.config.outcome }}
          POLICY_OUTCOME: ${{ steps.policy.outcome }}
          CORE_OUTCOME: ${{ steps.core.outcome }}
          ARTIFACT_GATE_OUTCOME: ${{ steps.artifact_gate.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
        run: |
          set -euo pipefail
          result=success
          for v in "$CONFIG_OUTCOME" "$POLICY_OUTCOME" "$CORE_OUTCOME" "$ARTIFACT_GATE_OUTCOME" "$UPLOAD_OUTCOME"; do [ "$v" = success ] || result=failure; done
          mkdir -p ci-results
          cat > ci-results/stage86-build-policy.txt <<EOF
          workflow=${GITHUB_WORKFLOW}
          run_id=${GITHUB_RUN_ID}
          run_attempt=${GITHUB_RUN_ATTEMPT}
          run_url=https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          server_sha=${{ steps.refs.outputs.server_sha }}
          allowlist_config=$CONFIG_OUTCOME
          policy_gates=$POLICY_OUTCOME
          core_build=$CORE_OUTCOME
          artifact_payload=$ARTIFACT_GATE_OUTCOME
          upload=$UPLOAD_OUTCOME
          core_sha256=${{ steps.core.outputs.sha256 }}
          allowed_build=${EXPECTED_BUILD}
          allowed_core_sha256=${EXPECTED_CORE_SHA}
          allowed_ui_sha256=${EXPECTED_UI_SHA}
          enforcement_default=off
          authentication_root=one_shot_ticket
          result=$result
          EOF
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ci-results/stage86-build-policy.txt
          git commit -m "ci: record Stage86 build policy ${GITHUB_RUN_ID}" || exit 0
          git fetch origin server/runtime-hardening-v1
          git rebase origin/server/runtime-hardening-v1
          git push origin HEAD:server/runtime-hardening-v1
