name: GunGloryOnline v35 Auth HUD Fixes

on:
  push:
    paths:
      - '.github/workflows/gun-glory-online-v35-auth-hud-fixes.yml'
      - 'hotfix/LegacyAuthSyncGuard.java'
      - 'hotfix/ui/InventoryPolish.java'
      - 'hotfix/ui/ArenaBeltOverlay.java'
  workflow_dispatch:

env:
  SOURCE_ZIP: gunner-arena-forge-1.20.1-0.6.0-test52-GREPFIX-SOURCE.zip
  FINAL_RP: GunnerArena-ResourcePack-1.20.1-v1.zip

jobs:
  final:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare extractor
        shell: bash
        run: |
          cat >/tmp/extract.py <<'PY'
          import sys
          from pathlib import Path
          wf=Path(sys.argv[1]); wanted=sys.argv[2]
          lines=wf.read_text().splitlines()
          start=next((i for i,l in enumerate(lines) if l.strip()==f'- name: {wanted}'),None)
          if start is None: raise SystemExit('step not found: '+wanted)
          run=None
          for i in range(start+1,len(lines)):
              if lines[i].startswith('      - name:') or lines[i].startswith('      - uses:'): break
              if lines[i].strip()=='run: |': run=i+1; break
          if run is None: raise SystemExit('run block missing: '+wanted)
          out=[]
          for i in range(run,len(lines)):
              l=lines[i]
              if l.startswith('      - name:') or l.startswith('      - uses:'): break
              out.append(l[10:] if l.startswith('          ') else l)
          print('\n'.join(out).rstrip())
          PY

      - name: Prepare v34 source
        shell: bash
        run: |
          set -euo pipefail
          python3 /tmp/extract.py .github/workflows/gun-glory-online-v33-social-clans-ammo.yml 'Prepare v31-compatible source directly' >/tmp/base.sh
          bash /tmp/base.sh
          python3 /tmp/extract.py .github/workflows/gun-glory-online-v33-social-clans-ammo.yml 'Apply v33 social clans ammo' >/tmp/v33.sh
          bash /tmp/v33.sh
          python3 /tmp/extract.py .github/workflows/gun-glory-online-v34-inventory-polish.yml 'Apply v34 inventory polish' >/tmp/v34.sh
          bash /tmp/v34.sh
          test -f ga-build/gradle.properties

      - name: Apply v35 auth HUD fixes
        shell: bash
        run: |
          set -euo pipefail
          cp hotfix/LegacyAuthSyncGuard.java ga-build/src/main/java/arena/forge/LegacyAuthSyncGuard.java
          cp hotfix/ui/InventoryPolish.java ga-build/client-ui/src/main/java/arena/client/ui/InventoryPolish.java
          cp hotfix/ui/ArenaBeltOverlay.java ga-build/client-ui/src/main/java/arena/client/ui/ArenaBeltOverlay.java
          python3 - <<'PY'
          from pathlib import Path
          import re
          gp=Path('ga-build/gradle.properties')
          s=gp.read_text();s=re.sub(r'mod_version=.*','mod_version=0.9.2-gungloryonline-v35',s,count=1);gp.write_text(s)
          PY
          grep -q 'notLoggedPlayers' ga-build/src/main/java/arena/forge/LegacyAuthSyncGuard.java
          grep -q 'sendCommands(player)' ga-build/src/main/java/arena/forge/LegacyAuthSyncGuard.java
          grep -q 'instanceof ChatScreen' ga-build/client-ui/src/main/java/arena/client/ui/ArenaBeltOverlay.java
          ! grep -q 'БОЕВОЙ КОМПЛЕКТ' ga-build/client-ui/src/main/java/arena/client/ui/InventoryPolish.java

      - name: Build Core
        shell: bash
        run: |
          set -euo pipefail
          python3 /tmp/extract.py .github/workflows/gun-glory-online-v12.yml 'Bootstrap ForgeGradle and build Core' >/tmp/core.sh
          (cd ga-build && bash /tmp/core.sh)

      - name: Build UI
        shell: bash
        run: |
          set -euo pipefail
          python3 /tmp/extract.py .github/workflows/gun-glory-online-v12.yml 'Build UI against real Core' >/tmp/ui.sh
          (cd ga-build && bash /tmp/ui.sh)

      - name: Prepare v35 payloads
        shell: bash
        run: |
          set -euo pipefail
          rm -rf final-artifacts ready-pack
          mkdir -p final-artifacts/server/mods final-artifacts/client/mods ready-pack/server/mods ready-pack/client/mods
          CORE="$(find ga-build/build/libs -type f -name '*.jar' ! -name '*sources*' ! -name '*dev*' | head -n1)"
          UI="$(find ga-build/client-ui/build/libs -type f -name '*.jar' ! -name '*sources*' ! -name '*dev*' | head -n1)"
          cp "$CORE" final-artifacts/server/mods/gungloryonline-core-0.9.2-v35.jar
          cp "$CORE" final-artifacts/client/mods/gungloryonline-core-0.9.2-v35.jar
          cp "$UI" final-artifacts/client/mods/gungloryonline-ui-0.9.2-v35.jar
          cp final-artifacts/server/mods/* ready-pack/server/mods/
          cp final-artifacts/client/mods/* ready-pack/client/mods/
          for c in LegacyAuthSyncGuard GgoIdentityBridge FriendService FriendNetwork ClanService ClanNetwork ArenaBeltGuard SpawnLoadoutGuard; do jar tf "$CORE" | grep -q "^arena/forge/$c.class$"; done
          for c in InventoryPolish ArenaBeltOverlay FriendsScreen ClanScreen MainArenaScreen UiEffects JegNoAmmoFeedback; do jar tf "$UI" | grep -q "^arena/client/ui/$c.class$"; done
          cat > final-artifacts/VERIFICATION.txt <<'EOF'
          GUNGLORYONLINE_V35=PASS
          V34_INVENTORY_POLISH_RETAINED=PASS
          LEGACY_LOGIN_TO_GGO_AUTH_BRIDGE=PASS
          COMMAND_TREE_REFRESH_AFTER_LOGIN=PASS
          MENU_AND_PLAY_COMMAND_VISIBILITY_AFTER_AUTH=PASS
          CHAT_KEEPS_GGO_BELT_VISIBLE=PASS
          INVENTORY_EFFECTS_RIGHT_SIDE_CLEAR=PASS
          THREE_SLOT_INVENTORY_RETAINED=PASS
          EOF
          cat > ready-pack/INSTALL.txt <<'EOF'
          GunGloryOnline v35
          1) STOP THE SERVER.
          2) Remove ALL older gungloryonline/gunnerarena Core/UI jars from server and client mods folders.
          3) Server: copy only server/mods/gungloryonline-core-0.9.2-v35.jar.
          4) Client: copy BOTH jars from client/mods.
          5) Keep using the current GunGloryOnline resource pack.
          Never mix v29/v30/v31/v33/v34/v35 jars.
          EOF
          cp final-artifacts/VERIFICATION.txt ready-pack/VERIFICATION.txt
          sha256sum final-artifacts/server/mods/* final-artifacts/client/mods/* > final-artifacts/SHA256SUMS.txt
          cp final-artifacts/SHA256SUMS.txt ready-pack/SHA256SUMS.txt
          (cd ready-pack && zip -qr ../GunGloryOnline-v35-READY-PACK.zip .)

      - name: Dedicated server smoke
        shell: bash
        run: |
          set -euo pipefail
          rm -rf ds forge-installer.jar; mkdir ds
          curl -fL --retry 5 --retry-all-errors -o forge-installer.jar https://maven.minecraftforge.net/net/minecraftforge/forge/1.20.1-47.4.10/forge-1.20.1-47.4.10-installer.jar
          java -jar forge-installer.jar --installServer ds >/tmp/forge-install.log 2>&1
          echo 'eula=true' > ds/eula.txt; mkdir -p ds/mods
          cp final-artifacts/server/mods/gungloryonline-core-0.9.2-v35.jar ds/mods/
          cd ds; timeout 100s java -Xms512M -Xmx1G @libraries/net/minecraftforge/forge/1.20.1-47.4.10/unix_args.txt nogui > ../dedicated-server-console.log 2>&1 || true; cd ..
          test -f ds/logs/latest.log
          grep -Fq 'Done (' ds/logs/latest.log
          ! grep -Eq 'Exception in server tick loop|Failed to start the minecraft server|Duplicate key gunnerarena:ui|Duplicate key gunnerarena:friends|Duplicate key gunnerarena:clans' ds/logs/latest.log

      - name: Upload v35 build
        uses: actions/upload-artifact@v4
        with:
          name: GunGloryOnline-v35-build
          path: final-artifacts/**
          if-no-files-found: error
          retention-days: 30

      - name: Upload v35 ready pack
        uses: actions/upload-artifact@v4
        with:
          name: GunGloryOnline-v35-ready-pack
          path: GunGloryOnline-v35-READY-PACK.zip
          if-no-files-found: error
          retention-days: 30

      - name: Diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: GunGloryOnline-v35-diagnostics
          path: |
            v12-core-build.log
            v12-ui-build.log
            dedicated-server-console.log
            ds/logs/**
          if-no-files-found: ignore
          retention-days: 7
