name: GGO Stage 94 Auth Binding Attestation

on:
  workflow_dispatch:
  push:
    branches:
      - launcher/bootstrap-v0.1
    paths:
      - '.github/workflows/ggo-stage94-auth-binding-attestation.yml'
      - '.ci/launcher/stage92-bound-beta-package.txt'
      - 'services/ggo-auth/server.py'
      - 'services/ggo-auth/secure_server.py'
      - 'launcher/hotfix/apply_menu_first_beta_stage76.py'
      - 'launcher/hotfix/apply_client_integrity_stage84.py'
      - 'launcher/hotfix/apply_ticket_binding_stage90.py'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: launcher/bootstrap-v0.1
          fetch-depth: 0

      - name: Verify packaged launcher already includes ticket binding
        id: packaged_launcher
        shell: bash
        run: |
          set -euo pipefail
          R=.ci/launcher/stage92-bound-beta-package.txt
          test -f "$R"
          grep -qx 'launcher_candidate_version=0.2.4' "$R"
          grep -qx 'ticket_build_binding=true' "$R"
          grep -qx 'stage85_integrity=true' "$R"
          grep -qx 'result=success' "$R"

      - name: Verify auth binding source
        id: auth_binding
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile services/ggo-auth/server.py services/ggo-auth/secure_server.py
          CORE=services/ggo-auth/server.py
          A=services/ggo-auth/secure_server.py
          grep -q '^GAME_TICKET_TTL = 3 \* 60$' "$CORE"
          grep -q 'ALTER TABLE game_tickets ADD COLUMN' "$A"
          grep -q 'build_id' "$A"
          grep -q 'core_sha256' "$A"
          grep -q 'ui_sha256' "$A"
          grep -q 'INSERT INTO game_tickets' "$A"
          grep -q 'ticket_build' "$A"
          grep -q '"bound": bound' "$A"
          grep -q 'consumed_at IS NULL' "$A"
          grep -q 'UPDATE game_tickets SET consumed_at=' "$A"
          grep -q 'X-GGO-Server-Key\|server_key_ok' "$A"

      - name: Verify launcher transform requests bound ticket
        id: launcher_binding
        shell: bash
        run: |
          set -euo pipefail
          python3 launcher/hotfix/apply_menu_first_beta_stage76.py
          python3 launcher/hotfix/apply_client_integrity_stage84.py
          python3 launcher/hotfix/apply_ticket_binding_stage90.py
          AUTH=launcher/src-tauri/src/core/ggo_auth.rs
          LIB=launcher/src-tauri/src/lib.rs
          grep -q "build_id: &'a str" "$AUTH"
          grep -q "core_sha256: &'a str" "$AUTH"
          grep -q "ui_sha256: &'a str" "$AUTH"
          grep -q 'ggo_integrity_pair(&root)' "$LIB"
          test "$(grep -c 'let (build_id, core_sha256, ui_sha256) = ggo_integrity_pair(&root)?;' "$LIB")" -eq 1
          grep -q 'GGO_CLIENT_BUILD_ID' "$LIB"
          grep -q 'GGO_CORE_SHA256' "$LIB"
          grep -q 'GGO_UI_SHA256' "$LIB"

      - name: Publish Stage94 receipt
        if: always()
        shell: bash
        env:
          PACKAGED_OUTCOME: ${{ steps.packaged_launcher.outcome }}
          AUTH_OUTCOME: ${{ steps.auth_binding.outcome }}
          LAUNCHER_OUTCOME: ${{ steps.launcher_binding.outcome }}
        run: |
          set -euo pipefail
          result=success
          for v in "$PACKAGED_OUTCOME" "$AUTH_OUTCOME" "$LAUNCHER_OUTCOME"; do
            [ "$v" = success ] || result=failure
          done
          git reset --hard HEAD
          mkdir -p .ci/security
          cat > .ci/security/stage94-auth-binding-attestation.txt <<EOF
          workflow=${GITHUB_WORKFLOW}
          run_id=${GITHUB_RUN_ID}
          launcher_sha=$(git rev-parse HEAD)
          stage92_bound_launcher=$PACKAGED_OUTCOME
          auth_schema_binding=$AUTH_OUTCOME
          auth_one_shot_consume=$AUTH_OUTCOME
          ticket_ttl_seconds=180
          consume_returns_ticket_build=$AUTH_OUTCOME
          launcher_requests_bound_ticket=$LAUNCHER_OUTCOME
          production_deployed=false
          result=$result
          EOF
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .ci/security/stage94-auth-binding-attestation.txt
          git commit -m "ci: record Stage94 auth binding ${GITHUB_RUN_ID}" || exit 0
          git fetch origin launcher/bootstrap-v0.1
          git rebase origin/launcher/bootstrap-v0.1
          git push origin HEAD:launcher/bootstrap-v0.1
