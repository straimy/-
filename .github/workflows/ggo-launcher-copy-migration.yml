name: GGO Launcher Copy Migration

on:
  push:
    branches:
      - launcher/bootstrap-v0.1
    paths:
      - .github/workflows/ggo-launcher-copy-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: launcher/bootstrap-v0.1
          fetch-depth: 0
      - name: Align launcher copy with managed assets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('launcher/src/App.tsx')
          s=p.read_text(encoding='utf-8')
          replacements={
            'address:"2.26.100.125:24842"':'address:"play.kvicloud.ru:24842"',
            'requiredRp:"The server offers the official GGO resource pack on connect. You choose whether to download it."':'requiredRp:"The launcher verifies, downloads and activates the official GGO visual assets automatically."',
            'requiredRp:"Официальный ресурс-пак GGO предлагает сервер при подключении. Скачивать его или нет — решаешь ты."':'requiredRp:"Лаунчер сам проверяет, загружает и активирует обязательные визуальные файлы GGO."',
            'requiredRp:"Офіційний ресурс-пак GGO пропонує сервер під час підключення. Завантажувати його чи ні — вирішуєш ти."':'requiredRp:"Лаунчер сам перевіряє, завантажує та активує обов’язкові візуальні файли GGO."',
            'label:"Resource Packs",hint:"Optional local visual packs"':'label:"Resource Packs",hint:"Official GGO assets + optional local packs"',
            '<b>Server pack is separate</b><span>Official GGO RP is offered by the server on connect and is not forced into this folder.</span>':'<b>Official assets managed</b><span>The launcher verifies and activates GunGloryOnline-Official.zip. Additional local packs stay optional.</span>',
          }
          for old,new in replacements.items():
              if old not in s:
                  raise SystemExit(f'missing expected launcher copy: {old}')
              s=s.replace(old,new)
          if '2.26.100.125:24842' in s:
              raise SystemExit('stale numeric fallback remains')
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add launcher/src/App.tsx
          git commit -m 'fix(launcher): align UI with secure entry and managed assets'
          git fetch origin launcher/bootstrap-v0.1
          git rebase origin/launcher/bootstrap-v0.1
          git push origin HEAD:launcher/bootstrap-v0.1
