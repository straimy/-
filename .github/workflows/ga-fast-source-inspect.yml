name: GA fast source inspect
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/ga-fast-source-inspect.yml'
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect auth and commands
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/ga && mkdir /tmp/ga
          unzip -q gunner-arena-forge-1.20.1-0.6.0-test52-GREPFIX-SOURCE.zip -d /tmp/ga
          cd /tmp/ga
          echo '=== AuthGate.java ==='
          sed -n '1,140p' src/main/java/arena/forge/AuthGate.java
          echo '=== ArenaRuntime imports + login ==='
          sed -n '1,190p' src/main/java/arena/forge/ArenaRuntime.java
          echo '=== ArenaRuntime interactions/tick ==='
          sed -n '300,470p' src/main/java/arena/forge/ArenaRuntime.java
          echo '=== GunnerCommands top ==='
          sed -n '1,210p' src/main/java/arena/forge/GunnerCommands.java
