name: GA fast source inspect
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/ga-fast-source-inspect.yml'
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Inspect SAuth 2.0.0 bytecode
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/sauth.jar 'https://cdn.modrinth.com/data/tyAKpqKg/versions/p5bijuHC/SAuth-2.0.0.jar'
          javap -classpath /tmp/sauth.jar -private -c com.example.examplemod.ServerRegistrationMod | sed -n '1,360p'
