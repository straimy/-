name: GA fast source inspect
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/ga-fast-source-inspect.yml'
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build compact ammo/loadout inspection
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/ga inspection
          mkdir -p /tmp/ga inspection
          unzip -q gunner-arena-forge-1.20.1-0.6.0-test52-GREPFIX-SOURCE.zip -d /tmp/ga
          OUT=inspection/ammo-loadout-inspection.txt
          : > "$OUT"
          for pat in 'requestPlay' 'prepareForRound' 'clearCombatSlots' 'resetForNewRound' 'requestReload' 'reload' 'magazine' 'reserve' 'revolver'; do
            echo "===== $pat =====" >> "$OUT"
            grep -Rni -C 24 "$pat" /tmp/ga --include='*.java' >> "$OUT" || true
            echo >> "$OUT"
          done
          echo '===== RELEVANT FILENAMES =====' >> "$OUT"
          grep -RliE 'requestPlay|prepareForRound|clearCombatSlots|resetForNewRound|requestReload|reload|magazine|reserve|revolver' /tmp/ga --include='*.java' | sort >> "$OUT" || true
          wc -l "$OUT"
      - name: Upload compact inspection
        uses: actions/upload-artifact@v4
        with:
          name: ga-ammo-loadout-inspection
          path: inspection/ammo-loadout-inspection.txt
          if-no-files-found: error
          retention-days: 3
