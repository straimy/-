name: GA fast source inspect
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/ga-fast-source-inspect.yml'
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect skills shop spawn protection and player labels
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/ga inspection
          mkdir -p /tmp/ga inspection
          unzip -q gunner-arena-forge-1.20.1-0.6.0-test52-GREPFIX-SOURCE.zip -d /tmp/ga
          OUT=inspection/ui-gameplay-inspection.txt
          : > "$OUT"
          echo '=== FILENAMES ===' >> "$OUT"
          find /tmp/ga -type f \( -name '*.java' -o -name '*.json' \) | grep -Ei 'skill|shop|player|round|spawn|network|ui|weapon|profile' | sort >> "$OUT" || true
          for pat in 'SkillTree' 'skill' 'credits' 'currency' 'ShopScreen' 'requestCatalog' 'requestBuy' 'PLAYING' 'SPAWNING' 'invulner' 'spawnProtect' 'RenderNameTag' 'RenderNameplate' 'NameTag' 'health' 'hp' 'ArenaPlayerState'; do
            echo "===== $pat =====" >> "$OUT"
            grep -Rni -C 20 "$pat" /tmp/ga --include='*.java' | head -n 600 >> "$OUT" || true
          done
          echo '=== FULL TARGET FILES ===' >> "$OUT"
          for f in $(find /tmp/ga -type f -name '*.java' | grep -Ei 'SkillTreeScreen|SkillTree|Rpg|Progression|ShopScreen|ArenaPlayerManager|ArenaPlayerSession|ArenaNetwork|GunnerArenaUiMod' | head -n 50); do
            echo "----- $f -----" >> "$OUT"
            sed -n '1,420p' "$f" >> "$OUT"
          done
          wc -l "$OUT"
      - name: Upload inspection
        uses: actions/upload-artifact@v4
        with:
          name: ga-ui-gameplay-inspection
          path: inspection/ui-gameplay-inspection.txt
          if-no-files-found: error
          retention-days: 3
