name: GA fast source inspect
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/ga-fast-source-inspect.yml'
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect auth and commands
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/ga && mkdir /tmp/ga
          unzip -q gunner-arena-forge-1.20.1-0.6.0-test52-GREPFIX-SOURCE.zip -d /tmp/ga
          cd /tmp/ga
          echo '=== AUTH STRINGS ==='
          grep -RInE 'Сначала войдите|ВОЙДИ ИЛИ ЗАРЕГИСТРИРУЙСЯ|login <|register <|authenticated|isAuthenticated|auth' src/main/java client-ui/src/main/java 2>/dev/null | head -n 250 || true
          echo '=== COMMAND REGISTRATION ==='
          grep -RInE 'Commands\.literal|RegisterCommandsEvent|literal\("|setnpc|menu' src/main/java 2>/dev/null | head -n 300 || true
          echo '=== PLAYER EVENTS / INVENTORY ==='
          grep -RInE 'PlayerLoggedInEvent|PlayerEvent|inventory|Compass|Items\.COMPASS|InteractionEvent|RightClickItem' src/main/java 2>/dev/null | head -n 300 || true
