name: GGO v22 Economy Inspect
on:
  push:
    paths:
      - '.github/workflows/ggo-v22-economy-inspect.yml'
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect source economy round profile
        shell: bash
        run: |
          set -euo pipefail
          rm -rf srcx; mkdir srcx
          unzip -q gunner-arena-forge-1.20.1-0.6.0-test52-GREPFIX-SOURCE.zip -d srcx
          ROOT="$(find srcx -type d -path '*/src/main/java' | head -n1)"
          echo "ROOT=$ROOT"
          echo '=== ROUND FILES ==='
          grep -RniE 'class .*Round|300L|300\)|600L|600\)|duration|remainingSeconds|roundEnd|winner' "$ROOT/arena" | head -n 220 || true
          echo '=== ECONOMY ==='
          grep -RniE 'roundCredits|credits|killReward|reward|addCredits|spendCredits|resetForNewRound' "$ROOT/arena" | head -n 260 || true
          echo '=== PROFILE CRYSTALS UUID ==='
          grep -RniE 'class .*Profile|crystals|wins|kills|UUID|playerId|accountId|profileId' "$ROOT/arena" | head -n 320 || true
          echo '=== TARGET FILES ==='
          for f in $(grep -RlE 'resetForNewRound|roundCredits|remainingSeconds|crystals' "$ROOT/arena" | head -n 30); do
            echo "--- $f ---"; sed -n '1,260p' "$f"; done
