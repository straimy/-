name: GGO v22 Economy Inspect
on:
  push:
    paths:
      - '.github/workflows/ggo-v22-economy-inspect.yml'
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect core economy round profile
        shell: bash
        run: |
          set -euo pipefail
          rm -rf srcx; mkdir srcx
          unzip -q gunner-arena-forge-1.20.1-0.6.0-test52-GREPFIX-SOURCE.zip -d srcx
          find srcx -maxdepth 5 -type d -path '*/src/main/java' -print
          ROOT="$(find srcx -type d -path '*/src/main/java' ! -path '*client-ui*' | head -n1)"
          echo "CORE_ROOT=$ROOT"
          echo '=== ROUND FILES ==='
          grep -RniE 'class .*Round|300L|300\)|600L|600\)|duration|remainingTicks|roundEnd|winner|PLAYING_TICKS' "$ROOT/arena" | head -n 280 || true
          echo '=== ECONOMY ==='
          grep -RniE 'roundCredits|credits|killReward|reward|addCredits|spendCredits|resetForNewRound|RoundSession' "$ROOT/arena" | head -n 340 || true
          echo '=== PROFILE CRYSTALS UUID ==='
          grep -RniE 'class .*Profile|crystals|roundsWon|kills|UUID|playerId|accountId|profileId' "$ROOT/arena" | head -n 380 || true
          echo '=== TARGET FILES ==='
          for f in $(grep -RlE 'resetForNewRound|roundCredits|remainingTicks|crystals|class RoundSession' "$ROOT/arena" | head -n 40); do
            echo "--- $f ---"; sed -n '1,320p' "$f"; done
