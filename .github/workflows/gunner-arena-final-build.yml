name: Gunner Arena FINAL Forge Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'gunner-arena-forge-1.20.1-0.6.0-test52-GREPFIX-SOURCE.zip'
      - 'GunnerArena-ResourcePack-1.20.1-v1.zip'
      - '.github/workflows/gunner-arena-final-build.yml'

permissions:
  contents: read

env:
  SOURCE_ZIP: gunner-arena-forge-1.20.1-0.6.0-test52-GREPFIX-SOURCE.zip
  FINAL_RP: GunnerArena-ResourcePack-1.20.1-v1.zip

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify inputs
        shell: bash
        run: |
          set -euo pipefail
          java -version
          test -f "$SOURCE_ZIP"
          test -f "$FINAL_RP"
          test "$(stat -c%s "$FINAL_RP")" -gt 1000000 || { echo '::error::Final RP is suspiciously small'; exit 2; }
          unzip -tq "$FINAL_RP"
          unzip -p "$FINAL_RP" pack.mcmeta | grep -q 'pack_format'

      - name: Unpack source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf ga-build
          mkdir ga-build
          unzip -q "$SOURCE_ZIP" -d ga-build
          chmod +x ga-build/*.sh 2>/dev/null || true

      - name: Apply Forge 47.4.10 compatibility fixes
        working-directory: ga-build
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYFIX'
          from pathlib import Path
          p=Path('src/main/java/arena/hazard/ActiveHazard.java'); s=p.read_text()
          s=s.replace('    private final HazardSpec spec;\n    private final long createdTick;', '    private final String dimension;\n    private final HazardSpec spec;\n    private final long createdTick;')
          s=s.replace('    public ActiveHazard(HazardSpec spec, long createdTick) {\n        this(UUID.randomUUID(), spec, createdTick, createdTick + spec.lifetimeTicks());\n    }\n\n    public ActiveHazard(UUID id, HazardSpec spec, long createdTick, long expiresTick) {\n        this.id = id;\n        this.spec = spec;', '    public ActiveHazard(String dimension, HazardSpec spec, long createdTick) {\n        this(UUID.randomUUID(), dimension, spec, createdTick, createdTick + spec.lifetimeTicks());\n    }\n\n    public ActiveHazard(UUID id, String dimension, HazardSpec spec, long createdTick, long expiresTick) {\n        this.id = id;\n        this.dimension = java.util.Objects.requireNonNull(dimension, "dimension");\n        this.spec = spec;')
          s=s.replace('    public UUID id() { return id; }\n    public HazardSpec spec()', '    public UUID id() { return id; }\n    public String dimension() { return dimension; }\n    public HazardSpec spec()'); p.write_text(s)
          p=Path('src/main/java/arena/hazard/HazardManager.java'); p.write_text(p.read_text().replace('ActiveHazard hazard = new ActiveHazard(spec, nowTick);','ActiveHazard hazard = new ActiveHazard(dimension, spec, nowTick);'))
          p=Path('src/main/java/arena/forge/net/ArenaNetwork.java'); p.write_text(p.read_text().replace('PacketDistributor.PLAYER.with(player)','PacketDistributor.PLAYER.with(() -> player)'))
          p=Path('src/main/java/arena/forge/GunnerCommands.java'); s=p.read_text(); s=s.replace('        int desired = runtime.bots().desired(real);\n','        final int realCount = real;\n        int desired = runtime.bots().desired(realCount);\n').replace('+ " real=" + real + " desired=" + desired','+ " real=" + realCount + " desired=" + desired'); p.write_text(s)
          p=Path('client-ui/src/main/java/arena/client/ui/ArenaButton.java'); s=p.read_text().replace('import net.minecraft.client.gui.components.AbstractButton;\n','import net.minecraft.client.gui.components.AbstractButton;\nimport net.minecraft.client.gui.narration.NarrationElementOutput;\n').replace('    @Override public void onPress() { onPress.onPress(this); }\n','    @Override public void onPress() { onPress.onPress(this); }\n\n    @Override\n    protected void updateWidgetNarration(NarrationElementOutput output) {\n        this.defaultButtonNarrationText(output);\n    }\n'); p.write_text(s)
          p=Path('client-ui/src/main/java/arena/client/ui/AbstractArenaScreen.java'); p.write_text(p.read_text().replace('    protected final void installNavigation() { ArenaNavigation.install(this, route); }\n','    protected final void installNavigation() { ArenaNavigation.install(this, route); }\n\n    final ArenaButton addArenaButton(ArenaButton button) { return addRenderableWidget(button); }\n'))
          p=Path('client-ui/src/main/java/arena/client/ui/ArenaNavigation.java'); p.write_text(p.read_text().replace('        screen.addRenderableWidget(button);','        screen.addArenaButton(button);'))
          p=Path('verify-source.sh'); p.write_text(p.read_text().replace("grep -q 'PacketDistributor.PLAYER.with(player)' src/main/java/arena/forge/net/ArenaNetwork.java", "grep -Fq 'PacketDistributor.PLAYER.with(() -> player)' src/main/java/arena/forge/net/ArenaNetwork.java"))
          PYFIX

      - name: Run source verification
        working-directory: ga-build
        shell: bash
        run: |
          set -euo pipefail
          ./verify-source.sh

      - name: Apply single-owner network fix
        working-directory: ga-build
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYNET'
          from pathlib import Path
          p=Path('src/main/java/arena/forge/net/ArenaNetwork.java'); s=p.read_text()
          s=s.replace('import java.util.concurrent.ConcurrentHashMap;\nimport java.util.function.Supplier;', 'import java.util.concurrent.ConcurrentHashMap;\nimport java.util.function.Consumer;\nimport java.util.function.Supplier;')
          s=s.replace('    private static boolean registered;\n\n    private ArenaNetwork() {}', '''    private static boolean registered;\n    private static volatile ClientSink clientSink;\n\n    public interface ClientSink {\n        void onSnapshot(ArenaSnapshot snapshot);\n        void onCatalog(List<CatalogEntry> entries);\n        void onBuyResult(boolean ok, String code, String message, int credits);\n        void onOpenUi(UiTarget target);\n        void onSkillTree(int level, int skillPoints, String specialization, List<SkillEntry> entries);\n    }\n    public static void installClientSink(ClientSink sink) { clientSink = sink; }\n    private static void dispatchClient(Consumer<ClientSink> action) { ClientSink sink = clientSink; if (sink != null) action.accept(sink); }\n\n    private ArenaNetwork() {}''')
          s=s.replace('SnapshotPacket::handleServerNoop','SnapshotPacket::handleClient').replace('CatalogPacket::handleServerNoop','CatalogPacket::handleClient').replace('BuyResultPacket::handleServerNoop','BuyResultPacket::handleClient').replace('OpenUiPacket::handleServerNoop','OpenUiPacket::handleClient').replace('SkillTreePacket::handleServerNoop','SkillTreePacket::handleClient')
          s=s.replace('        static void handleServerNoop(OpenUiPacket ignored, Supplier<NetworkEvent.Context> supplier) { supplier.get().setPacketHandled(true); }','''        static void handleClient(OpenUiPacket packet, Supplier<NetworkEvent.Context> supplier) { NetworkEvent.Context ctx=supplier.get(); ctx.enqueueWork(() -> dispatchClient(sink -> sink.onOpenUi(packet.target))); ctx.setPacketHandled(true); }''')
          s=s.replace('        static void handleServerNoop(SkillTreePacket ignored, Supplier<NetworkEvent.Context> supplier) { supplier.get().setPacketHandled(true); }','''        static void handleClient(SkillTreePacket packet, Supplier<NetworkEvent.Context> supplier) { NetworkEvent.Context ctx=supplier.get(); ctx.enqueueWork(() -> dispatchClient(sink -> sink.onSkillTree(packet.level, packet.skillPoints, packet.specialization, packet.entries))); ctx.setPacketHandled(true); }''')
          s=s.replace('        static void handleServerNoop(SnapshotPacket ignored, Supplier<NetworkEvent.Context> supplier) { supplier.get().setPacketHandled(true); }','''        static void handleClient(SnapshotPacket packet, Supplier<NetworkEvent.Context> supplier) { NetworkEvent.Context ctx=supplier.get(); ctx.enqueueWork(() -> dispatchClient(sink -> sink.onSnapshot(packet.snapshot))); ctx.setPacketHandled(true); }''')
          s=s.replace('        static void handleServerNoop(CatalogPacket ignored, Supplier<NetworkEvent.Context> supplier) { supplier.get().setPacketHandled(true); }','''        static void handleClient(CatalogPacket packet, Supplier<NetworkEvent.Context> supplier) { NetworkEvent.Context ctx=supplier.get(); ctx.enqueueWork(() -> dispatchClient(sink -> sink.onCatalog(packet.entries))); ctx.setPacketHandled(true); }''')
          s=s.replace('        static void handleServerNoop(BuyResultPacket ignored, Supplier<NetworkEvent.Context> supplier) { supplier.get().setPacketHandled(true); }','''        static void handleClient(BuyResultPacket packet, Supplier<NetworkEvent.Context> supplier) { NetworkEvent.Context ctx=supplier.get(); ctx.enqueueWork(() -> dispatchClient(sink -> sink.onBuyResult(packet.ok, packet.code, packet.message, packet.credits))); ctx.setPacketHandled(true); }''')
          p.write_text(s)

          Path('client-ui/src/main/java/arena/client/net/ArenaClientNetwork.java').write_text('''package arena.client.net;\n\nimport arena.forge.net.ArenaNetwork;\nimport arena.net.ArenaSnapshot;\nimport java.util.List;\n\npublic final class ArenaClientNetwork {\n    private static boolean registered;\n    private ArenaClientNetwork() {}\n    public static synchronized void register() {\n        if (registered) return;\n        ArenaNetwork.installClientSink(new ArenaNetwork.ClientSink() {\n            public void onSnapshot(ArenaSnapshot s) { ClientSnapshotStore.accept(new ArenaClientSnapshot(s.authenticated(),s.initialized(),s.playerName(),s.roundState(),s.roundNumber(),s.roundRemainingTicks(),s.roundCredits(),s.coins(),s.crystals(),s.level(),s.xp(),s.skillPoints(),s.kills(),s.deaths(),s.assists(),s.damageDealt(),s.shotsFired(),s.shotsHit(),s.bestKillStreak(),s.roundsPlayed(),s.roundsWon(),s.playTimeSeconds(),s.roundKills(),s.roundDeaths(),s.roundAssists(),s.roundDamage())); }\n            public void onCatalog(List<ArenaNetwork.CatalogEntry> entries) { ClientShopStore.acceptCatalog(entries.stream().map(e -> new ArenaClientShopItem(e.id(),e.displayName(),e.category(),e.slot(),e.price(),e.ammoItem(),e.magazineSize(),e.startingReserve(),e.fireModes(),e.scope(),e.available(),e.quarantined())).toList()); }\n            public void onBuyResult(boolean ok,String code,String message,int credits) { ClientShopStore.acceptResult(ok,message); requestSnapshot(); }\n            public void onOpenUi(ArenaNetwork.UiTarget target) { arena.client.ui.ClientUiOpener.open(target == null ? 0 : target.ordinal()); }\n            public void onSkillTree(int level,int skillPoints,String specialization,List<ArenaNetwork.SkillEntry> entries) { ClientSkillTreeStore.accept(level,skillPoints,specialization,entries.stream().map(e -> new ArenaClientSkillEntry(e.id(),e.name(),e.branch(),e.cost(),e.minLevel(),e.prerequisites(),e.major(),e.active(),e.unlocked(),e.available(),e.reason())).toList()); }\n        });\n        registered=true;\n    }\n    public static void requestSnapshot(){ArenaNetwork.CHANNEL.sendToServer(new ArenaNetwork.SnapshotRequest());}\n    public static void requestCatalog(){ArenaNetwork.CHANNEL.sendToServer(new ArenaNetwork.CatalogRequest());}\n    public static void requestReload(){ArenaNetwork.CHANNEL.sendToServer(new ArenaNetwork.WeaponActionRequest(ArenaNetwork.WeaponAction.RELOAD));}\n    public static void requestCycleFireMode(){ArenaNetwork.CHANNEL.sendToServer(new ArenaNetwork.WeaponActionRequest(ArenaNetwork.WeaponAction.CYCLE_FIREMODE));}\n    public static void requestSkillTree(){ArenaNetwork.CHANNEL.sendToServer(new ArenaNetwork.SkillTreeRequest());}\n    public static void unlockSkill(String id){if(id!=null&&!id.isBlank()&&id.length()<=64)ArenaNetwork.CHANNEL.sendToServer(new ArenaNetwork.SkillUnlockRequest(id.trim()));}\n    public static void buy(String id){if(id!=null&&!id.isBlank()&&id.length()<=128)ArenaNetwork.CHANNEL.sendToServer(new ArenaNetwork.BuyRequest(id.trim()));}\n}\n''')
          p=Path('client-ui/build.gradle'); s=p.read_text().replace('dependencies { minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}" }','''dependencies {\n    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"\n    implementation files('libs/gunnerarena-core.jar')\n}'''); p.write_text(s)
          p=Path('client-ui/src/main/resources/META-INF/mods.toml'); s=p.read_text(); s += '''\n[[dependencies.${mod_id}]]\nmodId="gunnerarena"\nmandatory=true\nversionRange="[0.6.0,)"\nordering="AFTER"\nside="CLIENT"\n'''; p.write_text(s)
          assert Path('src/main/java/arena/forge/net/ArenaNetwork.java').read_text().count('newSimpleChannel(')==1
          assert 'newSimpleChannel' not in Path('client-ui/src/main/java/arena/client/net/ArenaClientNetwork.java').read_text()
          PYNET

      - name: Bootstrap ForgeGradle wrapper
        working-directory: ga-build
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/forge-mdk /tmp/forge-mdk.zip
          curl -fL --retry 3 -o /tmp/forge-mdk.zip https://maven.minecraftforge.net/net/minecraftforge/forge/1.20.1-47.4.10/forge-1.20.1-47.4.10-mdk.zip
          mkdir -p /tmp/forge-mdk
          unzip -q /tmp/forge-mdk.zip 'gradlew' 'gradlew.bat' 'gradle/*' -d /tmp/forge-mdk
          cp /tmp/forge-mdk/gradlew .; cp /tmp/forge-mdk/gradlew.bat .; cp -a /tmp/forge-mdk/gradle .; chmod +x gradlew

      - name: Build Forge Core
        working-directory: ga-build
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon clean build --stacktrace 2>&1 | tee ../forge-core-build.log

      - name: Build Client UI against Core
        working-directory: ga-build
        shell: bash
        run: |
          set -euo pipefail
          CORE_JAR="$(find build/libs -type f -name '*.jar' ! -name '*sources*' ! -name '*dev*' | head -n1)"
          mkdir -p client-ui/libs
          cp "$CORE_JAR" client-ui/libs/gunnerarena-core.jar
          cp gradlew client-ui/gradlew; cp gradlew.bat client-ui/gradlew.bat; rm -rf client-ui/gradle; cp -a gradle client-ui/gradle; chmod +x client-ui/gradlew
          (cd client-ui && ./gradlew --no-daemon clean build --stacktrace) 2>&1 | tee ../client-ui-build.log

      - name: Collect and audit release inputs
        shell: bash
        run: |
          set -euo pipefail
          rm -rf final-artifacts
          mkdir -p final-artifacts/server/mods final-artifacts/client/mods final-artifacts/client/resourcepacks
          CORE_JAR="$(find ga-build/build/libs -type f -name '*.jar' ! -name '*sources*' ! -name '*dev*' | head -n1)"
          UI_JAR="$(find ga-build/client-ui/build/libs -type f -name '*.jar' ! -name '*sources*' ! -name '*dev*' | head -n1)"
          jar tf "$CORE_JAR" | grep -q '^arena/GunnerArenaMod.class$'
          jar tf "$CORE_JAR" | grep -q '^arena/bot/BotBrain.class$'
          jar tf "$CORE_JAR" | grep -q '^arena/bot/BotDirector.class$'
          jar tf "$CORE_JAR" | grep -q '^arena/bot/BotTokenService.class$'
          jar tf "$UI_JAR" | grep -q '^arena/client/net/ArenaClientNetwork.class$'
          unzip -p "$UI_JAR" META-INF/mods.toml | grep -q 'modId="gunnerarena"'
          test "$(stat -c%s "$FINAL_RP")" -gt 1000000
          cp "$CORE_JAR" final-artifacts/server/mods/
          cp "$CORE_JAR" final-artifacts/client/mods/
          cp "$UI_JAR" final-artifacts/client/mods/
          cp "$FINAL_RP" final-artifacts/client/resourcepacks/
          printf 'AI_GUNNER_1_5_CORE=present\nAI_GUNNER_EXTERNAL_CLIENT=not_bundled\nFINAL_RP=%s\n' "$FINAL_RP" > final-artifacts/CONTENT-AUDIT.txt

      - name: Dedicated Forge server smoke test
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dedicated-smoke forge-installer.jar dedicated-server-console.log
          mkdir dedicated-smoke
          curl -fL --retry 3 -o forge-installer.jar https://maven.minecraftforge.net/net/minecraftforge/forge/1.20.1-47.4.10/forge-1.20.1-47.4.10-installer.jar
          (cd dedicated-smoke && java -jar ../forge-installer.jar --installServer)
          mkdir -p dedicated-smoke/mods; cp final-artifacts/server/mods/*.jar dedicated-smoke/mods/; echo 'eula=true' > dedicated-smoke/eula.txt
          cd dedicated-smoke; chmod +x run.sh; ./run.sh nogui > ../dedicated-server-console.log 2>&1 & PID=$!
          READY=0; for _ in $(seq 1 180); do [ -f logs/latest.log ] && grep -Fq 'Done (' logs/latest.log && { READY=1; break; }; kill -0 "$PID" 2>/dev/null || break; sleep 1; done
          [ "$READY" = 1 ] || { cat ../dedicated-server-console.log; exit 8; }
          grep -Fqi '{gunnerarena}' logs/debug.log
          kill "$PID" 2>/dev/null || true; wait "$PID" 2>/dev/null || true
          cp logs/latest.log ../dedicated-server-latest.log; cd ..

      - name: Real client smoke with Core + UI JAR
        shell: bash
        run: |
          set -euo pipefail
          command -v xvfb-run >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y xvfb; }
          rm -rf client-smoke client-smoke.log
          mkdir client-smoke
          unzip -q /tmp/forge-mdk.zip -d client-smoke
          cat > client-smoke/build.gradle <<'GRADLE'
          plugins { id 'net.minecraftforge.gradle' version '[6.0,6.2)' }
          java.toolchain.languageVersion = JavaLanguageVersion.of(17)
          minecraft {
              mappings channel: 'official', version: '1.20.1'
              runs { client { workingDirectory project.file('run'); property 'forge.logging.console.level','info' } }
          }
          repositories { mavenCentral() }
          dependencies { minecraft 'net.minecraftforge:forge:1.20.1-47.4.10' }
          GRADLE
          cat > client-smoke/settings.gradle <<'GRADLE'
          pluginManagement { repositories { gradlePluginPortal(); maven { url='https://maven.minecraftforge.net/' } } }
          rootProject.name='ga-client-smoke'
          GRADLE
          mkdir -p client-smoke/run/mods
          cp final-artifacts/client/mods/*.jar client-smoke/run/mods/
          cd client-smoke; chmod +x gradlew
          xvfb-run -a ./gradlew --no-daemon runClient --stacktrace > ../client-smoke.log 2>&1 & PID=$!
          READY=0
          for _ in $(seq 1 240); do
            LOG=run/logs/latest.log
            if [ -f "$LOG" ] && grep -Fq 'Reloading ResourceManager:' "$LOG" && grep -Fq 'gunnerarena' "$LOG" && grep -Fq 'gunnerarena_ui' "$LOG"; then READY=1; break; fi
            kill -0 "$PID" 2>/dev/null || break
            sleep 1
          done
          if [ -f run/logs/latest.log ] && grep -Eqi 'duplicate channel|ModLoadingException|Failed to create mod instance|Exception in thread "Render thread"' run/logs/latest.log; then cat run/logs/latest.log; exit 11; fi
          [ "$READY" = 1 ] || { cat ../client-smoke.log; cat run/logs/latest.log 2>/dev/null || true; exit 12; }
          kill "$PID" 2>/dev/null || true; wait "$PID" 2>/dev/null || true
          cp run/logs/latest.log ../client-smoke-latest.log
          cd ..

      - name: Assemble FULL release
        shell: bash
        run: |
          set -euo pipefail
          cp dedicated-server-latest.log final-artifacts/DEDICATED-SERVER-SMOKE.log
          cp client-smoke-latest.log final-artifacts/CLIENT-SMOKE.log
          cat > final-artifacts/INSTALL.txt <<'EOF'
          KVICloud / Gunner Arena Forge 1.20.1
          Java 17 + Forge 47.4.10.
          Server: copy server/mods/*.jar to mods/.
          Client: copy client/mods/*.jar to mods/ and client/resourcepacks/*.zip to resourcepacks/.
          Core owns the gunnerarena:ui network channel; UI only attaches client handlers.
          AI Gunner 1.5 decision/autofill core is inside Core JAR. External AI Gunner Minecraft client process is NOT bundled in this repository.
          EOF
          (cd final-artifacts && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum) > final-artifacts/SHA256SUMS.txt
          rm -f KVICloud-GunnerArena-FULL.zip
          (cd final-artifacts && zip -qr ../KVICloud-GunnerArena-FULL.zip .)
          unzip -tq KVICloud-GunnerArena-FULL.zip
          sha256sum KVICloud-GunnerArena-FULL.zip

      - name: Upload FULL build
        uses: actions/upload-artifact@v4
        with:
          name: KVICloud-GunnerArena-FULL
          path: KVICloud-GunnerArena-FULL.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload failure reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: GunnerArena-build-failure-reports
          path: |
            forge-core-build.log
            client-ui-build.log
            dedicated-server-console.log
            dedicated-smoke/logs/**
            client-smoke.log
            client-smoke/run/logs/**
          if-no-files-found: ignore
          retention-days: 7
