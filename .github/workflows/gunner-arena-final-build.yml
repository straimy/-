name: Gunner Arena FINAL Forge Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'gunner-arena-forge-1.20.1-0.6.0-test52-GREPFIX-SOURCE.zip'
      - '.github/workflows/gunner-arena-final-build.yml'

permissions:
  contents: read

env:
  SOURCE_ZIP: gunner-arena-forge-1.20.1-0.6.0-test52-GREPFIX-SOURCE.zip

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Java 17
        shell: bash
        run: |
          set -euo pipefail
          java -version
          javac -version
          JAVA_MAJOR="$(java -XshowSettings:properties -version 2>&1 | awk -F'= ' '/^[[:space:]]*java.version = /{print $2; exit}' | cut -d. -f1)"
          test "$JAVA_MAJOR" = "17" || { echo "::error::Java 17 required, got $JAVA_MAJOR"; exit 2; }

      - name: Require source archive
        shell: bash
        run: |
          set -euo pipefail
          test -f "$SOURCE_ZIP" || {
            echo "::error::Missing $SOURCE_ZIP in repository root"
            exit 3
          }
          sha256sum "$SOURCE_ZIP"

      - name: Unpack source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf ga-build
          mkdir ga-build
          unzip -q "$SOURCE_ZIP" -d ga-build
          chmod +x ga-build/*.sh 2>/dev/null || true

      - name: Apply Forge 47.4.10 compile compatibility fixes
        working-directory: ga-build
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYFIX'
          from pathlib import Path

          p = Path('src/main/java/arena/hazard/ActiveHazard.java')
          s = p.read_text()
          s = s.replace('    private final HazardSpec spec;\n    private final long createdTick;', '    private final String dimension;\n    private final HazardSpec spec;\n    private final long createdTick;')
          s = s.replace('    public ActiveHazard(HazardSpec spec, long createdTick) {\n        this(UUID.randomUUID(), spec, createdTick, createdTick + spec.lifetimeTicks());\n    }\n\n    public ActiveHazard(UUID id, HazardSpec spec, long createdTick, long expiresTick) {\n        this.id = id;\n        this.spec = spec;', '    public ActiveHazard(String dimension, HazardSpec spec, long createdTick) {\n        this(UUID.randomUUID(), dimension, spec, createdTick, createdTick + spec.lifetimeTicks());\n    }\n\n    public ActiveHazard(UUID id, String dimension, HazardSpec spec, long createdTick, long expiresTick) {\n        this.id = id;\n        this.dimension = java.util.Objects.requireNonNull(dimension, "dimension");\n        this.spec = spec;')
          s = s.replace('    public UUID id() { return id; }\n    public HazardSpec spec()', '    public UUID id() { return id; }\n    public String dimension() { return dimension; }\n    public HazardSpec spec()')
          p.write_text(s)

          p = Path('src/main/java/arena/hazard/HazardManager.java')
          p.write_text(p.read_text().replace('ActiveHazard hazard = new ActiveHazard(spec, nowTick);', 'ActiveHazard hazard = new ActiveHazard(dimension, spec, nowTick);'))

          p = Path('src/main/java/arena/forge/net/ArenaNetwork.java')
          p.write_text(p.read_text().replace('PacketDistributor.PLAYER.with(player)', 'PacketDistributor.PLAYER.with(() -> player)'))

          p = Path('src/main/java/arena/forge/GunnerCommands.java')
          s = p.read_text()
          s = s.replace('        int desired = runtime.bots().desired(real);\n', '        final int realCount = real;\n        int desired = runtime.bots().desired(realCount);\n')
          s = s.replace('+ " real=" + real + " desired=" + desired', '+ " real=" + realCount + " desired=" + desired')
          p.write_text(s)

          p = Path('client-ui/src/main/java/arena/client/ui/ArenaButton.java')
          s = p.read_text()
          s = s.replace('import net.minecraft.client.gui.components.AbstractButton;\n', 'import net.minecraft.client.gui.components.AbstractButton;\nimport net.minecraft.client.gui.narration.NarrationElementOutput;\n')
          s = s.replace('    @Override public void onPress() { onPress.onPress(this); }\n', '    @Override public void onPress() { onPress.onPress(this); }\n\n    @Override\n    protected void updateWidgetNarration(NarrationElementOutput output) {\n        this.defaultButtonNarrationText(output);\n    }\n')
          p.write_text(s)

          p = Path('client-ui/src/main/java/arena/client/ui/AbstractArenaScreen.java')
          s = p.read_text()
          s = s.replace('    protected final void installNavigation() { ArenaNavigation.install(this, route); }\n', '    protected final void installNavigation() { ArenaNavigation.install(this, route); }\n\n    final ArenaButton addArenaButton(ArenaButton button) {\n        return addRenderableWidget(button);\n    }\n')
          p.write_text(s)

          p = Path('client-ui/src/main/java/arena/client/ui/ArenaNavigation.java')
          p.write_text(p.read_text().replace('        screen.addRenderableWidget(button);', '        screen.addArenaButton(button);'))

          p = Path('verify-source.sh')
          p.write_text(p.read_text().replace("grep -q 'PacketDistributor.PLAYER.with(player)' src/main/java/arena/forge/net/ArenaNetwork.java", "grep -Fq 'PacketDistributor.PLAYER.with(() -> player)' src/main/java/arena/forge/net/ArenaNetwork.java"))
          PYFIX

      - name: Run source verification
        working-directory: ga-build
        shell: bash
        run: |
          set -euo pipefail
          test -x ./verify-source.sh || { echo "::error::verify-source.sh missing"; exit 4; }
          ./verify-source.sh

      - name: Bootstrap official Forge 47.4.10 Gradle wrapper
        working-directory: ga-build
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x ./gradlew ] || [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            rm -rf /tmp/forge-mdk /tmp/forge-mdk.zip
            curl -fL --retry 3 --retry-delay 2 \
              -o /tmp/forge-mdk.zip \
              https://maven.minecraftforge.net/net/minecraftforge/forge/1.20.1-47.4.10/forge-1.20.1-47.4.10-mdk.zip
            echo '31133abd261aa4d23672d1820db06ccec80326ad  /tmp/forge-mdk.zip' | sha1sum -c -
            mkdir -p /tmp/forge-mdk
            unzip -q /tmp/forge-mdk.zip 'gradlew' 'gradlew.bat' 'gradle/*' -d /tmp/forge-mdk
            cp /tmp/forge-mdk/gradlew .
            cp /tmp/forge-mdk/gradlew.bat .
            cp -a /tmp/forge-mdk/gradle .
            chmod +x gradlew
          fi
          ./gradlew --version

      - name: Build Forge Core
        working-directory: ga-build
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon clean build --stacktrace --warning-mode all 2>&1 | tee ../forge-core-build.log

      - name: Bootstrap Client UI wrapper
        working-directory: ga-build
        shell: bash
        run: |
          set -euo pipefail
          test -d client-ui || { echo "::error::client-ui module missing"; exit 5; }
          cp gradlew client-ui/gradlew
          cp gradlew.bat client-ui/gradlew.bat
          rm -rf client-ui/gradle
          cp -a gradle client-ui/gradle
          chmod +x client-ui/gradlew

      - name: Build Client UI
        working-directory: ga-build/client-ui
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon clean build --stacktrace --warning-mode all 2>&1 | tee ../../client-ui-build.log

      - name: Build resource pack
        working-directory: ga-build
        shell: bash
        run: |
          set -euo pipefail
          if [ -x ./build-resource-pack.sh ]; then
            ./build-resource-pack.sh
          fi

      - name: Collect and verify artifacts
        shell: bash
        run: |
          set -euo pipefail
          rm -rf final-artifacts
          mkdir -p final-artifacts/server/mods final-artifacts/client/mods final-artifacts/client/resourcepacks

          CORE_JAR="$(find ga-build/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*sources*' ! -name '*dev*' | sort | head -n1)"
          UI_JAR="$(find ga-build/client-ui/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*sources*' ! -name '*dev*' | sort | head -n1)"

          test -n "$CORE_JAR" || { echo '::error::Core JAR not found'; exit 6; }
          test -n "$UI_JAR" || { echo '::error::UI JAR not found'; exit 7; }

          echo "Core: $CORE_JAR"
          echo "UI:   $UI_JAR"

          jar tf "$CORE_JAR" | grep -q '^META-INF/mods.toml$'
          jar tf "$CORE_JAR" | grep -q '^arena/GunnerArenaMod.class$'
          jar tf "$UI_JAR" | grep -q '^META-INF/mods.toml$'

          cp "$CORE_JAR" final-artifacts/server/mods/
          cp "$CORE_JAR" final-artifacts/client/mods/
          cp "$UI_JAR" final-artifacts/client/mods/

          RP="$(find ga-build/dist -maxdepth 1 -type f -name 'KVICloud-GunnerArena-RP-*.zip' | sort | head -n1 || true)"
          if [ -n "$RP" ]; then
            cp "$RP" final-artifacts/client/resourcepacks/
          fi

          cp ga-build/INTEGRATION-MANIFEST.properties final-artifacts/ 2>/dev/null || true
          cp ga-build/FULL-INTEGRATION-TEST48.md final-artifacts/ 2>/dev/null || true
          cp ga-build/STAGE1-BLOCKER-TEST49.md final-artifacts/ 2>/dev/null || true

      - name: Dedicated Forge server smoke test
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dedicated-smoke forge-installer.jar dedicated-server-console.log
          mkdir -p dedicated-smoke
          curl -fL --retry 3 --retry-delay 2 \
            -o forge-installer.jar \
            https://maven.minecraftforge.net/net/minecraftforge/forge/1.20.1-47.4.10/forge-1.20.1-47.4.10-installer.jar
          (cd dedicated-smoke && java -jar ../forge-installer.jar --installServer)
          mkdir -p dedicated-smoke/mods
          cp final-artifacts/server/mods/*.jar dedicated-smoke/mods/
          echo 'eula=true' > dedicated-smoke/eula.txt
          chmod +x dedicated-smoke/run.sh

          cd dedicated-smoke
          ./run.sh nogui > ../dedicated-server-console.log 2>&1 &
          SERVER_PID=$!
          READY=0
          for _ in $(seq 1 180); do
            if [ -f logs/latest.log ] && grep -Fq 'Done (' logs/latest.log; then
              READY=1
              break
            fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              break
            fi
            sleep 1
          done

          if [ "$READY" -ne 1 ]; then
            echo '::error::Dedicated Forge server did not reach Done state'
            cat ../dedicated-server-console.log || true
            cat logs/latest.log || true
            exit 8
          fi

          grep -qi 'gunnerarena' logs/latest.log || {
            echo '::error::Dedicated server reached Done but Gunner Arena was not observed in Forge log'
            cat logs/latest.log
            exit 9
          }

          if grep -Eqi 'Failed to load mod|ModLoadingException|Exception in thread "main"|Failed to start the minecraft server' logs/latest.log; then
            echo '::error::Fatal mod/server loading error detected after startup'
            cat logs/latest.log
            exit 10
          fi

          kill "$SERVER_PID" 2>/dev/null || true
          wait "$SERVER_PID" 2>/dev/null || true
          cp logs/latest.log ../dedicated-server-latest.log
          cd ..
          echo 'DEDICATED_SERVER_SMOKE_OK'

      - name: Assemble FULL release
        shell: bash
        run: |
          set -euo pipefail
          cat > final-artifacts/INSTALL.txt <<'EOF'
          KVICloud / Gunner Arena Forge 1.20.1

          SERVER:
          - Java 17
          - Forge 1.20.1 / 47.4.10
          - put server/mods/*.jar into the server mods folder

          CLIENT:
          - Forge 1.20.1 / 47.4.10
          - put client/mods/*.jar into .minecraft/mods
          - put client/resourcepacks/*.zip into .minecraft/resourcepacks

          BUILD STATUS:
          - Forge Core compiled
          - Client UI compiled
          - Resource Pack assembled
          - Dedicated Forge 47.4.10 server reached Done with Gunner Arena Core loaded
          EOF
          cp dedicated-server-latest.log final-artifacts/DEDICATED-SERVER-SMOKE.log
          (cd final-artifacts && find . -type f ! -name 'SHA256SUMS.txt' -print0 | sort -z | xargs -0 sha256sum) > final-artifacts/SHA256SUMS.txt
          rm -f KVICloud-GunnerArena-FULL.zip
          (cd final-artifacts && zip -qr ../KVICloud-GunnerArena-FULL.zip .)
          sha256sum KVICloud-GunnerArena-FULL.zip
          find final-artifacts -maxdepth 4 -type f -print | sort

      - name: Upload FULL build
        uses: actions/upload-artifact@v4
        with:
          name: KVICloud-GunnerArena-FULL
          path: KVICloud-GunnerArena-FULL.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload Gradle/runtime reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: GunnerArena-build-failure-reports
          path: |
            ga-build/build/reports/**
            ga-build/client-ui/build/reports/**
            forge-core-build.log
            client-ui-build.log
            dedicated-server-console.log
            dedicated-smoke/logs/**
          if-no-files-found: ignore
          retention-days: 7
