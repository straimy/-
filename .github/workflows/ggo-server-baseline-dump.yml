name: GGO Server Baseline Dump

on:
  workflow_dispatch:
  push:
    branches:
      - server/runtime-hardening-v1
    paths:
      - '.github/workflows/ggo-server-baseline-dump.yml'

permissions:
  contents: write

jobs:
  dump:
    runs-on: ubuntu-latest
    env:
      SOURCE_ZIP: gunner-arena-forge-1.20.1-0.6.0-test52-GREPFIX-SOURCE.zip
    steps:
      - uses: actions/checkout@v4
      - name: Extract exact command source
        run: |
          set -euo pipefail
          rm -rf ga-build && mkdir ga-build
          unzip -q "$SOURCE_ZIP" -d ga-build
          mkdir -p diagnostics
          sed -n '650,715p' ga-build/src/main/java/arena/forge/GunnerCommands.java > diagnostics/server-command-baseline.txt
      - name: Publish diagnostic snapshot
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add diagnostics/server-command-baseline.txt
          git commit -m "ci: capture exact server command baseline" || exit 0
          git fetch origin "$GITHUB_REF_NAME"
          git rebase "origin/$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
