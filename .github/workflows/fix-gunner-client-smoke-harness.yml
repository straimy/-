name: Fix Gunner client smoke harness

on:
  push:
    paths:
      - '.github/workflows/fix-gunner-client-smoke-harness.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch client smoke ForgeGradle outputs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/gunner-arena-final-build-v3.yml')
          s=p.read_text()
          old="          cd cs; chmod +x gradlew\n          xvfb-run -a ./gradlew --no-daemon runClient --stacktrace > ../client-smoke.log 2>&1 & P=$!"
          new="          cd cs; chmod +x gradlew\n          mkdir -p build/resources/main build/classes/java/main\n          xvfb-run -a ./gradlew --no-daemon runClient --stacktrace > ../client-smoke.log 2>&1 & P=$!"
          if new in s:
              print('already patched')
          else:
              if old not in s:
                  raise SystemExit('client smoke anchor not found')
              p.write_text(s.replace(old,new,1))
          PY
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/gunner-arena-final-build-v3.yml
          git commit -m 'Fix client smoke ForgeGradle output paths'
          git push
