name: AI Gunner 1.5 dev11 Build

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/ai-gunner-1.5-dev11-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout AI Gunner build branch
        uses: actions/checkout@v4
        with:
          ref: ai-gunner-1.5-build

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Restore dev10 and apply dev11 patch
        shell: bash
        run: |
          set -euxo pipefail
          cat ai-gunner-1.5/dev10-source.part-*.b64 | base64 --decode > /tmp/dev10-source.zip
          rm -rf /tmp/aigunner
          mkdir -p /tmp/aigunner
          unzip -q /tmp/dev10-source.zip -d /tmp/aigunner
          python3 ai-gunner-1.5/dev11-apply.py
          grep -q 'mod_version=1.5.0-dev11' /tmp/aigunner/ai-gunner-dev10/gradle.properties

      - name: Build dev11
        working-directory: /tmp/aigunner/ai-gunner-dev10
        run: gradle build --no-daemon --stacktrace

      - name: Package source
        shell: bash
        run: |
          cd /tmp/aigunner
          zip -qr /tmp/ai-gunner-jeg-forge-1.20.1-1.5.0-dev11-SOURCE.zip ai-gunner-dev10

      - name: Upload dev11 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ai-gunner-1.5-dev11
          path: |
            /tmp/aigunner/ai-gunner-dev10/build/libs/ai-gunner-jeg-forge-1.20.1-1.5.0-dev11.jar
            /tmp/ai-gunner-jeg-forge-1.20.1-1.5.0-dev11-SOURCE.zip
          if-no-files-found: error
