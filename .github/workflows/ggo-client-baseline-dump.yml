name: GGO Client Baseline Dump

on:
  workflow_dispatch:
  push:
    branches:
      - client/runtime-migration-v1
    paths:
      - '.github/workflows/ggo-client-baseline-dump.yml'

permissions:
  contents: write

jobs:
  dump:
    runs-on: ubuntu-latest
    env:
      SOURCE_ZIP: gunner-arena-forge-1.20.1-0.6.0-test52-GREPFIX-SOURCE.zip
    steps:
      - uses: actions/checkout@v4
      - name: Extract exact legacy UI sources
        run: |
          set -euo pipefail
          rm -rf ga-build && mkdir ga-build
          unzip -q "$SOURCE_ZIP" -d ga-build
          mkdir -p diagnostics
          {
            echo '===== ArenaButton.java ====='
            cat ga-build/client-ui/src/main/java/arena/client/ui/ArenaButton.java
            echo
            echo '===== ArenaNavigation.java ====='
            cat ga-build/client-ui/src/main/java/arena/client/ui/ArenaNavigation.java
          } > diagnostics/client-ui-baseline.txt
      - name: Publish diagnostic snapshot
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add diagnostics/client-ui-baseline.txt
          git commit -m "ci: capture exact client ui baseline" || exit 0
          git fetch origin "$GITHUB_REF_NAME"
          git rebase "origin/$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
