name: GGO Runtime Stage 70 Final Distribution

on:
  workflow_dispatch:
  push:
    branches:
      - client/runtime-migration-v1
    paths:
      - 'hotfix/final_distribution_trigger.txt'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    env:
      SOURCE_ZIP: gunner-arena-forge-1.20.1-0.6.0-test52-GREPFIX-SOURCE.zip
    steps:
      - name: Checkout client runtime
        uses: actions/checkout@v4
        with:
          ref: client/runtime-migration-v1
          path: client-src
          fetch-depth: 0
      - name: Checkout server runtime
        uses: actions/checkout@v4
        with:
          ref: server/runtime-hardening-v1
          path: server-src
          fetch-depth: 0
      - name: Checkout launcher platform
        uses: actions/checkout@v4
        with:
          ref: launcher/bootstrap-v0.1
          path: launcher-src
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable

      - name: Capture exact refs and prerequisite receipts
        id: refs
        run: |
          set -euo pipefail
          client_sha=$(git -C client-src rev-parse HEAD)
          server_sha=$(git -C server-src rev-parse HEAD)
          launcher_sha=$(git -C launcher-src rev-parse HEAD)
          echo "client_sha=$client_sha" >> "$GITHUB_OUTPUT"
          echo "server_sha=$server_sha" >> "$GITHUB_OUTPUT"
          echo "launcher_sha=$launcher_sha" >> "$GITHUB_OUTPUT"

          stage69=client-src/ci-results/stage69-brand-clean-ui.txt
          test -f "$stage69"
          grep -q '^result=success$' "$stage69"
          stage69_run=$(sed -n 's/^run_id=//p' "$stage69" | head -n1)
          stage69_sha=$(sed -n 's/^client_sha=//p' "$stage69" | head -n1)
          test -n "$stage69_run" && test -n "$stage69_sha"
          git -C client-src merge-base --is-ancestor "$stage69_sha" "$client_sha"
          echo "stage69_run=$stage69_run" >> "$GITHUB_OUTPUT"
          echo "stage69_sha=$stage69_sha" >> "$GITHUB_OUTPUT"

          select_compatible() {
            local dir="$1"; shift
            local key="$1"; shift
            local receipt sha
            while IFS= read -r receipt; do
              grep -q '^result=success$' "$receipt" || continue
              sha=$(sed -n "s/^${key}=//p" "$receipt" | head -n1)
              test -n "$sha" || continue
              if git -C launcher-src cat-file -e "${sha}^{commit}" 2>/dev/null && git -C launcher-src diff --quiet "$sha" HEAD -- "$@"; then
                printf '%s\n' "$receipt"
                return 0
              fi
            done < <(find "$dir" -maxdepth 1 -type f -name '*.txt' | sort -V -r)
            return 1
          }

          windows=$(select_compatible launcher-src/.ci/windows source_sha launcher)
          linux=$(select_compatible launcher-src/.ci/linux source_sha launcher)
          packages=$(select_compatible launcher-src/.ci/launcher head_sha launcher site services/ggo-auth)
          test -n "$windows" && test -n "$linux" && test -n "$packages"

          windows_run=$(sed -n 's/^run_id=//p' "$windows" | head -n1)
          linux_run=$(sed -n 's/^run_id=//p' "$linux" | head -n1)
          package_run=$(sed -n 's/^run_id=//p' "$packages" | head -n1)
          test -n "$windows_run" && test -n "$linux_run" && test -n "$package_run"
          echo "windows_run=$windows_run" >> "$GITHUB_OUTPUT"
          echo "linux_run=$linux_run" >> "$GITHUB_OUTPUT"
          echo "package_run=$package_run" >> "$GITHUB_OUTPUT"

          grep -q '^install=.*success' "$windows"
          grep -q '^frontend=success$' "$windows"
          grep -q '^rust_fmt=success$' "$windows"
          grep -q '^rust_check=success$' "$windows"
          grep -q '^runtime_tests=success$' "$windows"
          grep -q '^package=success$' "$windows"
          grep -q '^verify=success$' "$windows"

          grep -q '^frontend=success$' "$linux"
          grep -q '^rust_fmt=success$' "$linux"
          grep -q '^rust_check=success$' "$linux"
          grep -q '^runtime_tests=success$' "$linux"
          grep -q '^package=success$' "$linux"
          grep -q '^verify=success$' "$linux"

          grep -q '^build_status=success$' "$packages"
          grep -q '^auth_status=success$' "$packages"
          grep -q '^website_status=success$' "$packages"

      - name: Prepare Forge wrapper
        run: |
          set -euo pipefail
          rm -rf /tmp/ggo-mdk /tmp/ggo-mdk.zip
          curl -fL --retry 3 -o /tmp/ggo-mdk.zip https://maven.minecraftforge.net/net/minecraftforge/forge/1.20.1-47.4.10/forge-1.20.1-47.4.10-mdk.zip
          mkdir -p /tmp/ggo-mdk
          unzip -q /tmp/ggo-mdk.zip 'gradlew' 'gradlew.bat' 'gradle/*' -d /tmp/ggo-mdk

      - name: Build final server Core
        id: server
        working-directory: server-src
        run: |
          set -euo pipefail
          rm -rf ga-build && mkdir ga-build
          unzip -q "$SOURCE_ZIP" -d ga-build
          python3 hotfix/apply_ggo_contract_rewards_stage26.py
          python3 hotfix/apply_ggo_contract_map_stage27.py
          python3 hotfix/apply_ggo_contract_push_stage28.py
          python3 hotfix/apply_ggo_contract_persistence_stage29.py
          python3 hotfix/apply_ggo_contract_lifecycle_stage30.py
          python3 hotfix/apply_ggo_contract_balance_stage31.py
          python3 hotfix/apply_ggo_contract_eligibility_stage32.py
          python3 hotfix/apply_ggo_supply_lifecycle_stage33.py
          python3 hotfix/apply_ggo_extraction_runtime_stage34.py
          python3 hotfix/apply_ggo_contract_network_guard_stage36.py
          python3 hotfix/apply_ggo_contract_reward_order_stage37.py
          python3 hotfix/apply_ggo_compile_baseline_stage27.py
          python3 hotfix/apply_ggo_spawn_presence_stage38.py
          python3 hotfix/apply_ggo_deminecraft_world_stage39.py
          python3 hotfix/apply_ggo_deminecraft_loot_stage41.py
          python3 hotfix/apply_ggo_inventory_stage42.py
          python3 hotfix/apply_ggo_visible_content_stage43.py
          python3 hotfix/apply_ggo_medicine_stage47.py
          python3 hotfix/apply_ggo_death_recap_stage48.py
          python3 hotfix/apply_ggo_recovery_bag_stage49.py
          python3 hotfix/apply_ggo_map_integrity_stage51.py
          python3 hotfix/apply_ggo_map_palette_stage54.py
          python3 hotfix/apply_ggo_official_auth_stage55.py
          python3 hotfix/apply_ggo_pre_auth_quarantine_stage59.py
          python3 hotfix/apply_ggo_ui_packets_stage65.py
          grep -q 'private static final String PROTOCOL = "2"' ga-build/src/main/java/arena/forge/GgoLaunchTicketNetwork.java
          grep -q 'RECOVERY_BAG_MODEL=720049' ga-build/src/main/java/arena/forge/GgoRecoveryBagService.java
          grep -q 'authorizedAndRateLimited' ga-build/src/main/java/arena/forge/GgoUiActionNetwork.java
          cp /tmp/ggo-mdk/gradlew ga-build/gradlew
          cp /tmp/ggo-mdk/gradlew.bat ga-build/gradlew.bat
          rm -rf ga-build/gradle && cp -a /tmp/ggo-mdk/gradle ga-build/gradle
          chmod +x ga-build/gradlew
          (cd ga-build && ./gradlew --no-daemon build --stacktrace)
          CORE="$(find ga-build/build/libs -type f -name '*.jar' ! -name '*sources*' ! -name '*dev*' | head -n1)"
          test -n "$CORE"
          for c in GgoOfficialAuthState GgoLaunchTicketNetwork GgoPreAuthQuarantine GgoUiActionNetwork GgoRecoveryBagService GgoMapIntegrityGuard; do
            jar tf "$CORE" | grep -q "^arena/forge/$c.class$"
          done
          jar tf "$CORE" | grep -q '^arena/forge/GgoLaunchTicketNetwork\$VerificationAck.class$'
          mkdir -p ../stage70/server/mods
          cp "$CORE" ../stage70/server/mods/gungloryonline-core-runtime-v1-final.jar

      - name: Build final brand-clean client UI
        id: client
        working-directory: client-src
        run: |
          set -euo pipefail
          rm -rf ga-build && mkdir ga-build
          unzip -q "$SOURCE_ZIP" -d ga-build
          python3 hotfix/apply_ggo_ui_shell_stage1.py
          python3 hotfix/apply_ggo_ui_shell_stage2.py
          python3 hotfix/apply_ggo_ui_shell_stage3.py
          python3 hotfix/apply_ggo_hud_stage4.py
          python3 hotfix/apply_ggo_frontend_stage5.py
          python3 hotfix/apply_ggo_settings_stage6.py
          python3 hotfix/apply_ggo_identity_minimap_stage7.py
          python3 hotfix/apply_ggo_weapon_navigation_stage8.py
          python3 hotfix/apply_ggo_ping_stage9.py
          python3 hotfix/apply_ggo_navigation_zoom_stage10.py
          python3 hotfix/apply_ggo_squad_ping_stage11.py
          python3 hotfix/apply_ggo_ping_wheel_stage12.py
          python3 hotfix/apply_ggo_tab_squad_stage13.py
          python3 hotfix/apply_ggo_objective_squad_stage15.py
          python3 hotfix/apply_ggo_runtime_network_stage17.py
          python3 hotfix/apply_ggo_jeg_telemetry_stage18.py
          python3 hotfix/apply_ggo_squad_map_stage19.py
          python3 hotfix/apply_ggo_server_hud_stage20.py
          python3 hotfix/apply_ggo_br_hud_stage21.py
          python3 hotfix/apply_ggo_contracts_stage23.py
          python3 hotfix/apply_ggo_br_map_client_stage24.py
          python3 hotfix/apply_ggo_contract_map_stage27_fixed.py
          python3 hotfix/apply_ggo_contract_session_stage35.py
          python3 hotfix/apply_ggo_contract_reward_ui_stage37.py
          python3 hotfix/apply_ggo_client_compile_baseline_stage28.py
          python3 hotfix/apply_ggo_deminecraft_client_stage40.py
          python3 hotfix/apply_ggo_inventory_stage42.py
          python3 hotfix/apply_ggo_input_fence_stage45.py
          python3 hotfix/apply_ggo_combat_hud_stage47.py
          python3 hotfix/apply_ggo_death_recap_stage48.py
          python3 hotfix/apply_ggo_inventory_stage50.py
          python3 hotfix/apply_ggo_launch_ticket_stage55.py
          python3 hotfix/apply_ggo_entry_ux_stage57.py
          python3 hotfix/apply_ggo_launcher_authority_stage58.py
          python3 hotfix/apply_ggo_session_verification_stage61.py
          python3 hotfix/apply_ggo_ui_packets_stage65.py
          python3 hotfix/apply_ggo_surface_fence_stage66.py
          python3 hotfix/apply_ggo_chat_shell_stage67.py
          python3 hotfix/apply_ggo_brand_leak_cleanup_stage68.py
          ! grep -R -F 'sendCommand("ggomed' ga-build/client-ui/src/main/java/arena/client/shell
          ! grep -R -F 'runClientCommand("ggoinv' ga-build/client-ui/src/main/java/arena/client/shell
          grep -q 'GGO client settings. Advanced runtime options stay hidden by default.' ga-build/client-ui/src/main/java/arena/client/shell/GgoSettingsScreen.java
          grep -q 'Only GGO equipment and field storage are available here.' ga-build/client-ui/src/main/java/arena/client/shell/GgoShellScreen.java
          grep -q 'extends ChatScreen' ga-build/client-ui/src/main/java/arena/client/shell/GgoChatScreen.java
          grep -q 'VanillaGuiOverlay.DEBUG_TEXT' ga-build/client-ui/src/main/java/arena/client/shell/GgoProductionSurfaceFence.java
          ! grep -q 'VanillaGuiOverlay.CHAT_TEXT' ga-build/client-ui/src/main/java/arena/client/shell/GgoProductionSurfaceFence.java
          cp /tmp/ggo-mdk/gradlew ga-build/client-ui/gradlew
          cp /tmp/ggo-mdk/gradlew.bat ga-build/client-ui/gradlew.bat
          rm -rf ga-build/client-ui/gradle && cp -a /tmp/ggo-mdk/gradle ga-build/client-ui/gradle
          chmod +x ga-build/client-ui/gradlew
          (cd ga-build/client-ui && ./gradlew --no-daemon build --stacktrace)
          UI="$(find ga-build/client-ui/build/libs -type f -name '*.jar' ! -name '*sources*' ! -name '*dev*' | head -n1)"
          test -n "$UI"
          for c in GgoChatScreen GgoChatShellHook GgoProductionSurfaceFence GgoUiActionClientBridge GgoShellScreen GgoSettingsScreen GgoSessionVerificationOverlay; do
            jar tf "$UI" | grep -q "^arena/client/shell/$c.class$"
          done
          mkdir -p ../stage70/client/mods
          cp "$UI" ../stage70/client/mods/gungloryonline-ui-runtime-v1-final.jar

      - name: Build final official resource pack
        id: rp
        working-directory: client-src
        run: |
          set -euo pipefail
          mkdir -p ../stage70/client/resourcepacks
          python3 hotfix/build_ggo_recovery_bag_rp_stage63.py \
            GunnerArena-ResourcePack-1.20.1-v1.zip \
            ../stage70/client/resourcepacks/GunGloryOnline-Official.zip
          python3 - <<'PY'
          import json, zipfile
          from pathlib import Path
          p=Path('../stage70/client/resourcepacks/GunGloryOnline-Official.zip')
          assert p.is_file() and p.stat().st_size > 1_000_000
          with zipfile.ZipFile(p) as z:
              assert 'assets/gunnerarena/models/item/recovery_bag.json' in z.namelist()
              assert 'assets/gunnerarena/textures/item/recovery_bag.png' in z.namelist()
              data=json.loads(z.read('assets/minecraft/models/item/bundle.json'))
              hits=[x for x in data.get('overrides',[]) if x.get('predicate',{}).get('custom_model_data')==720049]
              assert hits==[{'predicate':{'custom_model_data':720049},'model':'gunnerarena:item/recovery_bag'}], hits
          PY

      - name: Validate final launcher auth and asset contract
        id: launcher
        working-directory: launcher-src
        run: |
          set -euo pipefail
          python3 -m py_compile services/ggo-auth/server.py services/ggo-auth/test_auth.py infra/vds/publish_release.py
          python3 services/ggo-auth/test_auth.py -v
          grep -q 'GAME_TICKET_TTL = 3 \* 60' services/ggo-auth/server.py
          cd launcher
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
          npm install
          npm run build
          cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
          cargo check --manifest-path src-tauri/Cargo.toml
          cargo test --manifest-path src-tauri/Cargo.toml
          grep -q 'GGO_GAME_TICKET' src-tauri/src/lib.rs
          ! grep -q 'GGO_GAME_TICKET' src/App.tsx
          grep -q 'GunGloryOnline-Official.zip' src-tauri/src/runtime/official_resource_pack.rs
          grep -q 'launcher-managed' src-tauri/src/runtime/ggo_local_install.rs
          grep -q 'play.kvicloud.ru:24842' src/App.tsx

      - name: Verify final canonical publication
        id: assets
        run: |
          set -euo pipefail
          cp stage70/server/mods/gungloryonline-core-runtime-v1-final.jar stage70/client/mods/gungloryonline-core-runtime-v1-final.jar
          mkdir -p publish-smoke/pkg
          cp -a stage70/client publish-smoke/pkg/client
          (cd publish-smoke/pkg && zip -qr ../ready.zip client)
          python3 launcher-src/infra/vds/publish_release.py publish-smoke/ready.zip \
            --resource-pack stage70/client/resourcepacks/GunGloryOnline-Official.zip \
            --public-dir publish-smoke/public \
            --base-url https://updates.ggo.kvicloud.ru \
            --version final-candidate \
            --channel beta
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          root=Path('publish-smoke')
          manifest=json.loads((root/'public/manifests/beta.json').read_text())
          rp=[f for f in manifest['files'] if f.get('kind')=='resourcepack']
          assert len(rp)==1
          entry=rp[0]
          assert entry['path']=='resourcepacks/GunGloryOnline-Official.zip'
          assert entry['required'] is True and entry['side']=='client'
          target=root/'public/files/final-candidate/resourcepacks/GunGloryOnline-Official.zip'
          assert target.is_file()
          assert hashlib.sha256(target.read_bytes()).hexdigest()==entry['sha256']
          PY

      - name: Assemble final distribution manifest
        id: package
        run: |
          set -euo pipefail
          cat > stage70/BUILD-INFO.txt <<EOF
          GGO_RUNTIME_STAGE=70
          PURPOSE=FINAL_DISTRIBUTION_CANDIDATE
          SERVER_BRANCH=server/runtime-hardening-v1
          SERVER_SHA=${{ steps.refs.outputs.server_sha }}
          CLIENT_BRANCH=client/runtime-migration-v1
          CLIENT_SHA=${{ steps.refs.outputs.client_sha }}
          LAUNCHER_BRANCH=launcher/bootstrap-v0.1
          LAUNCHER_SHA=${{ steps.refs.outputs.launcher_sha }}
          MINECRAFT=1.20.1
          FORGE=47.4.10
          JAVA=17
          ENTRY_AUTH=ONE_SHOT_LAUNCHER_TICKET
          LAUNCH_TICKET_PROTOCOL=2
          UNUSED_TICKET_TTL_SECONDS=180
          PRE_AUTH_GAMEPLAY=QUARANTINED
          CLIENT_VERIFICATION_OVERLAY=ACK_GATED
          UI_ACTIONS=PACKET_ONLY
          CHAT_INPUT=GGO_SHELL_OVER_CHATSCREEN_TRANSPORT
          VANILLA_PRODUCTION_SURFACES=FENCED
          PLAYER_FACING_ENGINE_BRANDS=REMOVED
          RECOVERY_BAG_CUSTOM_MODEL_DATA=720049
          OFFICIAL_RESOURCE_PACK=client/resourcepacks/GunGloryOnline-Official.zip
          OFFICIAL_SERVER=play.kvicloud.ru:24842
          STAGE69_RUN=${{ steps.refs.outputs.stage69_run }}
          WINDOWS_VERIFY_RUN=${{ steps.refs.outputs.windows_run }}
          LINUX_VERIFY_RUN=${{ steps.refs.outputs.linux_run }}
          LAUNCHER_PACKAGE_RUN=${{ steps.refs.outputs.package_run }}
          EOF
          sha256sum stage70/server/mods/* stage70/client/mods/* stage70/client/resourcepacks/* > stage70/SHA256SUMS.txt
          test -s stage70/SHA256SUMS.txt

      - name: Dedicated Forge server smoke
        id: smoke
        run: |
          set -euo pipefail
          rm -rf ds forge-installer.jar
          mkdir ds
          curl -fL --retry 5 --retry-all-errors -o forge-installer.jar https://maven.minecraftforge.net/net/minecraftforge/forge/1.20.1-47.4.10/forge-1.20.1-47.4.10-installer.jar
          java -jar forge-installer.jar --installServer ds >/tmp/forge-install-stage70.log 2>&1
          echo 'eula=true' > ds/eula.txt
          mkdir -p ds/mods
          cp stage70/server/mods/gungloryonline-core-runtime-v1-final.jar ds/mods/
          cd ds
          timeout 110s java -Xms512M -Xmx1G @libraries/net/minecraftforge/forge/1.20.1-47.4.10/unix_args.txt nogui > ../dedicated-stage70.log 2>&1 || true
          cd ..
          test -f ds/logs/latest.log
          grep -Fq 'Done (' ds/logs/latest.log
          ! grep -Eqi 'Failed to start|Exception in server tick loop|NoClassDefFoundError|ClassNotFoundException|ModLoadingException|Encountered an unexpected exception' dedicated-stage70.log ds/logs/latest.log

      - name: Upload final runtime candidate
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: GunGloryOnline-Runtime-Stage70-FinalDistribution
          path: stage70/**
          if-no-files-found: error
          retention-days: 30

      - name: Publish exact Stage 70 receipt
        if: always()
        env:
          SERVER_OUTCOME: ${{ steps.server.outcome }}
          CLIENT_OUTCOME: ${{ steps.client.outcome }}
          RP_OUTCOME: ${{ steps.rp.outcome }}
          LAUNCHER_OUTCOME: ${{ steps.launcher.outcome }}
          ASSETS_OUTCOME: ${{ steps.assets.outcome }}
          PACKAGE_OUTCOME: ${{ steps.package.outcome }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
        working-directory: client-src
        run: |
          set -euo pipefail
          result=success
          for value in "$SERVER_OUTCOME" "$CLIENT_OUTCOME" "$RP_OUTCOME" "$LAUNCHER_OUTCOME" "$ASSETS_OUTCOME" "$PACKAGE_OUTCOME" "$SMOKE_OUTCOME"; do
            [ "$value" = success ] || result=failure
          done
          mkdir -p ci-results
          cat > ci-results/stage70-final-distribution.txt <<EOF
          workflow=${GITHUB_WORKFLOW}
          run_id=${GITHUB_RUN_ID}
          run_attempt=${GITHUB_RUN_ATTEMPT}
          run_url=https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          server_sha=${{ steps.refs.outputs.server_sha }}
          client_sha=${{ steps.refs.outputs.client_sha }}
          launcher_sha=${{ steps.refs.outputs.launcher_sha }}
          stage69_run=${{ steps.refs.outputs.stage69_run }}
          windows_verify_run=${{ steps.refs.outputs.windows_run }}
          linux_verify_run=${{ steps.refs.outputs.linux_run }}
          launcher_package_run=${{ steps.refs.outputs.package_run }}
          launch_ticket_protocol=2
          server_build=$SERVER_OUTCOME
          client_build=$CLIENT_OUTCOME
          official_resource_pack=$RP_OUTCOME
          launcher_auth_platform=$LAUNCHER_OUTCOME
          official_assets=$ASSETS_OUTCOME
          package=$PACKAGE_OUTCOME
          dedicated_smoke=$SMOKE_OUTCOME
          result=$result
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ci-results/stage70-final-distribution.txt
          git commit -m "ci: record Stage 70 final distribution ${GITHUB_RUN_ID}" || exit 0
          git fetch origin client/runtime-migration-v1
          git rebase origin/client/runtime-migration-v1
          git push origin HEAD:client/runtime-migration-v1
