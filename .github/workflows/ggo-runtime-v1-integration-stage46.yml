name: GGO Runtime v1 Stage 46 Integration

on:
  workflow_dispatch:
  push:
    branches:
      - server/runtime-hardening-v1
    paths:
      - '.github/workflows/ggo-runtime-v1-integration-stage46.yml'
      - 'hotfix/ArenaBeltGuard.java'
      - 'hotfix/InventoryUtilityCommands.java'
      - 'hotfix/GgoVisibleItemPolicy.java'
      - 'hotfix/GgoVanillaLootFence.java'
      - 'hotfix/GgoWorldRuntimeFence.java'
      - 'hotfix/GgoPlayerPresencePolicy.java'
      - 'hotfix/apply_ggo_*stage4*.py'

permissions:
  contents: write

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      SOURCE_ZIP: gunner-arena-forge-1.20.1-0.6.0-test52-GREPFIX-SOURCE.zip
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Resolve client feature branch
        id: refs
        run: |
          set -euo pipefail
          git fetch --depth=1 origin client/runtime-migration-v1:refs/remotes/origin/client/runtime-migration-v1
          rm -rf client-src
          git worktree add --detach client-src refs/remotes/origin/client/runtime-migration-v1
          echo "server_sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "client_sha=$(git -C client-src rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build Stage 43 server runtime
        id: server_build
        run: |
          set -euo pipefail
          rm -rf ga-build && mkdir ga-build
          unzip -q "$SOURCE_ZIP" -d ga-build
          python3 hotfix/apply_ggo_contract_rewards_stage26.py
          python3 hotfix/apply_ggo_contract_map_stage27.py
          python3 hotfix/apply_ggo_contract_push_stage28.py
          python3 hotfix/apply_ggo_contract_persistence_stage29.py
          python3 hotfix/apply_ggo_contract_lifecycle_stage30.py
          python3 hotfix/apply_ggo_contract_balance_stage31.py
          python3 hotfix/apply_ggo_contract_eligibility_stage32.py
          python3 hotfix/apply_ggo_supply_lifecycle_stage33.py
          python3 hotfix/apply_ggo_extraction_runtime_stage34.py
          python3 hotfix/apply_ggo_contract_network_guard_stage36.py
          python3 hotfix/apply_ggo_contract_reward_order_stage37.py
          python3 hotfix/apply_ggo_compile_baseline_stage27.py
          python3 hotfix/apply_ggo_spawn_presence_stage38.py
          python3 hotfix/apply_ggo_deminecraft_world_stage39.py
          python3 hotfix/apply_ggo_deminecraft_loot_stage41.py
          python3 hotfix/apply_ggo_inventory_stage42.py
          python3 hotfix/apply_ggo_visible_content_stage43.py
          rm -rf /tmp/forge-mdk /tmp/forge-mdk.zip
          curl -fL --retry 3 -o /tmp/forge-mdk.zip https://maven.minecraftforge.net/net/minecraftforge/forge/1.20.1-47.4.10/forge-1.20.1-47.4.10-mdk.zip
          mkdir -p /tmp/forge-mdk
          unzip -q /tmp/forge-mdk.zip 'gradlew' 'gradlew.bat' 'gradle/*' -d /tmp/forge-mdk
          cp /tmp/forge-mdk/gradlew ga-build/gradlew
          cp /tmp/forge-mdk/gradlew.bat ga-build/gradlew.bat
          rm -rf ga-build/gradle && cp -a /tmp/forge-mdk/gradle ga-build/gradle
          chmod +x ga-build/gradlew
          (cd ga-build && ./gradlew --no-daemon build --stacktrace)

      - name: Build Stage 45 client runtime
        id: client_build
        working-directory: client-src
        run: |
          set -euo pipefail
          rm -rf ga-build && mkdir ga-build
          unzip -q "$SOURCE_ZIP" -d ga-build
          python3 hotfix/apply_ggo_ui_shell_stage1.py
          python3 hotfix/apply_ggo_ui_shell_stage2.py
          python3 hotfix/apply_ggo_ui_shell_stage3.py
          python3 hotfix/apply_ggo_hud_stage4.py
          python3 hotfix/apply_ggo_frontend_stage5.py
          python3 hotfix/apply_ggo_settings_stage6.py
          python3 hotfix/apply_ggo_identity_minimap_stage7.py
          python3 hotfix/apply_ggo_weapon_navigation_stage8.py
          python3 hotfix/apply_ggo_ping_stage9.py
          python3 hotfix/apply_ggo_navigation_zoom_stage10.py
          python3 hotfix/apply_ggo_squad_ping_stage11.py
          python3 hotfix/apply_ggo_ping_wheel_stage12.py
          python3 hotfix/apply_ggo_tab_squad_stage13.py
          python3 hotfix/apply_ggo_objective_squad_stage15.py
          python3 hotfix/apply_ggo_runtime_network_stage17.py
          python3 hotfix/apply_ggo_jeg_telemetry_stage18.py
          python3 hotfix/apply_ggo_squad_map_stage19.py
          python3 hotfix/apply_ggo_server_hud_stage20.py
          python3 hotfix/apply_ggo_br_hud_stage21.py
          python3 hotfix/apply_ggo_contracts_stage23.py
          python3 hotfix/apply_ggo_br_map_client_stage24.py
          python3 hotfix/apply_ggo_contract_map_stage27_fixed.py
          python3 hotfix/apply_ggo_contract_session_stage35.py
          python3 hotfix/apply_ggo_contract_reward_ui_stage37.py
          python3 hotfix/apply_ggo_client_compile_baseline_stage28.py
          python3 hotfix/apply_ggo_deminecraft_client_stage40.py
          python3 hotfix/apply_ggo_inventory_stage42.py
          python3 hotfix/apply_ggo_input_fence_stage45.py
          rm -rf /tmp/forge-mdk-client /tmp/forge-mdk-client.zip
          curl -fL --retry 3 -o /tmp/forge-mdk-client.zip https://maven.minecraftforge.net/net/minecraftforge/forge/1.20.1-47.4.10/forge-1.20.1-47.4.10-mdk.zip
          mkdir -p /tmp/forge-mdk-client
          unzip -q /tmp/forge-mdk-client.zip 'gradlew' 'gradlew.bat' 'gradle/*' -d /tmp/forge-mdk-client
          cp /tmp/forge-mdk-client/gradlew ga-build/client-ui/gradlew
          cp /tmp/forge-mdk-client/gradlew.bat ga-build/client-ui/gradlew.bat
          rm -rf ga-build/client-ui/gradle && cp -a /tmp/forge-mdk-client/gradle ga-build/client-ui/gradle
          chmod +x ga-build/client-ui/gradlew
          (cd ga-build/client-ui && ./gradlew --no-daemon build --stacktrace)

      - name: Assemble and verify Runtime v1 package
        id: verify
        run: |
          set -euo pipefail
          CORE="$(find ga-build/build/libs -type f -name '*.jar' ! -name '*sources*' ! -name '*dev*' | head -n1)"
          UI="$(find client-src/ga-build/client-ui/build/libs -type f -name '*.jar' ! -name '*sources*' ! -name '*dev*' | head -n1)"
          test -n "$CORE"; test -n "$UI"
          for c in ArenaBeltGuard InventoryUtilityCommands GgoVisibleItemPolicy GgoVanillaLootFence GgoWorldRuntimeFence GgoPlayerPresencePolicy GgoContractService GgoSupplyExtractionService; do
            jar tf "$CORE" | grep -q "^arena/forge/$c.class$"
          done
          for c in GgoShellScreen GgoCombatInputFence GgoVanillaRuntimeFence GgoRespawnScreen GgoCombatHud GgoContractCompletionState; do
            jar tf "$UI" | grep -q "^arena/client/shell/$c.class$"
          done
          rm -rf integration-artifacts
          mkdir -p integration-artifacts/server/mods integration-artifacts/client/mods integration-artifacts/client/resourcepacks
          cp "$CORE" integration-artifacts/server/mods/gungloryonline-core-runtime-v1-stage46.jar
          cp "$CORE" integration-artifacts/client/mods/gungloryonline-core-runtime-v1-stage46.jar
          cp "$UI" integration-artifacts/client/mods/gungloryonline-ui-runtime-v1-stage46.jar
          cp client-src/GunnerArena-ResourcePack-1.20.1-v1.zip integration-artifacts/client/resourcepacks/GunGloryOnline-ResourcePack-runtime-v1.zip
          cat > integration-artifacts/BUILD.txt <<EOF
          GGO_RUNTIME_V1_STAGE46=PASS
          server_sha=${{ steps.refs.outputs.server_sha }}
          client_sha=${{ steps.refs.outputs.client_sha }}
          social_spawn_players_visible=true
          physical_compass_menu=false
          vanilla_survival_runtime=false
          vanilla_loot_progression=false
          interactive_ggo_inventory=true
          combat_slots=3
          ammo_slots=9
          vanilla_death_advancement_container_ui=false
          vanilla_drop_offhand_hotbar_4_9_shortcuts=false
          EOF
          sha256sum integration-artifacts/server/mods/* integration-artifacts/client/mods/* integration-artifacts/client/resourcepacks/* > integration-artifacts/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: GunGloryOnline-Runtime-v1-Stage46-Integration
          path: integration-artifacts/**
          if-no-files-found: error
          retention-days: 30

      - name: Publish exact integration receipt
        if: always()
        env:
          SERVER_OUTCOME: ${{ steps.server_build.outcome }}
          CLIENT_OUTCOME: ${{ steps.client_build.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        run: |
          set -euo pipefail
          result=success
          for value in "$SERVER_OUTCOME" "$CLIENT_OUTCOME" "$VERIFY_OUTCOME"; do [ "$value" = success ] || result=failure; done
          mkdir -p ci-results
          printf '%s\n' \
            "workflow=${{ github.workflow }}" \
            "run_id=${{ github.run_id }}" \
            "run_attempt=${{ github.run_attempt }}" \
            "run_url=https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            "server_sha=${{ steps.refs.outputs.server_sha }}" \
            "client_sha=${{ steps.refs.outputs.client_sha }}" \
            "server_build=$SERVER_OUTCOME" \
            "client_build=$CLIENT_OUTCOME" \
            "verify=$VERIFY_OUTCOME" \
            "result=$result" > ci-results/stage46-integration.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ci-results/stage46-integration.txt
          git commit -m "ci: record stage46 integration run ${{ github.run_id }}" || exit 0
          git fetch origin "$GITHUB_REF_NAME"
          git rebase "origin/$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
