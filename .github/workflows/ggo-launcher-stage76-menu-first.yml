name: GGO Launcher Stage 76 Menu First

on:
  workflow_dispatch:
  push:
    branches:
      - launcher/bootstrap-v0.1
    paths:
      - '.github/workflows/ggo-launcher-stage76-menu-first.yml'
      - 'launcher/hotfix/apply_menu_first_beta_stage76.py'
      - 'launcher/src/App.tsx'
      - 'launcher/src-tauri/src/lib.rs'
      - 'launcher/package.json'
      - 'launcher/src-tauri/Cargo.toml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: launcher/bootstrap-v0.1
          fetch-depth: 0

      - name: Capture exact ref
        id: refs
        run: echo "launcher_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install Tauri Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply menu-first launcher hardening
        id: patch
        run: |
          set -euo pipefail
          python3 launcher/hotfix/apply_menu_first_beta_stage76.py

      - name: Verify launcher trust boundary
        id: gates
        run: |
          set -euo pipefail
          R=launcher/src-tauri/src/lib.rs
          A=launcher/src/App.tsx
          grep -q 'async fn launch_game(' "$R"
          grep -q 'options.connect_server = false;' "$R"
          grep -q 'GGO_GAME_TICKET' "$R"
          grep -q 'GGO_GAME_TICKET_EXPIRES_AT' "$R"
          grep -q 'issue_game_ticket' "$R"
          ! grep -q 'async fn preview_minecraft_launch(' "$R"
          ! grep -q 'async fn launch_minecraft(' "$R"
          ! grep -q '            launch_training,' "$R"
          ! grep -q '            launch_minecraft,' "$R"
          ! grep -q '            preview_minecraft_launch,' "$R"
          grep -q 'async function launch(){' "$A"
          grep -q '?t.install:updateAvailable?t.updateGame:t.play' "$A"
          ! grep -q 'onClick={()=>void launch(true)}' "$A"
          ! grep -q 'serverAddress:target' "$A"
          ! grep -q 'className="repair-link"' "$A"

      - name: Build launcher web UI
        id: web
        working-directory: launcher
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Check Rust launcher core
        id: rust
        working-directory: launcher/src-tauri
        run: cargo check

      - name: Publish Stage 76 launcher receipt
        if: always()
        env:
          PATCH_OUTCOME: ${{ steps.patch.outcome }}
          GATES_OUTCOME: ${{ steps.gates.outcome }}
          WEB_OUTCOME: ${{ steps.web.outcome }}
          RUST_OUTCOME: ${{ steps.rust.outcome }}
        run: |
          set -euo pipefail
          result=success
          for v in "$PATCH_OUTCOME" "$GATES_OUTCOME" "$WEB_OUTCOME" "$RUST_OUTCOME"; do
            [ "$v" = success ] || result=failure
          done
          mkdir -p .ci/launcher
          cat > .ci/launcher/stage76-menu-first.txt <<EOF
          workflow=${GITHUB_WORKFLOW}
          run_id=${GITHUB_RUN_ID}
          run_attempt=${GITHUB_RUN_ATTEMPT}
          run_url=https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          launcher_sha=${{ steps.refs.outputs.launcher_sha }}
          patch=$PATCH_OUTCOME
          trust_boundary_gates=$GATES_OUTCOME
          web_build=$WEB_OUTCOME
          rust_check=$RUST_OUTCOME
          public_game_launch_commands=1
          launch_autoconnect=false
          one_primary_home_action=true
          external_training_action=false
          home_repair_action=false
          result=$result
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .ci/launcher/stage76-menu-first.txt
          git commit -m "ci: record launcher Stage 76 menu-first ${GITHUB_RUN_ID}" || exit 0
          git fetch origin launcher/bootstrap-v0.1
          git rebase origin/launcher/bootstrap-v0.1
          git push origin HEAD:launcher/bootstrap-v0.1
