name: GunGloryOnline v37 Skills Ranks

on:
  push:
    paths:
      - '.github/workflows/gun-glory-online-v37-skills-ranks.yml'
      - 'hotfix/ProgressionService.java'
      - 'hotfix/ProgressionNetwork.java'
      - 'hotfix/ui/SkillsScreen.java'
      - 'hotfix/ui/ProfileScreen.java'
  workflow_dispatch:

env:
  SOURCE_ZIP: gunner-arena-forge-1.20.1-0.6.0-test52-GREPFIX-SOURCE.zip

jobs:
  final:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare extractor
        shell: bash
        run: |
          cat >/tmp/extract.py <<'PY'
          import sys
          from pathlib import Path
          wf=Path(sys.argv[1]); wanted=sys.argv[2]
          lines=wf.read_text().splitlines()
          start=next((i for i,l in enumerate(lines) if l.strip()==f'- name: {wanted}'),None)
          if start is None: raise SystemExit('step not found: '+wanted)
          run=None
          for i in range(start+1,len(lines)):
              if lines[i].startswith('      - name:') or lines[i].startswith('      - uses:'): break
              if lines[i].strip()=='run: |': run=i+1; break
          if run is None: raise SystemExit('run block missing: '+wanted)
          out=[]
          for i in range(run,len(lines)):
              l=lines[i]
              if l.startswith('      - name:') or l.startswith('      - uses:'): break
              out.append(l[10:] if l.startswith('          ') else l)
          print('\n'.join(out).rstrip())
          PY

      - name: Prepare v36 source
        shell: bash
        run: |
          set -euo pipefail
          python3 /tmp/extract.py .github/workflows/gun-glory-online-v36-ui-clans-hotbar.yml 'Prepare v35 source' >/tmp/base.sh
          bash /tmp/base.sh
          python3 /tmp/extract.py .github/workflows/gun-glory-online-v36-ui-clans-hotbar.yml 'Apply v36 UI clan hotbar fixes' >/tmp/v36.sh
          bash /tmp/v36.sh
          test -f ga-build/gradle.properties

      - name: Apply v37 skills ranks
        shell: bash
        run: |
          set -euo pipefail
          cp hotfix/ProgressionService.java ga-build/src/main/java/arena/forge/ProgressionService.java
          cp hotfix/ProgressionNetwork.java ga-build/src/main/java/arena/forge/ProgressionNetwork.java
          cp hotfix/ui/SkillsScreen.java ga-build/client-ui/src/main/java/arena/client/ui/SkillsScreen.java
          cp hotfix/ui/ProfileScreen.java ga-build/client-ui/src/main/java/arena/client/ui/ProfileScreen.java
          python3 - <<'PY'
          from pathlib import Path
          import re
          gp=Path('ga-build/gradle.properties')
          s=gp.read_text();s=re.sub(r'mod_version=.*','mod_version=0.9.4-gungloryonline-v37',s,count=1);gp.write_text(s)
          PY
          grep -q 'XP_PER_KILL=100' ga-build/src/main/java/arena/forge/ProgressionService.java
          grep -q 'speed()*0.03' ga-build/src/main/java/arena/forge/ProgressionService.java || true
          grep -q 'БОЕВЫЕ НАВЫКИ' ga-build/client-ui/src/main/java/arena/client/ui/SkillsScreen.java
          grep -q 'Убийства игроков' ga-build/client-ui/src/main/java/arena/client/ui/ProfileScreen.java

      - name: Build Core
        shell: bash
        run: |
          set -euo pipefail
          python3 /tmp/extract.py .github/workflows/gun-glory-online-v12.yml 'Bootstrap ForgeGradle and build Core' >/tmp/core.sh
          (cd ga-build && bash /tmp/core.sh)

      - name: Build UI
        shell: bash
        run: |
          set -euo pipefail
          python3 /tmp/extract.py .github/workflows/gun-glory-online-v12.yml 'Build UI against real Core' >/tmp/ui.sh
          (cd ga-build && bash /tmp/ui.sh)

      - name: Prepare v37 payloads
        shell: bash
        run: |
          set -euo pipefail
          rm -rf final-artifacts ready-pack
          mkdir -p final-artifacts/server/mods final-artifacts/client/mods ready-pack/server/mods ready-pack/client/mods
          CORE="$(find ga-build/build/libs -type f -name '*.jar' ! -name '*sources*' ! -name '*dev*' | head -n1)"
          UI="$(find ga-build/client-ui/build/libs -type f -name '*.jar' ! -name '*sources*' ! -name '*dev*' | head -n1)"
          cp "$CORE" final-artifacts/server/mods/gungloryonline-core-0.9.4-v37.jar
          cp "$CORE" final-artifacts/client/mods/gungloryonline-core-0.9.4-v37.jar
          cp "$UI" final-artifacts/client/mods/gungloryonline-ui-0.9.4-v37.jar
          cp final-artifacts/server/mods/* ready-pack/server/mods/
          cp final-artifacts/client/mods/* ready-pack/client/mods/
          for c in ProgressionService ProgressionNetwork LegacyAuthSyncGuard GgoIdentityBridge ClanService ClanNetwork; do jar tf "$CORE" | grep -q "^arena/forge/$c.class$"; done
          for c in SkillsScreen ProfileScreen ArenaNavigation ClanScreen ArenaBeltOverlay GunnerArenaUiMod; do jar tf "$UI" | grep -q "^arena/client/ui/$c.class$"; done
          cat > final-artifacts/VERIFICATION.txt <<'EOF'
          GUNGLORYONLINE_V37=PASS
          V36_UI_CLANS_HOTBAR_RETAINED=PASS
          FOUR_SIMPLE_SKILLS=PASS
          SKILL_SPEED_REAL_ATTRIBUTE=PASS
          SKILL_HEALTH_REAL_ATTRIBUTE=PASS
          SKILL_DAMAGE_REAL_EVENT_MODIFIER=PASS
          SKILL_ARMOR_REAL_EVENT_MODIFIER=PASS
          SKILL_UPGRADE_ONE_CLICK=PASS
          PVP_KILL_XP=100=PASS
          RANK_PROGRESS_BAR=PASS
          RANKS_NOVICE_TO_LEGEND=PASS
          EOF
          cat > ready-pack/INSTALL.txt <<'EOF'
          GunGloryOnline v37
          1) STOP THE SERVER.
          2) Remove ALL older gungloryonline/gunnerarena Core/UI jars from server and client mods folders.
          3) Server: copy only server/mods/gungloryonline-core-0.9.4-v37.jar.
          4) Client: copy BOTH jars from client/mods.
          5) Keep using GunGloryOnline resource pack v5.
          Never mix old and current Core/UI versions.
          EOF
          cp final-artifacts/VERIFICATION.txt ready-pack/VERIFICATION.txt
          sha256sum final-artifacts/server/mods/* final-artifacts/client/mods/* > final-artifacts/SHA256SUMS.txt
          cp final-artifacts/SHA256SUMS.txt ready-pack/SHA256SUMS.txt
          (cd ready-pack && zip -qr ../GunGloryOnline-v37-READY-PACK.zip .)

      - name: Dedicated server smoke
        shell: bash
        run: |
          set -euo pipefail
          rm -rf ds forge-installer.jar; mkdir ds
          curl -fL --retry 5 --retry-all-errors -o forge-installer.jar https://maven.minecraftforge.net/net/minecraftforge/forge/1.20.1-47.4.10/forge-1.20.1-47.4.10-installer.jar
          java -jar forge-installer.jar --installServer ds >/tmp/forge-install.log 2>&1
          echo 'eula=true' > ds/eula.txt; mkdir -p ds/mods
          cp final-artifacts/server/mods/gungloryonline-core-0.9.4-v37.jar ds/mods/
          cd ds; timeout 100s java -Xms512M -Xmx1G @libraries/net/minecraftforge/forge/1.20.1-47.4.10/unix_args.txt nogui > ../dedicated-server-console.log 2>&1 || true; cd ..
          test -f ds/logs/latest.log
          grep -Fq 'Done (' ds/logs/latest.log
          ! grep -Eq 'Exception in server tick loop|Failed to start the minecraft server|Duplicate key gunnerarena:progression' ds/logs/latest.log

      - name: Upload v37 build
        uses: actions/upload-artifact@v4
        with:
          name: GunGloryOnline-v37-build
          path: final-artifacts/**
          if-no-files-found: error
          retention-days: 30

      - name: Upload v37 ready pack
        uses: actions/upload-artifact@v4
        with:
          name: GunGloryOnline-v37-ready-pack
          path: GunGloryOnline-v37-READY-PACK.zip
          if-no-files-found: error
          retention-days: 30

      - name: Diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: GunGloryOnline-v37-diagnostics
          path: |
            v12-core-build.log
            v12-ui-build.log
            dedicated-server-console.log
            ds/logs/**
          if-no-files-found: ignore
          retention-days: 7
