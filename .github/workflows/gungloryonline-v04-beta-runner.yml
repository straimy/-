name: GunGloryOnline v0.4 Beta RUNNER
on:
  push:
    paths: ['.github/workflows/gungloryonline-v04-beta-runner.yml']
  workflow_dispatch:
env:
  SOURCE_ZIP: gunner-arena-forge-1.20.1-0.6.0-test52-GREPFIX-SOURCE.zip
  FINAL_RP: GunnerArena-ResourcePack-1.20.1-v1.zip
jobs:
  beta:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Execute final beta pipeline
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/extract.py <<'PY'
          import sys
          from pathlib import Path
          wf=Path(sys.argv[1]); wanted=sys.argv[2]
          lines=wf.read_text().splitlines()
          start=next((i for i,l in enumerate(lines) if l.strip()==f'- name: {wanted}'),None)
          if start is None: raise SystemExit('step not found: '+wanted)
          run=None
          for i in range(start+1,len(lines)):
              if lines[i].startswith('      - name:') or lines[i].startswith('      - uses:'): break
              if lines[i].strip()=='run: |': run=i+1; break
          if run is None: raise SystemExit('run block missing: '+wanted)
          out=[]
          for i in range(run,len(lines)):
              l=lines[i]
              if l.startswith('      - name:') or l.startswith('      - uses:'): break
              out.append(l[10:] if l.startswith('          ') else l)
          print('\n'.join(out).rstrip())
          PY
          WF=.github/workflows/gungloryonline-v04-beta-final.yml
          for STEP in \
            'Prepare authenticated base source' \
            'Apply v12 base' \
            'Apply v13 base' \
            'Apply v14 cosmetics and v0.4 beta fixes' \
            'Audit all advertised JEG weapon definitions' \
            'Build Core' \
            'Build UI' \
            'Prepare v0.4 Beta payload' \
            'Dedicated server smoke' \
            'Real Forge client smoke' \
            'Final v0.4 Beta audit'; do
              echo "===== $STEP ====="
              python3 /tmp/extract.py "$WF" "$STEP" >/tmp/step.sh
              bash /tmp/step.sh
          done
      - name: Upload final v0.4 Beta
        uses: actions/upload-artifact@v4
        with:
          name: GunGloryOnline-v0.4-Beta-final
          path: final-artifacts/**
          if-no-files-found: error
          retention-days: 30
      - name: Diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: GunGloryOnline-v0.4-Beta-runner-diagnostics
          path: |
            v12-core-build.log
            v12-ui-build.log
            dedicated-server-console.log
            ds/logs/**
            cs/run/logs/**
            cs/run/crash-reports/**
          if-no-files-found: ignore
          retention-days: 7
