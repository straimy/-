name: GunGloryOnline Launcher Rustfmt Repair

on:
  push:
    branches:
      - launcher/bootstrap-v0.1
    paths:
      - .github/workflows/ggo-launcher-rustfmt-fix.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout launcher branch
        uses: actions/checkout@v4
        with:
          ref: launcher/bootstrap-v0.1
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Format Tauri Rust sources
        run: cargo fmt --manifest-path launcher/src-tauri/Cargo.toml --all

      - name: Commit formatting only
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- launcher/src-tauri; then
            echo "Launcher Rust sources are already formatted."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add launcher/src-tauri
          git commit -m 'style(launcher): apply cargo fmt after asset pipeline'
          git fetch origin launcher/bootstrap-v0.1
          git rebase origin/launcher/bootstrap-v0.1
          git push origin HEAD:launcher/bootstrap-v0.1
