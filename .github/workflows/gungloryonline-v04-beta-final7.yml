name: GunGloryOnline v0.4 Beta FINAL 7

on:
  push:
    paths: ['.github/workflows/gungloryonline-v04-beta-final7.yml']
  workflow_dispatch:

env:
  SOURCE_ZIP: gunner-arena-forge-1.20.1-0.6.0-test52-GREPFIX-SOURCE.zip
  FINAL_RP: GunnerArena-ResourcePack-1.20.1-v1.zip

jobs:
  beta:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}

      - name: Prepare helpers
        shell: bash
        run: |
          cat >/tmp/extract.py <<'PY'
          import sys
          from pathlib import Path
          lines=Path(sys.argv[1]).read_text().splitlines(); wanted=sys.argv[2]
          start=next((i for i,l in enumerate(lines) if l.strip()==f'- name: {wanted}'),None)
          if start is None: raise SystemExit('step not found: '+wanted)
          run=None
          for i in range(start+1,len(lines)):
              if lines[i].startswith('      - name:') or lines[i].startswith('      - uses:'): break
              if lines[i].strip()=='run: |': run=i+1; break
          if run is None: raise SystemExit('run missing: '+wanted)
          out=[]
          for i in range(run,len(lines)):
              l=lines[i]
              if l.startswith('      - name:') or l.startswith('      - uses:'): break
              out.append(l[10:] if l.startswith('          ') else l)
          print('\n'.join(out).rstrip())
          PY
          cat >/tmp/runold <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          python3 /tmp/extract.py .github/workflows/gungloryonline-v04-beta-final.yml "$1" >/tmp/oldstep.sh
          bash /tmp/oldstep.sh
          SH
          cat >/tmp/run3 <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          python3 /tmp/extract.py .github/workflows/gungloryonline-v04-beta-final3.yml "$1" >/tmp/step3.sh
          bash /tmp/step3.sh
          SH
          chmod +x /tmp/runold /tmp/run3

      - name: Prepare base and weapon fixes
        shell: bash
        run: |
          set -euo pipefail
          /tmp/run3 'Prepare base and patches'
          cp hotfix/ui/ArenaNavigation.java ga-build/client-ui/src/main/java/arena/client/ui/ArenaNavigation.java
          cp hotfix/JegArenaAmmoGuard.java ga-build/src/main/java/arena/forge/JegArenaAmmoGuard.java
          cp hotfix/ui/JegNoAmmoFeedback.java ga-build/client-ui/src/main/java/arena/client/ui/JegNoAmmoFeedback.java
          cp hotfix/ui/WeaponNames.java ga-build/client-ui/src/main/java/arena/client/ui/WeaponNames.java
          python3 - <<'PY'
          from pathlib import Path
          # UI helper access from FINAL6.
          p=Path('ga-build/client-ui/src/main/java/arena/client/ui/AbstractArenaScreen.java'); s=p.read_text()
          if 'addArenaWidget(' not in s:
              i=s.rfind('}'); s=s[:i]+'\n    final void addArenaWidget(ArenaButton button){ addRenderableWidget(button); }\n'+s[i:]; p.write_text(s)
          # Beta Core/UI dependency must agree; old UI still requested >=0.6.0.
          m=Path('ga-build/client-ui/src/main/resources/META-INF/mods.toml'); t=m.read_text(); t=t.replace('[0.6.0,)','[0.4.0-beta,)'); m.write_text(t)
          # Ammo marker pass: fixed markers stay deterministic; random marker rotates through every ammo type in the live catalog.
          q=Path('ga-build/src/main/java/arena/forge/MinimalGameplayFixes.java'); x=q.read_text()
          old='if(now-lastAmmoWave>=200){lastAmmoWave=now;int cycle=(int)((now/200)%3);spawnLegacyAmmo(server,"gun_1_ammo","jeg:pistol_ammo",24);spawnLegacyAmmo(server,"gun_2_ammo","jeg:rifle_ammo",24);spawnLegacyAmmo(server,"gun_3_ammo","jeg:shotgun_shell",10);String a=cycle==0?"jeg:pistol_ammo":cycle==1?"jeg:rifle_ammo":"jeg:shotgun_shell";spawnLegacyAmmo(server,"random_gun_ammo",a,cycle==2?10:24);}'
          new='spawnAmmoWave(server,r,now);'
          if old not in x: raise SystemExit('ammo wave anchor missing')
          x=x.replace(old,new)
          anchor='    private static void tickRandomTnt(MinecraftServer server,long now){'
          helper='''    private static void spawnAmmoWave(MinecraftServer server,ArenaRuntime r,long now){\n        if(now-lastAmmoWave<160)return;lastAmmoWave=now;\n        spawnLegacyAmmo(server,"gun_1_ammo","jeg:pistol_ammo",24);\n        spawnLegacyAmmo(server,"gun_2_ammo","jeg:rifle_ammo",24);\n        spawnLegacyAmmo(server,"gun_3_ammo","jeg:shotgun_shell",12);\n        LinkedHashSet<String> ids=new LinkedHashSet<>();for(var d:r.weapons().all())if(d.ammoItem()!=null&&!d.ammoItem().isBlank()&&d.ammoItem().startsWith("jeg:"))ids.add(d.ammoItem());\n        if(!ids.isEmpty()){List<String>a=new ArrayList<>(ids);String id=a.get(RANDOM.nextInt(a.size()));spawnRandomAmmo(server,"random_gun_ammo",id,id.contains("shell")?12:24);}\n    }\n    private static void spawnRandomAmmo(MinecraftServer server,String markerTag,String itemId,int count){\n        ResourceLocation key=ResourceLocation.tryParse(itemId);if(key==null)return;Item item=ForgeRegistries.ITEMS.getValue(key);if(item==null||item==Items.AIR)return;\n        for(ServerLevel l:server.getAllLevels())for(Entity e:l.getAllEntities())if(e instanceof ArmorStand m&&m.getTags().contains(markerTag)){boolean occupied=false;for(ItemEntity d:l.getEntitiesOfClass(ItemEntity.class,m.getBoundingBox().inflate(1.5)))if(ForgeRegistries.ITEMS.getKey(d.getItem().getItem())!=null&&"jeg".equals(ForgeRegistries.ITEMS.getKey(d.getItem().getItem()).getNamespace())){occupied=true;break;}if(!occupied){ItemEntity d=new ItemEntity(l,m.getX(),m.getY()+.35,m.getZ(),new ItemStack(item,count));d.setPickUpDelay(5);l.addFreshEntity(d);}}\n    }\n\n'''
          if anchor not in x: raise SystemExit('TNT anchor missing')
          x=x.replace(anchor,helper+anchor);q.write_text(x)
          PY
          grep -q '\[0.4.0-beta,)\]' ga-build/client-ui/src/main/resources/META-INF/mods.toml
          grep -q 'spawnAmmoWave' ga-build/src/main/java/arena/forge/MinimalGameplayFixes.java
          grep -q 'НЕТ ПАТРОНОВ' ga-build/client-ui/src/main/java/arena/client/ui/JegNoAmmoFeedback.java

      - name: Expand and audit main JEG arsenal
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/jeg.jar 'https://mediafilez.forgecdn.net/files/6808/139/JustEnoughGuns-0.13.2-1.20.1.jar'
          python3 - <<'PY'
          import json,zipfile,re
          from pathlib import Path
          z=zipfile.ZipFile('/tmp/jeg.jar')
          targets=['semi_auto_pistol','combat_pistol','revolver','custom_smg','vindicator_smg','semi_auto_rifle','assault_rifle','burst_rifle','combat_rifle','bolt_action_rifle','infantry_rifle','service_rifle','waterpipe_shotgun','double_barrel_shotgun','pump_shotgun','repeating_shotgun','light_machine_gun','blossom_rifle','holy_shotgun','sub_sonic_rifle','super_sonic_shotgun','fire_sweeper']
          ammo_ok={'jeg:pistol_ammo','jeg:rifle_ammo','jeg:shotgun_shell'}
          def walk(v):
              if isinstance(v,dict):
                  for k,x in v.items(): yield k,x; yield from walk(x)
              elif isinstance(v,list):
                  for x in v: yield from walk(x)
          rows=[]
          for n in targets:
              fn=f'data/jeg/guns/{n}.json'
              if fn not in z.namelist(): print('SKIP missing',n); continue
              d=json.loads(z.read(fn)); pairs=list(walk(d))
              cap=next((int(v) for k,v in pairs if k.lower()=='maxammo' and isinstance(v,(int,float))),None)
              vals=[v for k,v in pairs if isinstance(v,str)]
              ammo=next((v for v in vals if v in ammo_ok),None)
              if not cap or not ammo: print('SKIP special-ammo',n,cap,ammo); continue
              cat='SHOTGUN' if 'shotgun' in n else 'SMG' if 'smg' in n else 'PISTOL' if ('pistol' in n or n=='revolver') else 'HEAVY' if 'machine_gun' in n else 'SNIPER' if 'bolt_action' in n else 'RIFLE'
              slot='SECONDARY' if cat=='PISTOL' else 'PRIMARY'; price=300 if cat=='PISTOL' else 900 if cat=='SMG' else 1100 if cat=='SHOTGUN' else 2600 if cat=='HEAVY' else 1900 if cat=='SNIPER' else 1500
              reserve=cap*(3 if cat=='SHOTGUN' else 2); mode='BURST_3' if 'burst' in n else 'AUTO' if (cat in ('SMG','HEAVY') or n in ('assault_rifle','service_rifle','combat_rifle')) else 'SEMI'; scope='SNIPER' if cat=='SNIPER' else 'NONE'
              eng=' '.join(w.capitalize() for w in n.split('_'))
              rows.append((n,eng,cat,slot,price,ammo,cap,reserve,mode,scope))
              print('PASS',n,ammo,cap)
          if len(rows)<15: raise SystemExit(f'too few standard guns discovered: {len(rows)}')
          src=['package arena.weapon;','','import java.util.*;','','public final class WeaponCatalog {','    private final Map<String, WeaponDefinition> byId = new LinkedHashMap<>();','    public WeaponCatalog(){registerDefaults();}','    public WeaponDefinition get(String id){return byId.get(id);}','    public Collection<WeaponDefinition> all(){return Collections.unmodifiableCollection(byId.values());}','    public List<WeaponDefinition> bySlot(WeaponDefinition.Slot slot){return byId.values().stream().filter(w->w.slot()==slot).toList();}','    public void register(WeaponDefinition d){Objects.requireNonNull(d);if(d.id()==null||d.id().isBlank())throw new IllegalArgumentException("weapon id");byId.put(d.id(),d);}','    private void registerDefaults(){']
          for n,eng,cat,slot,price,ammo,cap,reserve,mode,scope in rows:
              src.append(f'        register(new WeaponDefinition("jeg:{n}","{eng}",WeaponDefinition.Category.{cat},WeaponDefinition.Slot.{slot},{price},"{ammo}",{cap},{reserve},WeaponDefinition.Weight.MEDIUM,List.of(WeaponDefinition.FireMode.{mode}),WeaponDefinition.Scope.{scope}));')
          # Keep GGO custom prototypes from the source catalog.
          old=Path('hotfix/WeaponCatalog.java').read_text()
          for line in old.splitlines():
              if 'register(new WeaponDefinition("gunnerarena:' in line: src.append(line)
          src+=['    }','}']
          Path('ga-build/src/main/java/arena/weapon/WeaponCatalog.java').write_text('\n'.join(src)+'\n')
          Path('/tmp/jeg-count.txt').write_text(str(len(rows)))
          # Sound resource integrity: GGO does not replace native JEG gun sounds.
          if 'assets/jeg/sounds.json' not in z.namelist(): raise SystemExit('JEG sounds.json missing')
          ogg=sum(1 for x in z.namelist() if x.startswith('assets/jeg/sounds/') and x.endswith('.ogg'))
          if ogg<10: raise SystemExit('JEG sound assets unexpectedly missing')
          print('MAIN_JEG_GUNS=',len(rows),'NATIVE_OGG=',ogg)
          PY

      - name: Build Core
        shell: bash
        run: /tmp/runold 'Build Core'
      - name: Build UI
        shell: bash
        run: /tmp/runold 'Build UI'

      - name: Prepare payload
        shell: bash
        run: |
          /tmp/run3 'Prepare payload'
          C=final-artifacts/server/mods/gungloryonline-core-0.4.0-beta.jar
          U=final-artifacts/client/mods/gungloryonline-ui-0.4.0-beta.jar
          jar tf "$C" | grep -q '^arena/forge/JegArenaAmmoGuard.class$'
          jar tf "$U" | grep -q '^arena/client/ui/JegNoAmmoFeedback.class$'

      - name: Dedicated server smoke
        shell: bash
        run: /tmp/runold 'Dedicated server smoke'
      - name: Real Forge client smoke
        shell: bash
        run: /tmp/runold 'Real Forge client smoke'

      - name: Final audit
        shell: bash
        run: |
          set -euo pipefail
          /tmp/run3 'Final audit'
          C=final-artifacts/server/mods/gungloryonline-core-0.4.0-beta.jar
          U=final-artifacts/client/mods/gungloryonline-ui-0.4.0-beta.jar
          unzip -p "$C" arena/forge/JegArenaAmmoGuard.class | strings | grep -q 'НЕТ ПАТРОНОВ'
          unzip -p "$U" arena/client/ui/JegNoAmmoFeedback.class | strings | grep -q 'ПЕРЕЗАРЯДИТЬ'
          unzip -p "$C" arena/forge/MinimalGameplayFixes.class | strings | grep -q 'random_gun_ammo'
          COUNT=$(cat /tmp/jeg-count.txt)
          cat >> final-artifacts/VERIFICATION.txt <<EOF
          V04_FINAL_WEAPON_PASS=PASS
          MAIN_JEG_STANDARD_GUNS_IN_CATALOG=$COUNT
          JEG_NATIVE_SOUND_RESOURCES=AUDITED_NO_GGO_OVERRIDE
          EMPTY_MAG_ATTACK_FEEDBACK=PASS
          EMPTY_RESERVE_RELOAD_GUARD=PASS
          FAKE_ARENA_DRY_FIRE_INPUT_GUARD=PASS
          MAP_FIXED_AMMO_MARKERS=PISTOL+RIFLE+SHOTGUN
          MAP_RANDOM_AMMO_MARKER=ALL_LIVE_CATALOG_AMMO_TYPES
          RANDOM_AMMO_PICKUP_DELAY=5_TICKS
          UI_CORE_VERSION_RANGE_FIX=PASS
          EOF
          sha256sum final-artifacts/server/mods/* final-artifacts/client/mods/* final-artifacts/client/resourcepacks/* > final-artifacts/SHA256SUMS.txt

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: GunGloryOnline-v0.4-Beta-FINAL-WEAPON-PASS
          path: final-artifacts/**
          if-no-files-found: error
          retention-days: 30
      - name: Diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: GunGloryOnline-v0.4-Beta-FINAL7-diagnostics
          path: |
            v12-core-build.log
            v12-ui-build.log
            dedicated-server-console.log
            ds/logs/**
            cs/run/logs/**
            cs/run/crash-reports/**
          if-no-files-found: ignore
          retention-days: 7
