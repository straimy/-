name: GGO v0.4 JEG runtime inspect
on:
  push:
    paths: ['.github/workflows/ggo-v04-jeg-runtime-inspect.yml']
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -e
          mkdir out
          curl -fL --retry 3 -o /tmp/jeg.jar 'https://mediafilez.forgecdn.net/files/6808/139/JustEnoughGuns-0.13.2-1.20.1.jar'
          jar tf /tmp/jeg.jar | grep -Ei 'gun.*item.*class|item.*gun.*class|modified.*gun.*class|gun.*data.*class|reload.*class|ammo.*class' > out/classes.txt || true
          for C in $(cat out/classes.txt | sed 's#/#.#g;s#.class$##' | head -n 80); do
            echo "===== $C =====" >> out/javap.txt
            javap -classpath /tmp/jeg.jar -p -c "$C" >> out/javap.txt 2>&1 || true
          done
          unzip -p /tmp/jeg.jar | strings | grep -Ei 'Ammo|ammoCount|CurrentAmmo|Reload|GunData|FireMode' | sort -u | head -n 1000 > out/strings.txt || true
      - uses: actions/upload-artifact@v4
        with:
          name: ggo-v04-jeg-runtime
          path: out/**
