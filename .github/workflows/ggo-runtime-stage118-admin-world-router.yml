name: GGO Runtime Stage118 Admin World Router

on:
  workflow_dispatch:
  push:
    branches:
      - server/runtime-hardening-v1
    paths:
      - '.github/workflows/ggo-runtime-stage118-admin-world-router.yml'
      - 'hotfix/AdminToolsCommands.java'
      - 'hotfix/AdminModeGuard.java'
      - 'hotfix/AuthSecurityGuard.java'
      - 'hotfix/GgoWorldRouter.java'
      - 'runtime/maps/stage102-world-layout.json'

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      SOURCE_ZIP: gunner-arena-forge-1.20.1-0.6.0-test52-GREPFIX-SOURCE.zip
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Source gate
        id: source_gate
        run: |
          set -euo pipefail
          A=hotfix/AdminToolsCommands.java
          G=hotfix/AdminModeGuard.java
          H=hotfix/AuthSecurityGuard.java
          W=hotfix/GgoWorldRouter.java
          M=runtime/maps/stage102-world-layout.json
          grep -q 'Commands.literal("admin")' "$A"
          ! grep -q 'Commands.literal("gm")' "$A"
          grep -q 'a.invulnerable=true' "$G"
          grep -q 'LivingAttackEvent' "$G"
          grep -q 'LivingHurtEvent' "$G"
          grep -q 'ADMIN_BUILD_TAG' "$G"
          grep -q 'ADMIN_SPECTATOR_TAG' "$G"
          grep -q 'Legacy /login and /register are never accepted' "$H"
          grep -q 'GGO-WORLD-ROUTER-V2' "$W"
          grep -q 'findSafeSurface' "$W"
          grep -q 'Commands.literal("world")' "$W"
          grep -q 'br_drop_point' "$W"
          grep -q 'br_mini_pubg' "$W"
          grep -q -- '-126, -177' "$W"
          grep -q '999, 1019' "$W"
          grep -q '28, -41' "$W"
          grep -q '"source": "world_3"' "$M"
          grep -q '"logical_world_count": 4' "$M"

      - name: Prepare Forge wrapper
        run: |
          set -euo pipefail
          rm -rf /tmp/ggo-mdk /tmp/ggo-mdk.zip
          curl -fL --retry 3 -o /tmp/ggo-mdk.zip https://maven.minecraftforge.net/net/minecraftforge/forge/1.20.1-47.4.10/forge-1.20.1-47.4.10-mdk.zip
          mkdir -p /tmp/ggo-mdk
          unzip -q /tmp/ggo-mdk.zip 'gradlew' 'gradlew.bat' 'gradle/*' -d /tmp/ggo-mdk

      - name: Build Stage118 Core
        id: core
        run: |
          set -euo pipefail
          rm -rf ga-build stage118-server && mkdir ga-build
          unzip -q "$SOURCE_ZIP" -d ga-build
          for patch in \
            apply_ggo_contract_rewards_stage26.py \
            apply_ggo_contract_map_stage27.py \
            apply_ggo_contract_push_stage28.py \
            apply_ggo_contract_persistence_stage29.py \
            apply_ggo_contract_lifecycle_stage30.py \
            apply_ggo_contract_balance_stage31.py \
            apply_ggo_contract_eligibility_stage32.py \
            apply_ggo_supply_lifecycle_stage33.py \
            apply_ggo_extraction_runtime_stage34.py \
            apply_ggo_contract_network_guard_stage36.py \
            apply_ggo_contract_reward_order_stage37.py \
            apply_ggo_compile_baseline_stage27.py \
            apply_ggo_spawn_presence_stage38.py \
            apply_ggo_deminecraft_world_stage39.py \
            apply_ggo_deminecraft_loot_stage41.py \
            apply_ggo_inventory_stage42.py \
            apply_ggo_visible_content_stage43.py \
            apply_ggo_medicine_stage47.py \
            apply_ggo_death_recap_stage48.py \
            apply_ggo_recovery_bag_stage49.py \
            apply_ggo_map_integrity_stage51.py \
            apply_ggo_map_palette_stage54.py \
            apply_ggo_official_auth_stage55.py \
            apply_ggo_pre_auth_quarantine_stage59.py \
            apply_ggo_ui_packets_stage65.py \
            apply_ggo_ui_channel_ownership_stage71.py \
            apply_ggo_anticheat_stage82.py; do
            python3 "hotfix/$patch"
          done
          cp hotfix/AdminToolsCommands.java ga-build/src/main/java/arena/forge/AdminToolsCommands.java
          cp hotfix/AdminModeGuard.java ga-build/src/main/java/arena/forge/AdminModeGuard.java
          cp hotfix/AuthSecurityGuard.java ga-build/src/main/java/arena/forge/AuthSecurityGuard.java
          cp hotfix/GgoWorldRouter.java ga-build/src/main/java/arena/forge/GgoWorldRouter.java
          cp /tmp/ggo-mdk/gradlew ga-build/gradlew
          cp /tmp/ggo-mdk/gradlew.bat ga-build/gradlew.bat
          rm -rf ga-build/gradle && cp -a /tmp/ggo-mdk/gradle ga-build/gradle
          chmod +x ga-build/gradlew
          (cd ga-build && ./gradlew --no-daemon clean build --stacktrace)
          CORE="$(find ga-build/build/libs -type f -name '*.jar' ! -name '*sources*' ! -name '*dev*' | head -n1)"
          test -n "$CORE" && test -f "$CORE"
          for c in AdminToolsCommands AdminModeGuard AuthSecurityGuard GgoOfficialAuthState GgoWorldRouter; do
            jar tf "$CORE" | grep -q "^arena/forge/$c.class$"
          done
          unzip -p "$CORE" arena/forge/AdminModeGuard.class | strings | grep -q 'ggo_admin_build_mode'
          unzip -p "$CORE" arena/forge/GgoWorldRouter.class | strings | grep -q 'GGO-WORLD-ROUTER-V2'
          unzip -p "$CORE" arena/forge/GgoWorldRouter.class | strings | grep -q 'br_drop_point'
          unzip -p "$CORE" arena/forge/GgoWorldRouter.class | strings | grep -q 'br_mini_pubg'
          ! unzip -p "$CORE" arena/forge/AdminToolsCommands.class | strings | grep -q '^gm$'
          mkdir -p stage118-server
          cp "$CORE" stage118-server/gungloryonline-core-runtime-stage118-admin-world-router.jar
          cp runtime/maps/stage102-world-layout.json stage118-server/world-layout.json
          cp runtime/maps/stage102-uploaded-map-audit.json stage118-server/map-audit.json
          sha256sum stage118-server/gungloryonline-core-runtime-stage118-admin-world-router.jar > stage118-server/SHA256SUMS.txt
          echo "sha=$(sha256sum "$CORE" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "bytes=$(stat -c%s "$CORE")" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        id: upload
        with:
          name: GunGloryOnline-Stage118-Admin-World-Router
          path: stage118-server/**
          if-no-files-found: error
          retention-days: 30

      - name: Publish receipt
        if: always()
        run: |
          set -euo pipefail
          mkdir -p ci-results
          cat > ci-results/stage118-admin-world-router.txt <<EOF
          workflow=${GITHUB_WORKFLOW}
          run_id=${GITHUB_RUN_ID}
          server_sha=${GITHUB_SHA}
          build_id=runtime-stage118
          source_gate=${{ steps.source_gate.outcome }}
          core_build=${{ steps.core.outcome }}
          artifact_upload=${{ steps.upload.outcome }}
          core_sha256=${{ steps.core.outputs.sha }}
          core_bytes=${{ steps.core.outputs.bytes }}
          launcher_only_auth=true
          admin_immortal=true
          admin_build=true
          admin_spectator=true
          legacy_gm_alias=false
          world_router=true
          map_spawn_anchors=true
          logical_world_count=4
          safe_surface_spawn=true
          result=${{ job.status }}
          EOF
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ci-results/stage118-admin-world-router.txt
          git commit -m "ci: record Stage118 admin world router ${GITHUB_RUN_ID}" || exit 0
          git fetch origin server/runtime-hardening-v1
          git rebase origin/server/runtime-hardening-v1
          git push origin HEAD:server/runtime-hardening-v1
