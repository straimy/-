name: Gunner Arena FINAL FULL v5

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/gunner-arena-final-full-v5.yml'

env:
  SOURCE_ZIP: gunner-arena-forge-1.20.1-0.6.0-test52-GREPFIX-SOURCE.zip
  FINAL_RP: GunnerArena-ResourcePack-1.20.1-v1.zip

jobs:
  verify-final:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Download proven test54 Core
        uses: actions/download-artifact@v4
        with:
          name: GunnerArena-Core-test54-gameplayfix
          path: test54
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 31859223620

      - name: Download proven v4 client payload
        uses: actions/download-artifact@v4
        with:
          name: KVICloud-GunnerArena-FULL-v4
          path: v4-artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 31859223635

      - name: Prepare final test54 plus UI payload
        shell: bash
        run: |
          set -euo pipefail
          CORE="$(find test54 -type f -name 'gunnerarena-0.6.0-test54-gameplayfix.jar' | head -n1)"
          test -n "$CORE"
          jar tf "$CORE" | grep -q '^arena/GunnerArenaMod.class$'
          jar tf "$CORE" | grep -q '^arena/forge/MinimalGameplayFixes.class$'

          FULLZIP="$(find v4-artifact -type f -name 'KVICloud-GunnerArena-FULL.zip' | head -n1)"
          test -n "$FULLZIP"
          rm -rf v4-unpacked && mkdir v4-unpacked
          unzip -q "$FULLZIP" -d v4-unpacked
          UI="$(find v4-unpacked -type f -name 'gunnerarena_ui-*.jar' | head -n1)"
          test -n "$UI"
          jar tf "$UI" | grep -q '^arena/client/net/ArenaClientNetwork.class$'
          ! jar tf "$UI" | grep -q '^arena/forge/net/ArenaNetwork.class$'
          unzip -p "$UI" META-INF/mods.toml | grep -Fq 'modId="gunnerarena"'

          rm -rf final-artifacts
          mkdir -p final-artifacts/server/mods final-artifacts/client/mods final-artifacts/client/resourcepacks
          cp "$CORE" final-artifacts/server/mods/gunnerarena-0.6.0-test54-gameplayfix.jar
          cp "$CORE" final-artifacts/client/mods/gunnerarena-0.6.0-test54-gameplayfix.jar
          cp "$UI" final-artifacts/client/mods/gunnerarena_ui-0.6.0-test54-compatible.jar
          cmp final-artifacts/server/mods/gunnerarena-0.6.0-test54-gameplayfix.jar final-artifacts/client/mods/gunnerarena-0.6.0-test54-gameplayfix.jar
          sha256sum final-artifacts/server/mods/*.jar final-artifacts/client/mods/*.jar > final-artifacts/SHA256SUMS.txt

          cat >/tmp/extract_step.py <<'PY'
          import sys
          from pathlib import Path
          wanted=sys.argv[1]
          lines=Path('.github/workflows/gunner-arena-final-build-v3.yml').read_text().splitlines()
          start=next((i for i,l in enumerate(lines) if l.strip()==f'- name: {wanted}'),None)
          if start is None: raise SystemExit('step not found: '+wanted)
          run=None
          for i in range(start+1,len(lines)):
              if lines[i].startswith('      - name:'): break
              if lines[i].strip()=='run: |': run=i+1; break
          if run is None: raise SystemExit('run block missing: '+wanted)
          out=[]
          for i in range(run,len(lines)):
              l=lines[i]
              if l.startswith('      - name:'): break
              out.append(l[10:] if l.startswith('          ') else l)
          print('\n'.join(out).rstrip())
          PY

      - name: Dedicated server smoke test54
        shell: bash
        run: |
          set -euo pipefail
          python3 /tmp/extract_step.py 'Dedicated server smoke' >/tmp/server-smoke.sh
          bash /tmp/server-smoke.sh

      - name: Real client smoke test54 plus UI
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/mdk.zip https://maven.minecraftforge.net/net/minecraftforge/forge/1.20.1-47.4.10/forge-1.20.1-47.4.10-mdk.zip
          unzip -tq /tmp/mdk.zip
          python3 /tmp/extract_step.py 'Real client smoke with Core and UI JAR' >/tmp/client-smoke.sh
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/client-smoke.sh'); s=p.read_text()
          anchor='cd cs; chmod +x gradlew\n'
          if anchor not in s: raise SystemExit('client smoke anchor missing')
          prep="""mkdir -p cs/libs\nfor j in cs/run/mods/*.jar; do\n  if jar tf \"$j\" | grep -q '^arena/GunnerArenaMod.class$'; then\n    cp \"$j\" cs/libs/gunnerarena-core-0.6.0.jar\n  elif jar tf \"$j\" | grep -q '^arena/client/net/ArenaClientNetwork.class$'; then\n    cp \"$j\" cs/libs/gunnerarena-ui-0.6.0.jar\n  fi\ndone\ntest -f cs/libs/gunnerarena-core-0.6.0.jar\ntest -f cs/libs/gunnerarena-ui-0.6.0.jar\nrm -f cs/run/mods/*.jar\ncat >> cs/build.gradle <<'GRADLE'\nrepositories { flatDir { dirs 'libs' } }\ndependencies {\n    runtimeOnly fg.deobf('local:gunnerarena-core:0.6.0')\n    runtimeOnly fg.deobf('local:gunnerarena-ui:0.6.0')\n}\ntasks.configureEach { t ->\n    if (t.name == 'runClient') {\n        t.doFirst {\n            file('build/resources/main').mkdirs()\n            file('build/classes/java/main').mkdirs()\n        }\n    }\n}\nGRADLE\n"""
          s=s.replace(anchor,prep+anchor,1)
          old="""if [ -f \"$L\" ] && grep -Fq 'Reloading ResourceManager:' \"$L\" && grep -Fq 'gunnerarena' \"$L\" && grep -Fq 'gunnerarena_ui' \"$L\"; then R=1; break; fi"""
          new="""if [ -f \"$L\" ] && [ -f run/logs/debug.log ] && grep -Fq 'Reloading ResourceManager:' \"$L\" && grep -Fq 'with {gunnerarena} mods' run/logs/debug.log && grep -Fq 'with {gunnerarena_ui} mods' run/logs/debug.log; then R=1; break; fi"""
          if old not in s: raise SystemExit('client smoke success condition missing')
          p.write_text(s.replace(old,new,1))
          PY
          bash /tmp/client-smoke.sh

      - name: Verify final invariants
        shell: bash
        run: |
          set -euo pipefail
          CORE=final-artifacts/server/mods/gunnerarena-0.6.0-test54-gameplayfix.jar
          UI=final-artifacts/client/mods/gunnerarena_ui-0.6.0-test54-compatible.jar
          cmp "$CORE" final-artifacts/client/mods/gunnerarena-0.6.0-test54-gameplayfix.jar
          test "$(jar tf "$CORE" | grep -c '^arena/forge/net/ArenaNetwork.class$')" -eq 1
          ! jar tf "$UI" | grep -q '^arena/forge/net/ArenaNetwork.class$'
          jar tf "$CORE" | grep -q '^arena/forge/MinimalGameplayFixes.class$'
          printf 'CORE_SERVER_SMOKE=PASS\nCORE_UI_CLIENT_SMOKE=PASS\nDUPLICATE_CHANNEL_AUDIT=PASS\nAUTH_NPC_GAMEPLAY_PATCH=test54\n' > final-artifacts/VERIFICATION.txt

      - name: Upload verified final Core UI payload
        uses: actions/upload-artifact@v4
        with:
          name: GunnerArena-test54-final-verified
          path: final-artifacts/**
          if-no-files-found: error
          retention-days: 30

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: GunnerArena-v5-diagnostics
          path: |
            dedicated-server-console.log
            dedicated-server-latest.log
            client-smoke.log
            client-smoke-latest.log
            ds/logs/**
            cs/run/logs/**
            cs/run/crash-reports/**
          if-no-files-found: ignore
          retention-days: 7
