name: GGO Server Hardening v1

on:
  push:
    branches:
      - server/runtime-hardening-v1
    paths:
      - '.github/workflows/ggo-server-hardening-v1.yml'
      - 'hotfix/GgoAntiCheatTelemetry.java'
      - 'hotfix/GgoMovementAuthority.java'
      - 'hotfix/GgoServerRulesGuard.java'
      - 'hotfix/GgoGameModeRegistry.java'
      - 'hotfix/GgoLootSpawnService.java'
      - 'hotfix/ClassicArenaMapGenerator.java'
      - 'hotfix/CGBetaForgeAdapter.java'
      - 'hotfix/ClassicArenaPickupService.java'
      - 'hotfix/ClassicArenaSpawnService.java'
      - 'hotfix/ClassicArenaMatchService.java'
      - 'hotfix/ClassicArenaLoadoutService.java'
      - 'hotfix/ClassicArenaJumpPadService.java'
      - 'hotfix/DuelMatchService.java'
      - 'hotfix/BattleRoyaleService.java'
      - 'hotfix/BattleRoyaleLootService.java'
      - 'hotfix/GgoLegacyCommandBlockCleaner.java'
      - 'docs/command-block-migration.md'
      - 'docs/current-server-build-audit-2026-08-17.md'
      - 'docs/runtime-mod-cleanup-plan-2026-08-17.md'
      - 'tools/world_command_audit.py'
      - 'tools/real_world_classic_smoke.py'
  workflow_dispatch:

env:
  SOURCE_ZIP: gunner-arena-forge-1.20.1-0.6.0-test52-GREPFIX-SOURCE.zip
  FINAL_RP: GunnerArena-ResourcePack-1.20.1-v1.zip

jobs:
  hardening:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate migration tools
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/world_command_audit.py tools/real_world_classic_smoke.py
          python3 tools/world_command_audit.py --help >/dev/null
          python3 tools/real_world_classic_smoke.py --help >/dev/null

      - name: Prepare extractor
        shell: bash
        run: |
          cat >/tmp/extract.py <<'PY'
          import sys
          from pathlib import Path
          wf=Path(sys.argv[1]); wanted=sys.argv[2]; lines=wf.read_text().splitlines()
          start=next((i for i,l in enumerate(lines) if l.strip()==f'- name: {wanted}'),None)
          if start is None: raise SystemExit('step not found: '+wanted)
          run=None
          for i in range(start+1,len(lines)):
              if lines[i].startswith('      - name:') or lines[i].startswith('      - uses:'): break
              if lines[i].strip()=='run: |': run=i+1; break
          if run is None: raise SystemExit('run block missing: '+wanted)
          out=[]
          for i in range(run,len(lines)):
              l=lines[i]
              if l.startswith('      - name:') or l.startswith('      - uses:'): break
              out.append(l[10:] if l.startswith('          ') else l)
          print('\n'.join(out).rstrip())
          PY

      - name: Prepare v40 source
        shell: bash
        run: |
          set -euo pipefail
          python3 /tmp/extract.py .github/workflows/gun-glory-online-v40-admin-npc-squad.yml 'Prepare latest source robustly' >/tmp/prepare-v40.sh
          bash /tmp/prepare-v40.sh
          python3 /tmp/extract.py .github/workflows/gun-glory-online-v40-admin-npc-squad.yml 'Apply v39 inventory and v40 NPC admin' >/tmp/apply-v40.sh
          bash /tmp/apply-v40.sh
          test -f ga-build/src/main/java/arena/forge/ArenaRuntime.java

      - name: Apply server hardening v1
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ga-build/src/main/java/arena/forge
          cp hotfix/GgoAntiCheatTelemetry.java ga-build/src/main/java/arena/forge/GgoAntiCheatTelemetry.java
          cp hotfix/GgoMovementAuthority.java ga-build/src/main/java/arena/forge/GgoMovementAuthority.java
          cp hotfix/GgoServerRulesGuard.java ga-build/src/main/java/arena/forge/GgoServerRulesGuard.java
          cp hotfix/GgoGameModeRegistry.java ga-build/src/main/java/arena/forge/GgoGameModeRegistry.java
          cp hotfix/GgoLootSpawnService.java ga-build/src/main/java/arena/forge/GgoLootSpawnService.java
          cp hotfix/ClassicArenaMapGenerator.java ga-build/src/main/java/arena/forge/ClassicArenaMapGenerator.java
          cp hotfix/CGBetaForgeAdapter.java ga-build/src/main/java/arena/forge/CGBetaForgeAdapter.java
          cp hotfix/ClassicArenaPickupService.java ga-build/src/main/java/arena/forge/ClassicArenaPickupService.java
          cp hotfix/ClassicArenaSpawnService.java ga-build/src/main/java/arena/forge/ClassicArenaSpawnService.java
          cp hotfix/ClassicArenaMatchService.java ga-build/src/main/java/arena/forge/ClassicArenaMatchService.java
          cp hotfix/ClassicArenaLoadoutService.java ga-build/src/main/java/arena/forge/ClassicArenaLoadoutService.java
          cp hotfix/ClassicArenaJumpPadService.java ga-build/src/main/java/arena/forge/ClassicArenaJumpPadService.java
          cp hotfix/DuelMatchService.java ga-build/src/main/java/arena/forge/DuelMatchService.java
          cp hotfix/BattleRoyaleService.java ga-build/src/main/java/arena/forge/BattleRoyaleService.java
          cp hotfix/BattleRoyaleLootService.java ga-build/src/main/java/arena/forge/BattleRoyaleLootService.java
          cp hotfix/GgoLegacyCommandBlockCleaner.java ga-build/src/main/java/arena/forge/GgoLegacyCommandBlockCleaner.java
          grep -q 'GGO-AC-V2' ga-build/src/main/java/arena/forge/GgoAntiCheatTelemetry.java
          grep -q 'GgoMovementAuthority.isAuthorized' ga-build/src/main/java/arena/forge/GgoAntiCheatTelemetry.java
          grep -q 'GGO-MOVE-AUTH-V1' ga-build/src/main/java/arena/forge/GgoMovementAuthority.java
          grep -q 'GGO-RULES-V1' ga-build/src/main/java/arena/forge/GgoServerRulesGuard.java
          grep -q 'Classic Arena' ga-build/src/main/java/arena/forge/GgoGameModeRegistry.java
          grep -q 'GGO-LOOT-V1' ga-build/src/main/java/arena/forge/GgoLootSpawnService.java
          grep -q 'GGO-CLASSIC-GEN-V3' ga-build/src/main/java/arena/forge/ClassicArenaMapGenerator.java
          grep -q 'ClassicArenaMapGenerator.shared()' ga-build/src/main/java/arena/forge/CGBetaForgeAdapter.java
          grep -q 'GGO-CLASSIC-PICKUPS-V2' ga-build/src/main/java/arena/forge/ClassicArenaPickupService.java
          grep -q 'GGO-CLASSIC-SPAWN-V3' ga-build/src/main/java/arena/forge/ClassicArenaSpawnService.java
          grep -q 'GGO-CLASSIC-MATCH-V3' ga-build/src/main/java/arena/forge/ClassicArenaMatchService.java
          grep -q 'GGO-CLASSIC-LOADOUT-V1' ga-build/src/main/java/arena/forge/ClassicArenaLoadoutService.java
          grep -q 'GGO-CLASSIC-JUMPPAD-V2' ga-build/src/main/java/arena/forge/ClassicArenaJumpPadService.java
          grep -q 'GgoMovementAuthority.authorize' ga-build/src/main/java/arena/forge/ClassicArenaJumpPadService.java
          grep -q 'GGO-DUELS-V1' ga-build/src/main/java/arena/forge/DuelMatchService.java
          grep -q 'ROUNDS_TO_WIN = 2' ga-build/src/main/java/arena/forge/DuelMatchService.java
          grep -q 'GGO-BR-V2' ga-build/src/main/java/arena/forge/BattleRoyaleService.java
          grep -q 'BattleRoyaleLootService.prepareRound' ga-build/src/main/java/arena/forge/BattleRoyaleService.java
          grep -q 'GGO-BR-LOOT-V1' ga-build/src/main/java/arena/forge/BattleRoyaleLootService.java
          grep -q 'br-loot.properties' ga-build/src/main/java/arena/forge/BattleRoyaleLootService.java
          ! grep -q 'WorldBorder\|scoreboard\|CommandBlock' ga-build/src/main/java/arena/forge/BattleRoyaleService.java
          grep -q 'strip CONFIRM' ga-build/src/main/java/arena/forge/GgoLegacyCommandBlockCleaner.java
          ! grep -q 'setBlock.*REDSTONE\|Scoreboard\|#cg_chunk_count' ga-build/src/main/java/arena/forge/CGBetaForgeAdapter.java

      - name: Build Core
        shell: bash
        run: |
          set -euo pipefail
          python3 /tmp/extract.py .github/workflows/gun-glory-online-v12.yml 'Bootstrap ForgeGradle and build Core' >/tmp/core.sh
          (cd ga-build && bash /tmp/core.sh)

      - name: Verify hardening classes
        shell: bash
        run: |
          set -euo pipefail
          CORE="$(find ga-build/build/libs -type f -name '*.jar' ! -name '*sources*' ! -name '*dev*' | head -n1)"
          test -n "$CORE"
          jar tf "$CORE" | grep -q '^arena/forge/GgoAntiCheatTelemetry.class$'
          jar tf "$CORE" | grep -q '^arena/forge/GgoMovementAuthority.class$'
          jar tf "$CORE" | grep -q '^arena/forge/GgoServerRulesGuard.class$'
          jar tf "$CORE" | grep -q '^arena/forge/GgoGameModeRegistry.class$'
          jar tf "$CORE" | grep -q '^arena/forge/GgoLootSpawnService.class$'
          jar tf "$CORE" | grep -q '^arena/forge/ClassicArenaMapGenerator.class$'
          jar tf "$CORE" | grep -q '^arena/forge/CGBetaForgeAdapter.class$'
          jar tf "$CORE" | grep -q '^arena/forge/ClassicArenaPickupService.class$'
          jar tf "$CORE" | grep -q '^arena/forge/ClassicArenaSpawnService.class$'
          jar tf "$CORE" | grep -q '^arena/forge/ClassicArenaMatchService.class$'
          jar tf "$CORE" | grep -q '^arena/forge/ClassicArenaLoadoutService.class$'
          jar tf "$CORE" | grep -q '^arena/forge/ClassicArenaJumpPadService.class$'
          jar tf "$CORE" | grep -q '^arena/forge/DuelMatchService.class$'
          jar tf "$CORE" | grep -q '^arena/forge/BattleRoyaleService.class$'
          jar tf "$CORE" | grep -q '^arena/forge/BattleRoyaleLootService.class$'
          jar tf "$CORE" | grep -q '^arena/forge/GgoLegacyCommandBlockCleaner.class$'
          mkdir -p server-hardening/server/mods
          cp "$CORE" server-hardening/server/mods/gungloryonline-core-0.9.7-v40-server-hardening1.jar
          sha256sum server-hardening/server/mods/* > server-hardening/SHA256SUMS.txt
          cat > server-hardening/README.txt <<'EOF'
          GunGloryOnline Server Hardening v1
          Anti-cheat v2 understands only server-authorized movement exemptions; clients cannot grant them.
          Classic Arena remains MIGRATING until real-world command-block-off gameplay smoke passes.
          Classic generation, loadout, pickups, initial spawn, respawn, score, winner and jump pads are server-owned Java systems.
          DuelMatchService provides a server-owned 1v1 BO3 queue/session foundation; Duels remains PLANNED until map integration.
          Battle Royale has server-owned alive state, shrinking safe-zone phases and typed config-driven loot markers; BR remains PLANNED until map integration.
          GgoLegacyCommandBlockCleaner remains manual/OP-only and requires explicit CONFIRM.
          EOF

      - name: Dedicated server smoke
        shell: bash
        run: |
          set -euo pipefail
          rm -rf ds forge-installer.jar; mkdir ds
          curl -fL --retry 5 --retry-all-errors -o forge-installer.jar https://maven.minecraftforge.net/net/minecraftforge/forge/1.20.1-47.4.10/forge-1.20.1-47.4.10-installer.jar
          java -jar forge-installer.jar --installServer ds >/tmp/forge-install.log 2>&1
          echo 'eula=true' > ds/eula.txt
          mkdir -p ds/mods
          cp server-hardening/server/mods/*.jar ds/mods/
          cd ds
          timeout 100s java -Xms512M -Xmx1G @libraries/net/minecraftforge/forge/1.20.1-47.4.10/unix_args.txt nogui > ../dedicated-server-console.log 2>&1 || true
          cd ..
          test -f ds/logs/latest.log
          grep -Fq 'Done (' ds/logs/latest.log
          ! grep -Eq 'Exception in server tick loop|Failed to start the minecraft server|Duplicate key gunnerarena' ds/logs/latest.log

      - name: Upload server hardening build
        uses: actions/upload-artifact@v4
        with:
          name: GunGloryOnline-v40-server-hardening-v1
          path: server-hardening/**
          if-no-files-found: error
          retention-days: 30

      - name: Diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: GunGloryOnline-server-hardening-v1-diagnostics
          path: |
            v12-core-build.log
            dedicated-server-console.log
            ds/logs/**
          if-no-files-found: ignore
          retention-days: 7
