name: GGO Client Source Probe

on:
  workflow_dispatch:
  push:
    branches:
      - client/runtime-migration-v1
    paths:
      - '.github/workflows/ggo-client-source-probe.yml'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      SOURCE_ZIP: gunner-arena-forge-1.20.1-0.6.0-test52-GREPFIX-SOURCE.zip
    steps:
      - uses: actions/checkout@v4
      - name: Extract exact legacy UI sources
        run: |
          set -euo pipefail
          rm -rf /tmp/ggo-probe
          mkdir -p /tmp/ggo-probe ci-probe
          unzip -q "$SOURCE_ZIP" -d /tmp/ggo-probe
          cp /tmp/ggo-probe/client-ui/src/main/java/arena/client/ui/ArenaButton.java ci-probe/ArenaButton.java.txt
          cp /tmp/ggo-probe/client-ui/src/main/java/arena/client/ui/ArenaNavigation.java ci-probe/ArenaNavigation.java.txt
          grep -R "ArenaNavigation" -n /tmp/ggo-probe/client-ui/src/main/java/arena/client/ui > ci-probe/ArenaNavigation-callers.txt || true
      - name: Publish probe
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ci-probe
          git commit -m "ci: capture exact client baseline sources" || exit 0
          git fetch origin "$GITHUB_REF_NAME"
          git rebase "origin/$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
