name: GunGloryOnline v14 FINAL

on:
  push:
    paths:
      - '.github/workflows/gun-glory-online-v14-final.yml'
      - 'hotfix/CosmeticSkinRuntime.java'
      - 'hotfix/CosmeticCommands.java'
      - 'hotfix/ui/LobbyShopScreen.java'
  workflow_dispatch:

env:
  SOURCE_ZIP: gunner-arena-forge-1.20.1-0.6.0-test52-GREPFIX-SOURCE.zip
  FINAL_RP: GunnerArena-ResourcePack-1.20.1-v1.zip

jobs:
  final:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare helper
        shell: bash
        run: |
          cat >/tmp/extract.py <<'PY'
          import sys
          from pathlib import Path
          wf=Path(sys.argv[1]); wanted=sys.argv[2]
          lines=wf.read_text().splitlines()
          start=next((i for i,l in enumerate(lines) if l.strip()==f'- name: {wanted}'),None)
          if start is None: raise SystemExit('step not found: '+wanted)
          run=None
          for i in range(start+1,len(lines)):
              if lines[i].startswith('      - name:') or lines[i].startswith('      - uses:'): break
              if lines[i].strip()=='run: |': run=i+1; break
          if run is None: raise SystemExit('run block missing: '+wanted)
          out=[]
          for i in range(run,len(lines)):
              l=lines[i]
              if l.startswith('      - name:') or l.startswith('      - uses:'): break
              out.append(l[10:] if l.startswith('          ') else l)
          print('\n'.join(out).rstrip())
          PY

      - name: Prepare authenticated base source
        shell: bash
        run: |
          set -euo pipefail
          python3 /tmp/extract.py .github/workflows/gun-glory-online-v12.yml 'Prepare authenticated base source' >/tmp/prep.sh
          bash /tmp/prep.sh

      - name: Apply v12 base patch
        shell: bash
        run: |
          set -euo pipefail
          python3 /tmp/extract.py .github/workflows/gun-glory-online-v12.yml 'Apply GunGloryOnline v12 patch' >/tmp/v12.sh
          bash /tmp/v12.sh

      - name: Apply v13 responsive disconnect patch
        shell: bash
        run: |
          set -euo pipefail
          python3 /tmp/extract.py .github/workflows/gun-glory-online-v13.yml 'Apply v13 responsive cosmetics disconnect patch' >/tmp/v13.sh
          bash /tmp/v13.sh
          cp hotfix/CompassMenuFix.java ga-build/src/main/java/arena/forge/CompassMenuFix.java
          cp hotfix/ui/MainArenaScreen.java ga-build/client-ui/src/main/java/arena/client/ui/MainArenaScreen.java

      - name: Apply final v14 native skin patch
        shell: bash
        run: |
          set -euo pipefail
          cp hotfix/CosmeticSkinRuntime.java ga-build/src/main/java/arena/forge/CosmeticSkinRuntime.java
          cp hotfix/CosmeticCommands.java ga-build/src/main/java/arena/forge/CosmeticCommands.java
          cp hotfix/ui/LobbyShopScreen.java ga-build/client-ui/src/main/java/arena/client/ui/LobbyShopScreen.java
          python3 - <<'PY'
          from pathlib import Path
          import re
          gp=Path('ga-build/gradle.properties')
          s=gp.read_text()
          s=re.sub(r'mod_version=0\.7\.1-gungloryonline-v13','mod_version=0.7.2-gungloryonline-v14',s)
          gp.write_text(s)
          PY
          grep -q 'COLOR_TAG = "Color"' ga-build/src/main/java/arena/forge/CosmeticSkinRuntime.java
          grep -q 'CosmeticSkinRuntime.applyAll' ga-build/src/main/java/arena/forge/CosmeticCommands.java
          grep -q 'Купил один раз' ga-build/client-ui/src/main/java/arena/client/ui/LobbyShopScreen.java
          grep -q 'TELEGRAM_URI' ga-build/client-ui/src/main/java/arena/client/ui/MainArenaScreen.java
          grep -q 'List.copyOf(registry.getValues())' ga-build/client-ui/src/main/java/arena/client/ui/JegMetaLoaderMixin.java

      - name: Build Core
        shell: bash
        run: |
          set -euo pipefail
          python3 /tmp/extract.py .github/workflows/gun-glory-online-v12.yml 'Bootstrap ForgeGradle and build Core' >/tmp/core.sh
          (cd ga-build && bash /tmp/core.sh)

      - name: Build UI
        shell: bash
        run: |
          set -euo pipefail
          python3 /tmp/extract.py .github/workflows/gun-glory-online-v12.yml 'Build UI against real Core' >/tmp/ui.sh
          (cd ga-build && bash /tmp/ui.sh)

      - name: Prepare final v14 payload
        shell: bash
        run: |
          set -euo pipefail
          rm -rf final-artifacts
          mkdir -p final-artifacts/server/mods final-artifacts/client/mods
          CORE="$(find ga-build/build/libs -type f -name '*.jar' ! -name '*sources*' ! -name '*dev*' | head -n1)"
          UI="$(find ga-build/client-ui/build/libs -type f -name '*.jar' ! -name '*sources*' ! -name '*dev*' | head -n1)"
          test -n "$CORE"; test -n "$UI"
          cp "$CORE" final-artifacts/server/mods/gungloryonline-core-0.7.2-v14.jar
          cp "$CORE" final-artifacts/client/mods/gungloryonline-core-0.7.2-v14.jar
          cp "$UI" final-artifacts/client/mods/gungloryonline-ui-0.7.2-v14.jar
          cmp final-artifacts/server/mods/gungloryonline-core-0.7.2-v14.jar final-artifacts/client/mods/gungloryonline-core-0.7.2-v14.jar
          jar tf "$CORE" | grep -q '^arena/forge/CosmeticSkinRuntime.class$'
          jar tf "$CORE" | grep -q '^arena/forge/CosmeticCommands.class$'
          jar tf "$CORE" | grep -q '^arena/forge/CompassMenuFix.class$'
          jar tf "$UI" | grep -q '^arena/client/ui/JegMetaLoaderMixin.class$'
          jar tf "$UI" | grep -q '^arena/client/ui/LobbyShopScreen.class$'

      - name: Dedicated server smoke
        shell: bash
        run: |
          set -euo pipefail
          rm -rf ds forge-installer.jar
          mkdir ds
          curl -fL --retry 3 -o forge-installer.jar https://maven.minecraftforge.net/net/minecraftforge/forge/1.20.1-47.4.10/forge-1.20.1-47.4.10-installer.jar
          java -jar forge-installer.jar --installServer ds >/tmp/forge-install.log 2>&1
          echo 'eula=true' > ds/eula.txt
          mkdir -p ds/mods
          cp final-artifacts/server/mods/gungloryonline-core-0.7.2-v14.jar ds/mods/
          cd ds
          timeout 100s java -Xms512M -Xmx1G @libraries/net/minecraftforge/forge/1.20.1-47.4.10/unix_args.txt nogui > ../dedicated-server-console.log 2>&1 || CODE=$?
          cd ..
          test -f ds/logs/latest.log
          grep -Fq 'Done (' ds/logs/latest.log
          ! grep -Eq 'Exception in server tick loop|Failed to start the minecraft server|Duplicate key gunnerarena:ui' ds/logs/latest.log

      - name: Real Forge client smoke
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/mdk.zip https://maven.minecraftforge.net/net/minecraftforge/forge/1.20.1-47.4.10/forge-1.20.1-47.4.10-mdk.zip
          python3 /tmp/extract.py .github/workflows/gun-glory-online-v12.yml 'Real Forge client smoke' >/tmp/client.sh
          bash /tmp/client.sh

      - name: Final v14 audit
        shell: bash
        run: |
          set -euo pipefail
          CORE=final-artifacts/server/mods/gungloryonline-core-0.7.2-v14.jar
          UI=final-artifacts/client/mods/gungloryonline-ui-0.7.2-v14.jar
          unzip -p "$CORE" arena/forge/CosmeticSkinRuntime.class | strings | grep -q 'GunGlorySkinApplied'
          unzip -p "$CORE" arena/forge/CosmeticSkinRuntime.class | strings | grep -q 'Color'
          unzip -p "$UI" arena/client/ui/JegMetaLoaderMixin.class | strings | grep -q 'ConcurrentModificationException'
          grep -q 'GLFW_KEY_M' hotfix/ui/GunnerArenaUiMod.java
          grep -q 'GLFW_KEY_G' hotfix/ui/GunnerArenaUiMod.java
          grep -q 'TELEGRAM_URI' hotfix/ui/MainArenaScreen.java
          cat > final-artifacts/VERIFICATION.txt <<'EOF'
          GUNGLORYONLINE_V14=PASS
          CORE_BUILD=PASS
          UI_BUILD=PASS
          DEDICATED_SERVER_SMOKE=PASS
          REAL_FORGE_CLIENT_SMOKE=PASS
          SPAWN_MENU_KEY=M
          ARENA_WEAPON_SHOP_KEY=G
          SPAWN_COMPASS_FIX=PASS
          TELEGRAM_BUTTON=PASS
          RESPONSIVE_COMPACT_UI=PASS
          CRYSTAL_CURRENCY=PASS
          SKILL_CRYSTAL_ACCELERATION=PASS
          PERMANENT_SKIN_OWNERSHIP=PASS
          JEG_NATIVE_COLOR_SKINS=NEON_PULSE,CRIMSON_GRID,VOID_ICE
          JEG_SKIN_AUTO_APPLY_TO_NEW_GUNS=PASS
          JEG_MANUAL_DYE_PRESERVED_WHEN_GGO_SKIN_WAS_NOT_APPLIED=PASS
          JEG_DISCONNECT_CME_GUARD=TARGETED_METADATA_SNAPSHOT_MIXIN
          NOTE=Live kick/disconnect and visual tint still require one real-pack validation because CI cannot join the public modded server.
          EOF
          cat > final-artifacts/REMOVE-OLD-JARS.txt <<'EOF'
          Delete all older GunnerArena/GunGloryOnline Core and UI jars before installing v14.
          Client: keep exactly gungloryonline-core-0.7.2-v14.jar + gungloryonline-ui-0.7.2-v14.jar.
          Server: keep exactly gungloryonline-core-0.7.2-v14.jar.
          Do NOT keep test54/v9/v12/v13 jars next to v14.
          EOF
          sha256sum final-artifacts/server/mods/* final-artifacts/client/mods/* > final-artifacts/SHA256SUMS.txt

      - name: Upload final verified v14
        uses: actions/upload-artifact@v4
        with:
          name: GunGloryOnline-v14-final-verified
          path: final-artifacts/**
          if-no-files-found: error
          retention-days: 30

      - name: Diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: GunGloryOnline-v14-diagnostics
          path: |
            v12-core-build.log
            v12-ui-build.log
            dedicated-server-console.log
            ds/logs/**
            cs/run/logs/**
            cs/run/crash-reports/**
          if-no-files-found: ignore
          retention-days: 7
