name: GGO Launcher Stage 62 Diagnostics

on:
  push:
    branches:
      - launcher/bootstrap-v0.1
    paths:
      - '.github/workflows/ggo-launcher-stage62-diagnostics.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: launcher/bootstrap-v0.1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable

      - name: Python compile
        id: pycompile
        continue-on-error: true
        run: python3 -m py_compile services/ggo-auth/server.py services/ggo-auth/test_auth.py infra/vds/publish_release.py

      - name: Auth tests
        id: authtests
        continue-on-error: true
        run: python3 services/ggo-auth/test_auth.py -v

      - name: Auth TTL source assertions
        id: authassert
        continue-on-error: true
        run: |
          set -euo pipefail
          grep -q 'GAME_TICKET_TTL = 3 \* 60' services/ggo-auth/server.py
          grep -q 'assertGreaterEqual(ticket\["expires_in"\], 175)' services/ggo-auth/test_auth.py

      - name: Install Linux launcher dependencies
        id: apt
        continue-on-error: true
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: NPM install
        id: npminstall
        continue-on-error: true
        working-directory: launcher
        run: npm install

      - name: Frontend build
        id: frontend
        continue-on-error: true
        working-directory: launcher
        run: npm run build

      - name: Rust format check
        id: rustfmt
        continue-on-error: true
        working-directory: launcher
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Rust check
        id: rustcheck
        continue-on-error: true
        working-directory: launcher
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Rust tests
        id: rusttests
        continue-on-error: true
        working-directory: launcher
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Launch ticket Rust assertions
        id: ticketassert
        continue-on-error: true
        working-directory: launcher
        run: |
          set -euo pipefail
          grep -q 'GGO_GAME_TICKET' src-tauri/src/lib.rs
          grep -q 'launch_with_natives_environment' src-tauri/src/lib.rs
          grep -q 'command.env' src-tauri/src/runtime/minecraft_launch.rs

      - name: Frontend ticket secrecy assertions
        id: frontendassert
        continue-on-error: true
        working-directory: launcher
        run: |
          set -euo pipefail
          ! grep -q 'GGO_GAME_TICKET' src/App.tsx
          ! grep -q '2.26.100.125:24842' src/App.tsx
          ! grep -q 'onDoubleClick={()=>void launch(false,server)}' src/App.tsx

      - name: Managed asset assertions
        id: assetassert
        continue-on-error: true
        working-directory: launcher
        run: |
          set -euo pipefail
          grep -q 'GunGloryOnline-Official.zip' src-tauri/src/runtime/official_resource_pack.rs
          grep -q 'launcher-managed' src-tauri/src/runtime/ggo_local_install.rs
          grep -q 'acceptTextures' src-tauri/src/runtime/official_server.rs
          grep -q 'play.kvicloud.ru:24842' src/App.tsx

      - name: Publish diagnostics receipt
        if: always()
        env:
          PYCOMPILE: ${{ steps.pycompile.outcome }}
          AUTHTESTS: ${{ steps.authtests.outcome }}
          AUTHASSERT: ${{ steps.authassert.outcome }}
          APT: ${{ steps.apt.outcome }}
          NPMINSTALL: ${{ steps.npminstall.outcome }}
          FRONTEND: ${{ steps.frontend.outcome }}
          RUSTFMT: ${{ steps.rustfmt.outcome }}
          RUSTCHECK: ${{ steps.rustcheck.outcome }}
          RUSTTESTS: ${{ steps.rusttests.outcome }}
          TICKETASSERT: ${{ steps.ticketassert.outcome }}
          FRONTENDASSERT: ${{ steps.frontendassert.outcome }}
          ASSETASSERT: ${{ steps.assetassert.outcome }}
        run: |
          set -euo pipefail
          mkdir -p ci-results
          printf '%s\n' \
            "workflow=${{ github.workflow }}" \
            "run_id=${{ github.run_id }}" \
            "head_sha=${{ github.sha }}" \
            "python_compile=$PYCOMPILE" \
            "auth_tests=$AUTHTESTS" \
            "auth_assertions=$AUTHASSERT" \
            "apt_dependencies=$APT" \
            "npm_install=$NPMINSTALL" \
            "frontend_build=$FRONTEND" \
            "rust_fmt=$RUSTFMT" \
            "rust_check=$RUSTCHECK" \
            "rust_tests=$RUSTTESTS" \
            "ticket_assertions=$TICKETASSERT" \
            "frontend_assertions=$FRONTENDASSERT" \
            "asset_assertions=$ASSETASSERT" \
            > ci-results/launcher-stage62-diagnostics.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ci-results/launcher-stage62-diagnostics.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'ci: record Stage 62 launcher diagnostics'
          git fetch origin launcher/bootstrap-v0.1
          git rebase origin/launcher/bootstrap-v0.1
          git push origin HEAD:launcher/bootstrap-v0.1
