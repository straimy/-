name: AI Gunner 1.5 dev12 Build

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/ai-gunner-1.5-dev12-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout AI Gunner build branch
        uses: actions/checkout@v4
        with:
          ref: ai-gunner-1.5-build
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Restore dev10 and apply dev11/dev12 patches
        shell: bash
        run: |
          set -euxo pipefail
          cat ai-gunner-1.5/dev10-source.part-*.b64 | base64 --decode > /tmp/dev10-source.zip
          rm -rf /tmp/aigunner
          mkdir -p /tmp/aigunner
          unzip -q /tmp/dev10-source.zip -d /tmp/aigunner
          python3 ai-gunner-1.5/dev11-apply.py
          python3 ai-gunner-1.5/dev12-apply.py
      - name: Build dev12
        shell: bash
        run: |
          set -euxo pipefail
          cd /tmp/aigunner/ai-gunner-dev10
          gradle build --no-daemon
          test -s build/libs/ai-gunner-jeg-forge-1.20.1-1.5.0-dev12.jar
          jar tf build/libs/ai-gunner-jeg-forge-1.20.1-1.5.0-dev12.jar | grep -q 'META-INF/mods.toml'
      - name: Package source
        shell: bash
        run: |
          cd /tmp/aigunner
          zip -qr /tmp/ai-gunner-jeg-forge-1.20.1-1.5.0-dev12-SOURCE.zip ai-gunner-dev10
      - name: Upload dev12 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ai-gunner-1.5-dev12
          path: |
            /tmp/aigunner/ai-gunner-dev10/build/libs/ai-gunner-jeg-forge-1.20.1-1.5.0-dev12.jar
            /tmp/ai-gunner-jeg-forge-1.20.1-1.5.0-dev12-SOURCE.zip
