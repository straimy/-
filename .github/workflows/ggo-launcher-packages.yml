name: GunGloryOnline Launcher Packages

on:
  push:
    branches: ["launcher/bootstrap-v0.1"]
    paths:
      - "launcher/**"
      - "site/**"
      - "services/ggo-auth/**"
      - ".github/workflows/ggo-launcher-packages.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            bundle: appimage,deb,rpm
            artifact: GunGloryOnline-Launcher-Linux
          - os: windows-2022
            bundle: nsis,msi
            artifact: GunGloryOnline-Launcher-Windows
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: launcher
    env:
      GGO_CONTENT_BASE_URL: https://ggo.kvicloud.ru/content
      GGO_SITE_URL: https://ggo.kvicloud.ru
    steps:
      - uses: actions/checkout@v4
        with:
          ref: launcher/bootstrap-v0.1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2 rpm
        working-directory: .
      - name: Install frontend dependencies
        run: npm install
      - name: Apply canonical Stage111 launcher contract
        run: |
          set -euo pipefail
          python3 hotfix/apply_menu_first_beta_stage76.py
          python3 hotfix/apply_stage111_resilient_install.py
      - name: Generate platform icons
        run: npm run tauri icon src-tauri/icons/icon.png
      - name: Frontend type/build gate
        run: npm run build
      - name: Rust format gate
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - name: Rust compile gate
        run: cargo check --manifest-path src-tauri/Cargo.toml
      - name: Runtime unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Verify packaged launch surface
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'async fn launch_game(' src-tauri/src/lib.rs
          grep -q 'options.connect_server = false;' src-tauri/src/lib.rs
          grep -q 'GGO_GAME_TICKET_EXPIRES_AT' src-tauri/src/lib.rs
          ! grep -q 'async fn launch_minecraft(' src-tauri/src/lib.rs
          ! grep -q 'async fn preview_minecraft_launch(' src-tauri/src/lib.rs
          ! grep -q 'onClick={()=>void launch(true)}' src/App.tsx
          grep -q '?t.install:updateAvailable?t.updateGame:t.play' src/App.tsx
          test "$(grep -o 'setClientRunning(true);' src/App.tsx | wc -l)" -eq 1
          ! grep -Fq 'getCurrentWindow().hide()' src/App.tsx
          grep -Fq 'DOWNLOAD_ATTEMPTS: usize = 3' src-tauri/src/core/updater.rs
          grep -Fq 'DOWNLOAD_STALL_TIMEOUT' src-tauri/src/core/updater.rs
          grep -Fq 'env!("CARGO_PKG_VERSION")' src-tauri/src/core/updater.rs
          grep -Fq 'unified_surface::supervise(app, ready_file)' src-tauri/src/lib.rs
          grep -Fq 'child.wait()' src-tauri/src/runtime/minecraft_launch.rs
      - name: Build Tauri package
        run: npm run tauri build -- --bundles ${{ matrix.bundle }}
      - name: Normalize Linux packages
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist-package
          appimage=$(find src-tauri/target/release/bundle/appimage -maxdepth 1 -type f -name '*.AppImage' | head -n1)
          deb=$(find src-tauri/target/release/bundle/deb -maxdepth 1 -type f -name '*.deb' | head -n1)
          rpm_pkg=$(find src-tauri/target/release/bundle/rpm -maxdepth 1 -type f -name '*.rpm' | head -n1)
          test -n "$appimage" && test -n "$deb" && test -n "$rpm_pkg"
          test "$(stat -c%s "$appimage")" -gt 1048576
          test "$(stat -c%s "$deb")" -gt 1048576
          test "$(stat -c%s "$rpm_pkg")" -gt 1048576
          cp "$appimage" dist-package/GunGloryOnline-Launcher-Linux.AppImage
          cp "$deb" dist-package/GunGloryOnline-Launcher-Ubuntu-Debian.deb
          cp "$rpm_pkg" dist-package/GunGloryOnline-Launcher-Fedora-RHEL.rpm
          sha256sum dist-package/*
      - name: Normalize Windows packages
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force dist-package | Out-Null
          $installer = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          if (-not $installer) { throw 'NSIS package not found' }
          $msi = Get-ChildItem src-tauri/target/release/bundle/msi/*.msi | Select-Object -First 1
          if (-not $msi) { throw 'MSI package not found' }
          $portable = Get-ChildItem src-tauri/target/release/*.exe | Where-Object { $_.Name -notmatch 'build|setup|installer' } | Sort-Object Length -Descending | Select-Object -First 1
          if (-not $portable) { throw 'Portable launcher executable not found' }
          if ($installer.Length -lt 1MB) { throw 'NSIS package is unexpectedly small' }
          if ($msi.Length -lt 1MB) { throw 'MSI package is unexpectedly small' }
          if ($portable.Length -lt 1MB) { throw 'Portable launcher is unexpectedly small' }
          Copy-Item $installer.FullName dist-package/GunGloryOnline-Launcher-Windows.exe
          Copy-Item $msi.FullName dist-package/GunGloryOnline-Launcher-Windows.msi
          Copy-Item $portable.FullName dist-package/GunGloryOnline-Launcher-Portable.exe
          Compress-Archive -Path dist-package/GunGloryOnline-Launcher-Portable.exe -DestinationPath dist-package/GunGloryOnline-Launcher-Windows-Portable.zip -Force
          Remove-Item dist-package/GunGloryOnline-Launcher-Portable.exe
          Get-FileHash dist-package/* -Algorithm SHA256 | Format-Table -AutoSize
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: launcher/dist-package/*
          if-no-files-found: error
          retention-days: 30

  auth:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: launcher/bootstrap-v0.1
      - name: Python syntax gate
        run: python3 -m py_compile services/ggo-auth/server.py services/ggo-auth/test_auth.py
      - name: GGO account and support API smoke
        run: python3 services/ggo-auth/test_auth.py -v
      - name: Validate auth, roles and ticket contract
        run: |
          set -euo pipefail
          grep -q 'GAME_TICKET_TTL = 3 \* 60' services/ggo-auth/server.py
          grep -q 'assertGreaterEqual(ticket\["expires_in"\], 175)' services/ggo-auth/test_auth.py
          grep -q 'ALLOWED_ROLES = {"user", "support", "admin"}' services/ggo-auth/server.py
          grep -q 'GGO_OWNER_USERNAMES' services/ggo-auth/server.py
          grep -q 'support_tickets' services/ggo-auth/server.py
          grep -q 'owner_role_locked' services/ggo-auth/server.py
          grep -q 'Тех. Поддержка' services/ggo-auth/server.py
          grep -q 'Администратор' services/ggo-auth/server.py
          test -f services/ggo-auth/ggo-auth.service
          test -f services/ggo-auth/install.sh
          grep -q '127.0.0.1' services/ggo-auth/ggo-auth.service
          grep -q '/var/lib/ggo-auth/auth.db' services/ggo-auth/ggo-auth.service
          grep -q 'systemctl restart ggo-auth.service' services/ggo-auth/install.sh
          grep -q 'GGO auth health: PASS' services/ggo-auth/install.sh

  website:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: launcher/bootstrap-v0.1
      - name: Validate production deploy scripts
        run: |
          set -euo pipefail
          bash -n site/install-site.sh
          bash -n site/verify-production.sh
          grep -q 'auth.db' site/install-site.sh
          grep -q 'runtime-files' site/install-site.sh
          grep -q 'support admin content' site/install-site.sh
          grep -q 'НАПИСАТЬ В ПОДДЕРЖКУ' site/install-site.sh
          grep -q 'support API auth wall' site/install-site.sh
          grep -q 'Disabling duplicate nginx vhost' site/install-site.sh
          grep -q '/api/v1/auth/register' site/install-site.sh
          grep -q '/api/v1/auth/login' site/install-site.sh
          grep -q '24842' site/verify-production.sh
      - name: Validate unified GGO Account flow
        run: |
          set -euo pipefail
          grep -q 'SIGN IN / CREATE ACCOUNT' launcher/src/AccountHub.tsx
          grep -q 'OFFLINE TRAINING FALLBACK' launcher/src/AccountHub.tsx
          grep -q 'returnAfterAuth' site/account/account.js
          grep -q 'staffAccountLink' site/account/account.js
          grep -q 'role-badge' site/account/account.js
          grep -q "approve.*===.*'1'" site/account/device.html
          grep -q 'auth/device/approve' site/account/device.html
          ! grep -q 'прямого входа в GGO Launcher' site/account/index.html
      - name: Validate support and staff console
        run: |
          set -euo pipefail
          test -f site/support/index.html
          test -f site/support/support.js
          test -f site/admin/index.html
          test -f site/admin/admin.js
          grep -q 'НАПИСАТЬ В ПОДДЕРЖКУ' site/support/index.html
          grep -q '/api/v1/support/tickets' site/support/support.js
          grep -q 'ПАНЕЛЬ СОТРУДНИКА' site/support/index.html
          grep -q 'STAFF CONSOLE' site/admin/index.html
          grep -q '/api/v1/staff/tickets' site/admin/admin.js
          grep -q '/api/v1/admin/users' site/admin/admin.js
          grep -q 'role-badge.admin' site/portal.css
          grep -q 'role-badge.support' site/portal.css
      - name: Validate menu-first release transform
        run: |
          set -euo pipefail
          python3 launcher/hotfix/apply_menu_first_beta_stage76.py
          python3 launcher/hotfix/apply_stage111_resilient_install.py
          grep -q '?t.install:updateAvailable?t.updateGame:t.play' launcher/src/App.tsx
          ! grep -q 'onClick={()=>void launch(true)}' launcher/src/App.tsx
          ! grep -q 'className="repair-link"' launcher/src/App.tsx
          grep -q 'options.connect_server = false;' launcher/src-tauri/src/lib.rs
          test "$(grep -o 'setClientRunning(true);' launcher/src/App.tsx | wc -l)" -eq 1
          ! grep -Fq 'getCurrentWindow().hide()' launcher/src/App.tsx
      - name: Validate portal and production manifest
        run: |
          set -euo pipefail
          test -f site/index.html
          test -f site/styles.css
          test -f site/portal.css
          test -f site/account/index.html
          test -f site/account/account.js
          test -f site/account/device.html
          test -f site/regions/index.html
          test -f site/legal/terms.html
          test -f site/legal/privacy.html
          test -f site/legal/rules.html
          test -f site/support/index.html
          test -f site/nginx/ggo.conf
          test -f site/DEPLOY-VDS.md
          test -f site/verify-production.sh
          python3 -m json.tool site/content/api/servers.json >/dev/null
          python3 -m json.tool site/content/api/news.json >/dev/null
          python3 -m json.tool site/content/api/game-modes.json >/dev/null
          python3 -m json.tool site/content/api/graphics.json >/dev/null
          python3 -m json.tool site/content/manifests/beta.json >/dev/null
          grep -q 'play.kvicloud.ru:24842' site/content/api/servers.json
          grep -q '"defaultProfile": "balanced"' site/content/api/graphics.json
          grep -q 'battle-royale' site/content/api/game-modes.json
          grep -q 'GunGloryOnline-Launcher-Windows.exe' site/index.html
          grep -q 'GunGloryOnline-Launcher-Windows.msi' site/index.html
          grep -q 'GunGloryOnline-Launcher-Windows-Portable.zip' site/index.html
          grep -q 'GunGloryOnline-Launcher-Linux.AppImage' site/index.html
          grep -q 'GunGloryOnline-Launcher-Ubuntu-Debian.deb' site/index.html
          grep -q 'GunGloryOnline-Launcher-Fedora-RHEL.rpm' site/index.html
          grep -q 'GunGloryOnline-ClientPack-1.20.1-Forge47.4.10.zip' site/index.html
          grep -q 'gungloryonline-core-runtime-v1-stage68.jar' site/content/manifests/beta.json
          grep -q 'gungloryonline-ui-runtime-v1-stage69.jar' site/content/manifests/beta.json
          grep -q 'resourcepacks/GunGloryOnline-Official.zip' site/content/manifests/beta.json
          ! grep -q 'GunGloryOnline-ResourcePack-1.20.1-v5-swittie-social.zip' site/content/manifests/beta.json
          grep -qi 'Resource Pack' site/index.html
          grep -q 'ggo.kvicloud.ru' site/index.html
          grep -q 'SHA1' site/index.html
          grep -q 'proxy_pass http://127.0.0.1:8787' site/nginx/ggo.conf
          grep -q 'listen 443 ssl' site/nginx/ggo.conf
      - uses: actions/upload-artifact@v4
        with:
          name: GunGloryOnline-Website
          path: |
            site/**
            services/ggo-auth/**
          if-no-files-found: error
          retention-days: 30

  report:
    if: always()
    needs: [build, auth, website]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: launcher/bootstrap-v0.1
      - name: Publish immutable launcher run status
        shell: bash
        run: |
          set -euo pipefail
          result=success
          for value in '${{ needs.build.result }}' '${{ needs.auth.result }}' '${{ needs.website.result }}'; do
            [ "$value" = success ] || result=failure
          done
          mkdir -p .ci/launcher
          receipt=".ci/launcher/${GITHUB_RUN_ID}.txt"
          cat > "$receipt" <<EOF
          workflow=${GITHUB_WORKFLOW}
          run_id=${GITHUB_RUN_ID}
          run_attempt=${GITHUB_RUN_ATTEMPT}
          run_url=https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          head_sha=${GITHUB_SHA}
          build_status=${{ needs.build.result }}
          auth_status=${{ needs.auth.result }}
          website_status=${{ needs.website.result }}
          menu_first_packaging=true
          stage111_unified_lifecycle=true
          windows_artifact=GunGloryOnline-Launcher-Windows
          windows_installers=GunGloryOnline-Launcher-Windows.exe,GunGloryOnline-Launcher-Windows.msi,GunGloryOnline-Launcher-Windows-Portable.zip
          linux_artifact=GunGloryOnline-Launcher-Linux
          linux_installers=GunGloryOnline-Launcher-Linux.AppImage,GunGloryOnline-Launcher-Ubuntu-Debian.deb,GunGloryOnline-Launcher-Fedora-RHEL.rpm
          website_artifact=GunGloryOnline-Website
          result=$result
          EOF
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$receipt"
          git commit -m "ci: publish launcher run ${GITHUB_RUN_ID}" || exit 0
          git fetch origin launcher/bootstrap-v0.1
          git rebase origin/launcher/bootstrap-v0.1
          git push origin HEAD:launcher/bootstrap-v0.1
