name: GunGloryOnline Launcher Packages

on:
  push:
    branches: ["launcher/bootstrap-v0.1"]
    paths:
      - "launcher/**"
      - ".github/workflows/ggo-launcher-packages.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            bundle: appimage
            artifact: GunGloryOnline-Launcher-Linux
          - os: windows-2022
            bundle: nsis
            artifact: GunGloryOnline-Launcher-Windows
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: launcher
    env:
      GGO_CONTENT_BASE_URL: https://ggo.kvicloud.ru/content
      GGO_SITE_URL: https://ggo.kvicloud.ru
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2
        working-directory: .
      - name: Install frontend dependencies
        run: npm install
      - name: Frontend type/build gate
        run: npm run build
      - name: Build Tauri package
        run: npm run tauri build -- --bundles ${{ matrix.bundle }}
      - name: Normalize Linux package name
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist-package
          src=$(find src-tauri/target/release/bundle/appimage -maxdepth 1 -type f -name '*.AppImage' | head -n1)
          test -n "$src"
          cp "$src" dist-package/GunGloryOnline-Launcher-Linux.AppImage
      - name: Normalize Windows package name
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist-package | Out-Null
          $src = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          if (-not $src) { throw 'NSIS package not found' }
          Copy-Item $src.FullName dist-package/GunGloryOnline-Launcher-Windows.exe
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: launcher/dist-package/*
          if-no-files-found: error
          retention-days: 30

  website:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate static site
        run: |
          set -euo pipefail
          test -f site/index.html
          test -f site/styles.css
          python3 -m json.tool site/content/api/servers.json >/dev/null
          python3 -m json.tool site/content/api/news.json >/dev/null
          grep -q '2.26.100.125:24842' site/content/api/servers.json
          grep -q 'GunGloryOnline-Launcher-Windows.exe' site/index.html
          grep -q 'GunGloryOnline-Launcher-Linux.AppImage' site/index.html
      - uses: actions/upload-artifact@v4
        with:
          name: GunGloryOnline-Website
          path: site/**
          if-no-files-found: error
          retention-days: 30
