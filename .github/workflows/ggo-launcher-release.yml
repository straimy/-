name: GunGloryOnline Launcher Signed Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (for example 0.2.2)
        required: true
        type: string

jobs:
  signed-bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundle: nsis,msi
            artifact: GunGloryOnline-Windows-Signed
            bundle_path: |
              launcher/src-tauri/target/release/bundle/nsis/*
              launcher/src-tauri/target/release/bundle/msi/*
          - os: ubuntu-22.04
            bundle: appimage
            artifact: GunGloryOnline-Linux-Signed
            bundle_path: launcher/src-tauri/target/release/bundle/appimage/*
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      GGO_CONTENT_BASE_URL: ${{ vars.GGO_CONTENT_BASE_URL }}
      GGO_UPDATER_PUBKEY: ${{ vars.GGO_UPDATER_PUBKEY }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    defaults:
      run:
        working-directory: launcher
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require production configuration
        shell: bash
        run: |
          test -n "$GGO_CONTENT_BASE_URL" || { echo "GGO_CONTENT_BASE_URL repository variable is missing"; exit 1; }
          test -n "$GGO_UPDATER_PUBKEY" || { echo "GGO_UPDATER_PUBKEY repository variable is missing"; exit 1; }
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo "TAURI_SIGNING_PRIVATE_KEY secret is missing"; exit 1; }

      - name: Install Linux prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install frontend dependencies
        run: npm install

      - name: Prepare signed updater build
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          version = "${{ inputs.version }}"
          cargo = Path("src-tauri/Cargo.toml")
          text = cargo.read_text(encoding="utf-8")
          import re
          text, count = re.subn(r'(?m)^version = "[^"]+"$', f'version = "{version}"', text, count=1)
          if count != 1:
              raise SystemExit("could not update Cargo version")
          cargo.write_text(text, encoding="utf-8")
          config_path = Path("src-tauri/tauri.conf.json")
          config = json.loads(config_path.read_text(encoding="utf-8"))
          config["version"] = version
          config.setdefault("bundle", {})["createUpdaterArtifacts"] = True
          config_path.write_text(json.dumps(config, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Generate Windows icon
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pillow
          @'
          from PIL import Image
          image = Image.open(r"src-tauri/icons/icon.png").convert("RGBA")
          image.save(r"src-tauri/icons/icon.ico", format="ICO", sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)])
          '@ | Set-Content -Encoding UTF8 .ggo_make_icon.py
          python .ggo_make_icon.py

      - name: Build signed Tauri bundle
        run: npm run tauri build -- --bundles ${{ matrix.bundle }}

      - name: Upload signed bundle and signatures
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-${{ inputs.version }}
          path: ${{ matrix.bundle_path }}
          if-no-files-found: error
          retention-days: 30
