name: GunGloryOnline Launcher CI

on:
  push:
    branches:
      - main
    paths:
      - 'launcher/**'
      - 'infra/vds/**'
      - '.github/workflows/ggo-launcher-ci.yml'
  pull_request:
    paths:
      - 'launcher/**'
      - 'infra/vds/**'
      - '.github/workflows/ggo-launcher-ci.yml'
  workflow_dispatch:

concurrency:
  group: ggo-launcher-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: launcher
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate VDS publishers
        working-directory: infra/vds
        run: |
          python3 -m py_compile publish_release.py publish_launcher_update.py
          GGO_HOST=updates.example.com docker compose -f docker-compose.yml config >/dev/null

      - name: Install Tauri Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm install

      - name: TypeScript and Vite build
        run: npm run build

      - name: Normalize Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all

      - name: Rust check
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

  package-test:
    needs: validate
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundle: nsis
            artifact: GunGloryOnline-Windows
            path: launcher/src-tauri/target/release/bundle/nsis/*.exe
          - os: ubuntu-22.04
            bundle: appimage
            artifact: GunGloryOnline-Linux
            path: launcher/src-tauri/target/release/bundle/appimage/*.AppImage
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: launcher
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Python for Windows icon
        if: runner.os == 'Windows'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate Windows icon
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pillow
          @'
          from PIL import Image
          image = Image.open(r"src-tauri/icons/icon.png").convert("RGBA")
          image.save(
              r"src-tauri/icons/icon.ico",
              format="ICO",
              sizes=[(16, 16), (24, 24), (32, 32), (48, 48), (64, 64), (128, 128), (256, 256)],
          )
          '@ | Set-Content -Encoding UTF8 .ggo_make_icon.py
          python .ggo_make_icon.py
          if (!(Test-Path "src-tauri/icons/icon.ico")) { throw "icon.ico was not generated" }

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm install

      - name: Build Tauri test bundle
        env:
          GGO_CONTENT_BASE_URL: ${{ vars.GGO_CONTENT_BASE_URL }}
        run: npm run tauri build -- --bundles ${{ matrix.bundle }}

      - name: Upload test bundle
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error
          retention-days: 14
