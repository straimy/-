name: AI Gunner 1.5 rc3 Build

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/ai-gunner-1.5-rc3-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout AI Gunner build branch
        uses: actions/checkout@v4
        with:
          ref: ai-gunner-1.5-build
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Restore and patch through rc3
        shell: bash
        run: |
          set -euxo pipefail
          cat ai-gunner-1.5/dev10-source.part-*.b64 | base64 --decode > /tmp/dev10-source.zip
          rm -rf /tmp/aigunner
          mkdir -p /tmp/aigunner
          unzip -q /tmp/dev10-source.zip -d /tmp/aigunner
          python3 ai-gunner-1.5/dev11-apply.py
          python3 ai-gunner-1.5/dev12-apply.py
          python3 ai-gunner-1.5/dev13-apply.py
          python3 ai-gunner-1.5/rc1-apply.py
          python3 ai-gunner-1.5/rc2-apply.py
          python3 ai-gunner-1.5/rc3-apply.py
          grep -q 'item_spawner' /tmp/aigunner/ai-gunner-dev10/src/main/java/ai/gunner/brain/CombatBrain.java
          grep -q 'ArenaNetwork$BuyRequest' /tmp/aigunner/ai-gunner-dev10/src/main/java/ai/gunner/integration/GunnerArenaAdapter.java
      - name: Build rc3
        shell: bash
        run: |
          set -euxo pipefail
          cd /tmp/aigunner/ai-gunner-dev10
          gradle build --no-daemon
          JAR=build/libs/ai-gunner-jeg-forge-1.20.1-1.5.0-rc3.jar
          test -s "$JAR"
          jar tf "$JAR" | grep -q 'META-INF/mods.toml'
          jar tf "$JAR" | grep -q 'ai/gunner/integration/GunnerArenaAdapter.class'
          sha256sum "$JAR" | tee /tmp/rc3.sha256
      - name: Package source
        shell: bash
        run: |
          cd /tmp/aigunner
          zip -qr /tmp/ai-gunner-jeg-forge-1.20.1-1.5.0-rc3-SOURCE.zip ai-gunner-dev10
      - name: Upload rc3 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ai-gunner-1.5-rc3
          path: |
            /tmp/aigunner/ai-gunner-dev10/build/libs/ai-gunner-jeg-forge-1.20.1-1.5.0-rc3.jar
            /tmp/ai-gunner-jeg-forge-1.20.1-1.5.0-rc3-SOURCE.zip
            /tmp/rc3.sha256
