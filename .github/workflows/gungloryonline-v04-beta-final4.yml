name: GunGloryOnline v0.4 Beta FINAL 4

on:
  push:
    paths: ['.github/workflows/gungloryonline-v04-beta-final4.yml']
  workflow_dispatch:

env:
  SOURCE_ZIP: gunner-arena-forge-1.20.1-0.6.0-test52-GREPFIX-SOURCE.zip
  FINAL_RP: GunnerArena-ResourcePack-1.20.1-v1.zip

jobs:
  beta:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}

      - name: Prepare extractor
        shell: bash
        run: |
          cat >/tmp/extract.py <<'PY'
          import sys
          from pathlib import Path
          lines=Path(sys.argv[1]).read_text().splitlines(); wanted=sys.argv[2]
          start=next((i for i,l in enumerate(lines) if l.strip()==f'- name: {wanted}'),None)
          if start is None: raise SystemExit('step not found: '+wanted)
          run=None
          for i in range(start+1,len(lines)):
              if lines[i].startswith('      - name:') or lines[i].startswith('      - uses:'): break
              if lines[i].strip()=='run: |': run=i+1; break
          if run is None: raise SystemExit('run missing: '+wanted)
          out=[]
          for i in range(run,len(lines)):
              l=lines[i]
              if l.startswith('      - name:') or l.startswith('      - uses:'): break
              out.append(l[10:] if l.startswith('          ') else l)
          print('\n'.join(out).rstrip())
          PY
          cat >/tmp/run3 <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          python3 /tmp/extract.py .github/workflows/gungloryonline-v04-beta-final3.yml "$1" >/tmp/step3.sh
          bash /tmp/step3.sh
          SH
          chmod +x /tmp/run3

      - name: Prepare base and patches
        shell: bash
        run: |
          set -euo pipefail
          /tmp/run3 'Prepare base and patches'
          cp hotfix/ui/ArenaNavigation.java ga-build/client-ui/src/main/java/arena/client/ui/ArenaNavigation.java
          python3 - <<'PY'
          from pathlib import Path
          p=Path('ga-build/client-ui/src/main/java/arena/client/ui/AbstractArenaScreen.java')
          s=p.read_text()
          if 'addArenaWidget(' not in s:
              i=s.rfind('}')
              if i<0: raise SystemExit('AbstractArenaScreen closing brace missing')
              s=s[:i]+'\n    final void addArenaWidget(ArenaButton button){ addRenderableWidget(button); }\n'+s[i:]
              p.write_text(s)
          PY
          grep -q 'addArenaWidget' ga-build/client-ui/src/main/java/arena/client/ui/AbstractArenaScreen.java
          grep -q 's.addArenaWidget' ga-build/client-ui/src/main/java/arena/client/ui/ArenaNavigation.java

      - name: JEG native 9 weapon audit
        shell: bash
        run: /tmp/run3 'JEG native 9 weapon audit'

      - name: Build Core
        shell: bash
        run: /tmp/run3 'Build Core'

      - name: Build UI
        shell: bash
        run: /tmp/run3 'Build UI'

      - name: Prepare payload
        shell: bash
        run: /tmp/run3 'Prepare payload'

      - name: Dedicated server smoke
        shell: bash
        run: /tmp/run3 'Dedicated server smoke'

      - name: Real Forge client smoke
        shell: bash
        run: /tmp/run3 'Real Forge client smoke'

      - name: Final audit
        shell: bash
        run: |
          /tmp/run3 'Final audit'
          U=final-artifacts/client/mods/gungloryonline-ui-0.4.0-beta.jar
          unzip -p "$U" arena/client/ui/ArenaNavigation.class | strings | grep -q addArenaWidget
          cat >> final-artifacts/VERIFICATION.txt <<'EOF'
          UI_NAVIGATION_ACCESS_FIX=PASS
          EOF
          sha256sum final-artifacts/server/mods/* final-artifacts/client/mods/* final-artifacts/client/resourcepacks/* > final-artifacts/SHA256SUMS.txt

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: GunGloryOnline-v0.4-Beta-FINAL
          path: final-artifacts/**
          if-no-files-found: error
          retention-days: 30

      - name: Diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: GunGloryOnline-v0.4-Beta-FINAL4-diagnostics
          path: |
            v12-core-build.log
            v12-ui-build.log
            dedicated-server-console.log
            ds/logs/**
            cs/run/logs/**
            cs/run/crash-reports/**
          if-no-files-found: ignore
          retention-days: 7
