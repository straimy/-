name: GGO Launcher Linux Verify

on:
  workflow_dispatch:
  push:
    branches:
      - launcher/bootstrap-v0.1
    paths:
      - 'launcher/**'
      - '.github/workflows/ggo-launcher-linux-verify.yml'

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: launcher
    env:
      GGO_CONTENT_BASE_URL: https://ggo.kvicloud.ru/content
      GGO_SITE_URL: https://ggo.kvicloud.ru
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable

      - name: Apply Stage111 resilient install patch
        id: stage111
        run: python3 hotfix/apply_stage111_resilient_install.py

      - name: Install Tauri Linux dependencies
        id: deps
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2 rpm

      - name: Install frontend dependencies
        id: install
        run: npm install

      - name: Generate Linux icons
        id: icons
        run: npm run tauri icon src-tauri/icons/icon.png

      - name: Frontend type and build gate
        id: frontend
        run: npm run build

      - name: Rust format gate
        id: rust_fmt
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Rust compile gate
        id: rust_check
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Linux runtime unit tests
        id: runtime_tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build AppImage DEB and RPM packages
        id: package
        run: npm run tauri build -- --bundles appimage,deb,rpm

      - name: Verify Linux packages
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          appimage=$(find src-tauri/target/release/bundle/appimage -maxdepth 1 -type f -name '*.AppImage' | head -n1)
          deb=$(find src-tauri/target/release/bundle/deb -maxdepth 1 -type f -name '*.deb' | head -n1)
          rpm_pkg=$(find src-tauri/target/release/bundle/rpm -maxdepth 1 -type f -name '*.rpm' | head -n1)
          test -n "$appimage" && test -n "$deb" && test -n "$rpm_pkg"
          test "$(stat -c%s "$appimage")" -gt 1048576
          test "$(stat -c%s "$deb")" -gt 1048576
          test "$(stat -c%s "$rpm_pkg")" -gt 1048576
          mkdir -p dist-package
          cp "$appimage" dist-package/GunGloryOnline-Launcher-Linux.AppImage
          cp "$deb" dist-package/GunGloryOnline-Launcher-Ubuntu-Debian.deb
          cp "$rpm_pkg" dist-package/GunGloryOnline-Launcher-Fedora-RHEL.rpm
          sha256sum dist-package/*

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: GunGloryOnline-Launcher-Linux-Verified
          path: launcher/dist-package/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish immutable Linux receipt
        if: always()
        env:
          STAGE111_OUTCOME: ${{ steps.stage111.outcome }}
          DEPS_OUTCOME: ${{ steps.deps.outcome }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          ICONS_OUTCOME: ${{ steps.icons.outcome }}
          FRONTEND_OUTCOME: ${{ steps.frontend.outcome }}
          RUST_FMT_OUTCOME: ${{ steps.rust_fmt.outcome }}
          RUST_CHECK_OUTCOME: ${{ steps.rust_check.outcome }}
          RUNTIME_TESTS_OUTCOME: ${{ steps.runtime_tests.outcome }}
          PACKAGE_OUTCOME: ${{ steps.package.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        run: |
          set -euo pipefail
          result=success
          for value in "$STAGE111_OUTCOME" "$DEPS_OUTCOME" "$INSTALL_OUTCOME" "$ICONS_OUTCOME" "$FRONTEND_OUTCOME" "$RUST_FMT_OUTCOME" "$RUST_CHECK_OUTCOME" "$RUNTIME_TESTS_OUTCOME" "$PACKAGE_OUTCOME" "$VERIFY_OUTCOME"; do
            if [ "$value" != success ]; then result=failure; fi
          done
          cd ..
          # Build-only Stage111 canonicalization and generated Tauri/icon/npm files are intentionally
          # discarded before publishing the immutable receipt.
          git restore --staged --worktree .
          mkdir -p .ci/linux
          receipt=".ci/linux/${GITHUB_RUN_ID}.txt"
          cat > "$receipt" <<EOF
          workflow=${{ github.workflow }}
          run_id=${GITHUB_RUN_ID}
          run_attempt=${GITHUB_RUN_ATTEMPT}
          run_url=https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          source_sha=${GITHUB_SHA}
          stage111_patch=$STAGE111_OUTCOME
          deps=$DEPS_OUTCOME
          install=$INSTALL_OUTCOME
          icons=$ICONS_OUTCOME
          frontend=$FRONTEND_OUTCOME
          rust_fmt=$RUST_FMT_OUTCOME
          rust_check=$RUST_CHECK_OUTCOME
          runtime_tests=$RUNTIME_TESTS_OUTCOME
          package=$PACKAGE_OUTCOME
          verify=$VERIFY_OUTCOME
          installers=GunGloryOnline-Launcher-Linux.AppImage,GunGloryOnline-Launcher-Ubuntu-Debian.deb,GunGloryOnline-Launcher-Fedora-RHEL.rpm
          result=$result
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$receipt"
          git commit -m "ci: record Linux launcher run ${GITHUB_RUN_ID}" || exit 0
          git fetch origin "${GITHUB_REF_NAME}"
          git rebase "origin/${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
