name: GGO Contracts BR Map Stage 24 Compile

on:
  workflow_dispatch:
  push:
    paths:
      - 'hotfix/GgoContractService.java'
      - 'hotfix/GgoContractNetwork.java'
      - 'hotfix/GgoObjectiveService.java'
      - 'hotfix/GgoHudNetwork.java'
      - 'hotfix/GgoHudStateService.java'
      - 'hotfix/BattleRoyaleService.java'
      - 'hotfix/apply_ggo_br_map_stage24.py'
      - '.github/workflows/ggo-contracts-brmap-stage24-compile.yml'

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SOURCE_ZIP: gunner-arena-forge-1.20.1-0.6.0-test52-GREPFIX-SOURCE.zip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Unpack Runtime v1 source
        run: |
          set -euo pipefail
          rm -rf ga-build && mkdir ga-build
          unzip -q "$SOURCE_ZIP" -d ga-build
      - name: Install current GGO server sources
        run: |
          set -euo pipefail
          root=ga-build/src/main/java/arena/forge
          mkdir -p "$root"
          cp hotfix/BattleRoyaleService.java "$root/BattleRoyaleService.java"
          cp hotfix/GgoObjectiveService.java "$root/GgoObjectiveService.java"
          cp hotfix/GgoHudNetwork.java "$root/GgoHudNetwork.java"
          cp hotfix/GgoHudStateService.java "$root/GgoHudStateService.java"
          cp hotfix/GgoContractService.java "$root/GgoContractService.java"
          cp hotfix/GgoContractNetwork.java "$root/GgoContractNetwork.java"
          python3 hotfix/apply_ggo_br_map_stage24.py
          grep -q 'VERSION="3"' "$root/GgoHudNetwork.java"
          grep -q 'centerX()' "$root/BattleRoyaleService.java"
          grep -q 'zoneRadius' "$root/GgoHudNetwork.java"
      - name: Bootstrap ForgeGradle wrapper
        run: |
          set -euo pipefail
          if [ ! -x ga-build/gradlew ] || [ ! -f ga-build/gradle/wrapper/gradle-wrapper.jar ]; then
            rm -rf /tmp/forge-mdk /tmp/forge-mdk.zip
            curl -fL --retry 3 -o /tmp/forge-mdk.zip https://maven.minecraftforge.net/net/minecraftforge/forge/1.20.1-47.4.10/forge-1.20.1-47.4.10-mdk.zip
            mkdir -p /tmp/forge-mdk
            unzip -q /tmp/forge-mdk.zip 'gradlew' 'gradlew.bat' 'gradle/*' -d /tmp/forge-mdk
            cp /tmp/forge-mdk/gradlew ga-build/gradlew
            cp /tmp/forge-mdk/gradlew.bat ga-build/gradlew.bat
            rm -rf ga-build/gradle && cp -a /tmp/forge-mdk/gradle ga-build/gradle
            chmod +x ga-build/gradlew
          fi
      - name: Compile Forge Core
        working-directory: ga-build
        run: ./gradlew --no-daemon compileJava --stacktrace
      - name: Verify Stage 24 classes
        run: |
          set -euo pipefail
          root=ga-build/build/classes/java/main/arena/forge
          test -f "$root/GgoContractService.class"
          test -f "$root/GgoContractNetwork.class"
          test -f "$root/GgoHudNetwork.class"
          test -f "$root/GgoHudStateService.class"
