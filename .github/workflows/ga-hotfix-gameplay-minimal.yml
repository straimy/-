name: GA HOTFIX minimal gameplay
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/ga-hotfix-gameplay-minimal.yml'
      - 'hotfix/MinimalGameplayFixes.java'

env:
  SOURCE_ZIP: gunner-arena-forge-1.20.1-0.6.0-test52-GREPFIX-SOURCE.zip

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Reuse verified auth hotfix preparation
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/extract_step.py <<'PY'
          import sys
          from pathlib import Path
          wanted=sys.argv[1]
          lines=Path('.github/workflows/ga-hotfix-auth-menu-npc.yml').read_text().splitlines()
          start=next((i for i,l in enumerate(lines) if l.strip()==f'- name: {wanted}'),None)
          if start is None: raise SystemExit('step not found: '+wanted)
          run=None
          for i in range(start+1,len(lines)):
              if lines[i].startswith('      - name:'): break
              if lines[i].strip()=='run: |': run=i+1; break
          if run is None: raise SystemExit('run block missing')
          out=[]
          for i in range(run,len(lines)):
              l=lines[i]
              if l.startswith('      - name:'): break
              out.append(l[10:] if l.startswith('          ') else l)
          print('\n'.join(out).rstrip())
          PY
          python3 /tmp/extract_step.py 'Prepare patched source' >/tmp/auth-base.sh
          bash /tmp/auth-base.sh

      - name: Apply test54 gameplay patch
        working-directory: ga-build
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('gradle.properties')
          p.write_text(p.read_text().replace('mod_version=0.6.0-test53-authfix','mod_version=0.6.0-test54-gameplayfix'))

          p=Path('src/main/java/arena/forge/ArenaRuntime.java')
          s=p.read_text()
          s=s.replace('event.getTarget().getTags().contains("gunnerarena_menu_npc")', '(event.getTarget().getTags().contains("gunnerarena_menu_npc") || event.getTarget().getTags().contains("gunner_arena_npc_hitbox"))')
          p.write_text(s)

          p=Path('src/main/java/arena/forge/GunnerCommands.java')
          s=p.read_text().replace('src.hasPermission(2)', 'isArenaAdmin(src)').replace('source.hasPermission(2)', 'isArenaAdmin(source)')
          anchor='    private static ServerPlayer requirePlayer(CommandSourceStack source) {'
          helper='''    private static boolean isArenaAdmin(CommandSourceStack source) {\n        if (source.hasPermission(2)) return true;\n        try {\n            ServerPlayer player = source.getPlayer();\n            if (player == null) return false;\n            String name = player.getGameProfile().getName();\n            return "kvi_nella".equalsIgnoreCase(name) || "Twinida".equalsIgnoreCase(name);\n        } catch (Exception ignored) { return false; }\n    }\n\n'''
          if anchor in s and 'private static boolean isArenaAdmin' not in s:
              s=s.replace(anchor, helper+anchor, 1)
          p.write_text(s)
          PY
          cp ../hotfix/MinimalGameplayFixes.java src/main/java/arena/forge/MinimalGameplayFixes.java
          grep -q 'gunner_arena_npc_hitbox' src/main/java/arena/forge/ArenaRuntime.java
          grep -q 'class MinimalGameplayFixes' src/main/java/arena/forge/MinimalGameplayFixes.java

      - name: Build Core test54
        working-directory: ga-build
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/forge-mdk /tmp/forge-mdk.zip
          curl -fL --retry 3 -o /tmp/forge-mdk.zip https://maven.minecraftforge.net/net/minecraftforge/forge/1.20.1-47.4.10/forge-1.20.1-47.4.10-mdk.zip
          mkdir -p /tmp/forge-mdk
          unzip -q /tmp/forge-mdk.zip 'gradlew' 'gradlew.bat' 'gradle/*' -d /tmp/forge-mdk
          cp /tmp/forge-mdk/gradlew .
          cp /tmp/forge-mdk/gradlew.bat .
          cp -a /tmp/forge-mdk/gradle .
          chmod +x gradlew
          ./gradlew --no-daemon clean build --stacktrace 2>&1 | tee ../test54-build.log
          JAR="$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*sources*' ! -name '*dev*' | head -n1)"
          test -n "$JAR"
          jar tf "$JAR" | grep -q '^arena/forge/MinimalGameplayFixes.class$'
          mkdir -p ../hotfix54-out
          cp "$JAR" ../hotfix54-out/gunnerarena-0.6.0-test54-gameplayfix.jar
          sha256sum ../hotfix54-out/gunnerarena-0.6.0-test54-gameplayfix.jar > ../hotfix54-out/SHA256SUMS.txt

      - name: Upload test54 Core
        uses: actions/upload-artifact@v4
        with:
          name: GunnerArena-Core-test54-gameplayfix
          path: hotfix54-out/*
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: GunnerArena-test54-build-failure
          path: test54-build.log
          if-no-files-found: ignore
          retention-days: 7
