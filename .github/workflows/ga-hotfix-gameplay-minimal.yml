name: GA HOTFIX minimal gameplay
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/ga-hotfix-gameplay-minimal.yml'

env:
  SOURCE_ZIP: gunner-arena-forge-1.20.1-0.6.0-test52-GREPFIX-SOURCE.zip

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Reuse verified auth hotfix preparation
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/extract_step.py <<'PY'
          import sys
          from pathlib import Path
          workflow=Path('.github/workflows/ga-hotfix-auth-menu-npc.yml')
          wanted=sys.argv[1]
          lines=workflow.read_text().splitlines()
          start=next((i for i,l in enumerate(lines) if l.strip()==f'- name: {wanted}'),None)
          if start is None: raise SystemExit('step not found: '+wanted)
          run=None
          for i in range(start+1,len(lines)):
              if lines[i].startswith('      - name:'): break
              if lines[i].strip()=='run: |': run=i+1; break
          if run is None: raise SystemExit('run block missing')
          out=[]
          for i in range(run,len(lines)):
              l=lines[i]
              if l.startswith('      - name:'): break
              out.append(l[10:] if l.startswith('          ') else l)
          print('\n'.join(out).rstrip())
          PY
          python3 /tmp/extract_step.py 'Prepare patched source' >/tmp/auth-base.sh
          bash /tmp/auth-base.sh

      - name: Apply minimal gameplay fixes
        working-directory: ga-build
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          # New build identity.
          p=Path('gradle.properties')
          s=p.read_text().replace('mod_version=0.6.0-test53-authfix','mod_version=0.6.0-test54-gameplayfix')
          p.write_text(s)

          # Existing NPCs from the original map use gunner_arena_npc_hitbox.
          p=Path('src/main/java/arena/forge/ArenaRuntime.java')
          s=p.read_text()
          s=s.replace('event.getTarget().getTags().contains("gunnerarena_menu_npc")',
                      '(event.getTarget().getTags().contains("gunnerarena_menu_npc") || event.getTarget().getTags().contains("gunner_arena_npc_hitbox"))')
          p.write_text(s)

          # Let the event admins use GA setup commands even when the offline-mode auth mod
          # does not make them vanilla operators.
          p=Path('src/main/java/arena/forge/GunnerCommands.java')
          s=p.read_text()
          s=s.replace('src.hasPermission(2)', 'isArenaAdmin(src)')
          s=s.replace('source.hasPermission(2)', 'isArenaAdmin(source)')
          anchor='    private static ServerPlayer requirePlayer(CommandSourceStack source) {'
          helper='''    private static boolean isArenaAdmin(CommandSourceStack source) {\n        if (source.hasPermission(2)) return true;\n        try {\n            ServerPlayer player = source.getPlayer();\n            if (player == null) return false;\n            String name = player.getGameProfile().getName();\n            return "kvi_nella".equalsIgnoreCase(name) || "Twinida".equalsIgnoreCase(name);\n        } catch (Exception ignored) { return false; }\n    }\n\n'''
          if anchor in s and 'private static boolean isArenaAdmin' not in s:
              s=s.replace(anchor, helper+anchor, 1)
          p.write_text(s)

          # Lightweight event layer: old-map ammo markers, instant join countdown,
          # lobby protection/invisibility and a clear killer message.
          out=Path('src/main/java/arena/forge/MinimalGameplayFixes.java')
          out.write_text(r'''package arena.forge;

import arena.GunnerArenaMod;
import arena.forge.net.ArenaNetwork;
import arena.forge.player.ArenaPlayerState;
import arena.round.RoundState;
import net.minecraft.ChatFormatting;
import net.minecraft.commands.CommandSourceStack;
import net.minecraft.network.chat.Component;
import net.minecraft.server.MinecraftServer;
import net.minecraft.server.level.ServerPlayer;
import net.minecraftforge.event.TickEvent;
import net.minecraftforge.event.entity.living.LivingAttackEvent;
import net.minecraftforge.event.entity.living.LivingDeathEvent;
import net.minecraftforge.event.entity.living.LivingHurtEvent;
import net.minecraftforge.eventbus.api.EventPriority;
import net.minecraftforge.eventbus.api.SubscribeEvent;
import net.minecraftforge.fml.common.Mod;
import net.minecraftforge.server.ServerLifecycleHooks;

import java.util.HashMap;
import java.util.Map;
import java.util.UUID;

@Mod.EventBusSubscriber(modid = "gunnerarena", bus = Mod.EventBusSubscriber.Bus.FORGE)
public final class MinimalGameplayFixes {
    private static final Map<UUID, Long> JOIN_AT = new HashMap<>();
    private static final Map<UUID, Integer> LAST_COUNT = new HashMap<>();
    private static long lastAmmoWave = Long.MIN_VALUE;

    private MinimalGameplayFixes() {}

    @SubscribeEvent(priority = EventPriority.HIGHEST)
    public static void onAttack(LivingAttackEvent event) {
        if (event.getEntity() instanceof ServerPlayer player && lobbyProtected(player)) event.setCanceled(true);
    }

    @SubscribeEvent(priority = EventPriority.HIGHEST)
    public static void onHurt(LivingHurtEvent event) {
        if (event.getEntity() instanceof ServerPlayer player && lobbyProtected(player)) event.setCanceled(true);
    }

    @SubscribeEvent(priority = EventPriority.LOWEST)
    public static void onDeath(LivingDeathEvent event) {
        if (!(event.getEntity() instanceof ServerPlayer victim)) return;
        if (event.getSource().getEntity() instanceof ServerPlayer killer && killer != victim) {
            victim.sendSystemMessage(Component.literal("✖ Тебя убил ")
                .withStyle(ChatFormatting.RED)
                .append(Component.literal(killer.getGameProfile().getName()).withStyle(ChatFormatting.GOLD)));
        } else {
            victim.sendSystemMessage(Component.literal("✖ Ты погиб.").withStyle(ChatFormatting.RED));
        }
    }

    @SubscribeEvent
    public static void onServerTick(TickEvent.ServerTickEvent event) {
        if (event.phase != TickEvent.Phase.END) return;
        MinecraftServer server = ServerLifecycleHooks.getCurrentServer();
        if (server == null || GunnerArenaMod.RUNTIME == null) return;
        ArenaRuntime runtime = GunnerArenaMod.RUNTIME;
        long now = runtime.serverTick();

        for (ServerPlayer player : server.getPlayerList().getPlayers()) {
            if (!runtime.auth().isAuthenticated(player)) {
                JOIN_AT.remove(player.getUUID());
                LAST_COUNT.remove(player.getUUID());
                continue;
            }

            ArenaPlayerState state = runtime.players().session(player).state();
            boolean lobby = state == ArenaPlayerState.LOBBY || state == ArenaPlayerState.QUEUED;
            if (lobby) {
                player.setInvisible(true);
                selectEmptyHotbarSlot(player);
                if (!JOIN_AT.containsKey(player.getUUID()) && runtime.spawns().combatCount() > 0) {
                    JOIN_AT.put(player.getUUID(), now + 60L);
                    LAST_COUNT.remove(player.getUUID());
                }
            } else if (state == ArenaPlayerState.ALIVE || state == ArenaPlayerState.SPAWNING) {
                player.setInvisible(false);
                JOIN_AT.remove(player.getUUID());
                LAST_COUNT.remove(player.getUUID());
            }

            Long at = JOIN_AT.get(player.getUUID());
            if (at == null) continue;
            long left = at - now;
            if (left > 0L) {
                int count = left > 40L ? 3 : left > 20L ? 2 : 1;
                if (!Integer.valueOf(count).equals(LAST_COUNT.put(player.getUUID(), count))) {
                    showTitle(server, player, Integer.toString(count));
                }
                continue;
            }

            JOIN_AT.remove(player.getUUID());
            LAST_COUNT.remove(player.getUUID());
            if (runtime.rounds().state() == RoundState.WAITING) runtime.forceStartRound();
            if (runtime.rounds().state() != RoundState.PLAYING) {
                player.sendSystemMessage(Component.literal("[GA] Карта ещё готовится, вход произойдёт сразу после подготовки.").withStyle(ChatFormatting.YELLOW));
                JOIN_AT.put(player.getUUID(), now + 40L);
                continue;
            }

            runtime.forgeLoadouts().clearCombatSlots(player);
            runtime.players().roundSession(player).resetForNewRound(500);
            boolean spawned = runtime.players().requestPlay(server, player, runtime.rounds().state(), runtime.rounds().roundNumber(), now);
            if (spawned) {
                player.setInvisible(false);
                ArenaNetwork.openUi(player, ArenaNetwork.UiTarget.SHOP);
                player.sendSystemMessage(Component.literal("[GA] Выбери оружие в магазине. Стартовый баланс: 500.").withStyle(ChatFormatting.AQUA));
            }
        }

        // Restore the original map convention: real JEG ammo items at legacy marker entities.
        // A wave is checked every 10 seconds; an item is only spawned when that marker is empty.
        if (now - lastAmmoWave >= 200L) {
            lastAmmoWave = now;
            int cycle = (int)((now / 200L) % 3L);
            spawnLegacyAmmo(server, "gun_1_ammo", "jeg:pistol_ammo", 24);
            spawnLegacyAmmo(server, "gun_2_ammo", "jeg:rifle_ammo", 24);
            spawnLegacyAmmo(server, "gun_3_ammo", "jeg:shotgun_shell", 10);
            String random = cycle == 0 ? "jeg:pistol_ammo" : cycle == 1 ? "jeg:rifle_ammo" : "jeg:shotgun_shell";
            int amount = cycle == 2 ? 10 : 24;
            spawnLegacyAmmo(server, "random_gun_ammo", random, amount);
        }
    }

    private static boolean lobbyProtected(ServerPlayer player) {
        ArenaRuntime runtime = GunnerArenaMod.RUNTIME;
        if (runtime == null || !runtime.auth().isAuthenticated(player)) return true;
        ArenaPlayerState state = runtime.players().session(player).state();
        return state == ArenaPlayerState.LOBBY || state == ArenaPlayerState.QUEUED || runtime.safeRegions().isSafe(player);
    }

    private static void selectEmptyHotbarSlot(ServerPlayer player) {
        for (int i = 8; i >= 0; i--) {
            if (player.getInventory().getItem(i).isEmpty()) {
                player.getInventory().selected = i;
                return;
            }
        }
    }

    private static void showTitle(MinecraftServer server, ServerPlayer player, String number) {
        run(server, "title " + player.getGameProfile().getName() + " times 0 15 0");
        run(server, "title " + player.getGameProfile().getName() + " title {\"text\":\"" + number + "\",\"color\":\"gold\",\"bold\":true}");
    }

    private static void spawnLegacyAmmo(MinecraftServer server, String markerTag, String itemId, int count) {
        String command = "execute as @e[tag=item_spawner,tag=" + markerTag + "] at @s "
            + "unless entity @e[type=minecraft:item,tag=ga_legacy_ammo,distance=..1.5] "
            + "run summon minecraft:item ~ ~0.35 ~ {Item:{id:\"" + itemId + "\",Count:" + count + "b},Tags:[\"ga_legacy_ammo\"],Glowing:1b}";
        run(server, command);
    }

    private static void run(MinecraftServer server, String command) {
        CommandSourceStack source = server.createCommandSourceStack().withPermission(4).withSuppressedOutput();
        server.getCommands().performPrefixedCommand(source, command);
    }
}
''')
          PY

      - name: Build Core test54
        working-directory: ga-build
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/forge-mdk /tmp/forge-mdk.zip
          curl -fL --retry 3 -o /tmp/forge-mdk.zip https://maven.minecraftforge.net/net/minecraftforge/forge/1.20.1-47.4.10/forge-1.20.1-47.4.10-mdk.zip
          mkdir -p /tmp/forge-mdk
          unzip -q /tmp/forge-mdk.zip 'gradlew' 'gradlew.bat' 'gradle/*' -d /tmp/forge-mdk
          cp /tmp/forge-mdk/gradlew .
          cp /tmp/forge-mdk/gradlew.bat .
          cp -a /tmp/forge-mdk/gradle .
          chmod +x gradlew
          ./gradlew --no-daemon clean build --stacktrace 2>&1 | tee ../test54-build.log
          JAR="$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*sources*' ! -name '*dev*' | head -n1)"
          test -n "$JAR"
          jar tf "$JAR" | grep -q '^arena/forge/MinimalGameplayFixes.class$'
          mkdir -p ../hotfix54-out
          cp "$JAR" ../hotfix54-out/gunnerarena-0.6.0-test54-gameplayfix.jar
          sha256sum ../hotfix54-out/gunnerarena-0.6.0-test54-gameplayfix.jar > ../hotfix54-out/SHA256SUMS.txt

      - name: Upload test54 Core
        uses: actions/upload-artifact@v4
        with:
          name: GunnerArena-Core-test54-gameplayfix
          path: hotfix54-out/*
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: GunnerArena-test54-build-failure
          path: test54-build.log
          if-no-files-found: ignore
          retention-days: 7
