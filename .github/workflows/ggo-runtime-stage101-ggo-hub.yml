name: GGO Runtime Stage101 GGO Hub

on:
  workflow_dispatch:
  push:
    branches:
      - client/runtime-migration-v1
    paths:
      - '.github/workflows/ggo-runtime-stage101-ggo-hub.yml'
      - 'hotfix/apply_ggo_hub_stage101.py'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: client/runtime-migration-v1
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Forge wrapper
        run: |
          set -euo pipefail
          rm -rf /tmp/ggo-mdk /tmp/ggo-mdk.zip
          curl -fL --retry 3 -o /tmp/ggo-mdk.zip https://maven.minecraftforge.net/net/minecraftforge/forge/1.20.1-47.4.10/forge-1.20.1-47.4.10-mdk.zip
          mkdir -p /tmp/ggo-mdk
          unzip -q /tmp/ggo-mdk.zip 'gradlew' 'gradlew.bat' 'gradle/*' -d /tmp/ggo-mdk
      - name: Build Stage101 GGO Hub UI
        id: ui
        run: |
          set -euo pipefail
          rm -rf ga-build stage101-hub && mkdir ga-build
          unzip -q gunner-arena-forge-1.20.1-0.6.0-test52-GREPFIX-SOURCE.zip -d ga-build
          for patch in \
            apply_ggo_ui_shell_stage1.py apply_ggo_ui_shell_stage2.py apply_ggo_ui_shell_stage3.py \
            apply_ggo_hud_stage4.py apply_ggo_frontend_stage5.py apply_ggo_settings_stage6.py \
            apply_ggo_identity_minimap_stage7.py apply_ggo_weapon_navigation_stage8.py apply_ggo_ping_stage9.py \
            apply_ggo_navigation_zoom_stage10.py apply_ggo_squad_ping_stage11.py apply_ggo_ping_wheel_stage12.py \
            apply_ggo_tab_squad_stage13.py apply_ggo_objective_squad_stage15.py apply_ggo_runtime_network_stage17.py \
            apply_ggo_jeg_telemetry_stage18.py apply_ggo_squad_map_stage19.py apply_ggo_server_hud_stage20.py \
            apply_ggo_br_hud_stage21.py apply_ggo_contracts_stage23.py apply_ggo_br_map_client_stage24.py \
            apply_ggo_contract_map_stage27_fixed.py apply_ggo_contract_session_stage35.py apply_ggo_contract_reward_ui_stage37.py \
            apply_ggo_client_compile_baseline_stage28.py apply_ggo_deminecraft_client_stage40.py apply_ggo_inventory_stage42.py \
            apply_ggo_input_fence_stage45.py apply_ggo_combat_hud_stage47.py apply_ggo_death_recap_stage48.py \
            apply_ggo_inventory_stage50.py apply_ggo_launch_ticket_stage55.py apply_ggo_entry_ux_stage57.py \
            apply_ggo_launcher_authority_stage58.py apply_ggo_session_verification_stage61.py apply_ggo_ui_packets_stage65.py \
            apply_ggo_surface_fence_stage66.py apply_ggo_chat_shell_stage67.py apply_ggo_brand_leak_cleanup_stage68.py \
            apply_ggo_training_stage77.py apply_ggo_startup_brand_stage98.py apply_ggo_hub_stage101.py; do
            python3 "hotfix/$patch"
          done
          SHELL=ga-build/client-ui/src/main/java/arena/client/shell
          cp hotfix/GgoFrontEndScreen.java "$SHELL/GgoFrontEndScreen.java"
          cp hotfix/GgoTrainingScreen.java "$SHELL/GgoTrainingScreen.java"
          cp hotfix/GgoSettingsScreen.java "$SHELL/GgoSettingsScreen.java"
          cp hotfix/GgoVanillaRuntimeFence.java "$SHELL/GgoVanillaRuntimeFence.java"
          cp /tmp/ggo-mdk/gradlew ga-build/client-ui/gradlew
          cp /tmp/ggo-mdk/gradlew.bat ga-build/client-ui/gradlew.bat
          rm -rf ga-build/client-ui/gradle && cp -a /tmp/ggo-mdk/gradle ga-build/client-ui/gradle
          chmod +x ga-build/client-ui/gradlew
          (cd ga-build/client-ui && ./gradlew --no-daemon clean build --stacktrace)
          UI="$(find ga-build/client-ui/build/libs -type f -name '*.jar' ! -name '*sources*' ! -name '*dev*' | head -n1)"
          test -n "$UI" && test -f "$UI"
          jar tf "$UI" | grep -q '^arena/client/shell/GgoShellScreen.class$'
          jar tf "$UI" | grep -q '^arena/client/shell/GgoShellHooks.class$'
          jar tf "$UI" | grep -q '^arena/client/shell/GgoWindowIconClient.class$'
          jar tf "$UI" | grep -q '^arena/mixin/GgoForgeLoadingOverlayMixin.class$'
          ! jar tf "$UI" | grep -q '^arena/mixin/GgoWindowTitleMixin.class$'
          unzip -p "$UI" arena/client/shell/GgoShellScreen.class | strings | grep -q 'EXIT TO GGO'
          unzip -p "$UI" arena/client/shell/GgoShellScreen.class | strings | grep -q 'CONTRACTS'
          unzip -p "$UI" arena/client/shell/GgoShellScreen.class | strings | grep -q 'GGO HUB'
          unzip -p "$UI" arena/client/shell/GgoShellScreen.class | strings | grep -q 'ENTER GGO / ACTIVITIES'
          ! unzip -p "$UI" arena/client/shell/GgoShellScreen.class | strings | grep -qi 'KVICloud'
          ! unzip -p "$UI" arena/client/shell/GgoShellScreen.class | strings | grep -qi 'GUNNER ARENA'
          mkdir -p stage101-hub
          cp "$UI" stage101-hub/gungloryonline-ui-runtime-v1-stage101-ggo-hub.jar
          sha256sum stage101-hub/gungloryonline-ui-runtime-v1-stage101-ggo-hub.jar > stage101-hub/SHA256SUMS.txt
          echo "sha=$(sha256sum "$UI" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "bytes=$(stat -c%s "$UI")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        id: upload
        with:
          name: GunGloryOnline-Runtime-Stage101-GGO-Hub
          path: stage101-hub/**
          if-no-files-found: error
          retention-days: 30
      - name: Publish receipt
        if: always()
        working-directory: .
        run: |
          set -euo pipefail
          mkdir -p ci-results
          cat > ci-results/stage101-ggo-hub.txt <<EOF
          workflow=${GITHUB_WORKFLOW}
          run_id=${GITHUB_RUN_ID}
          client_sha=${GITHUB_SHA}
          build_id=runtime-stage101
          ui_sha256=${{ steps.ui.outputs.sha }}
          ui_bytes=${{ steps.ui.outputs.bytes }}
          hub_build=${{ steps.ui.outcome }}
          artifact_upload=${{ steps.upload.outcome }}
          result=${{ job.status }}
          EOF
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ci-results/stage101-ggo-hub.txt
          git commit -m "ci: record Stage101 GGO hub ${GITHUB_RUN_ID}" || exit 0
          git fetch origin client/runtime-migration-v1
          git rebase origin/client/runtime-migration-v1
          git push origin HEAD:client/runtime-migration-v1
