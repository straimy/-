name: GGO Stage 73 Auth Hotfix Bundle

on:
  push:
    branches: ["launcher/bootstrap-v0.1"]
    paths:
      - ".github/workflows/ggo-stage73-auth-hotfix-bundle.yml"
      - "site/**"
      - "infra/vds/game-server/run.sh"
      - "launcher/HOTFIX-BUILD-2026-08-22.txt"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  assemble:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Resolve latest successful launcher package run
        id: source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          row="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ggo-launcher-packages.yml --branch launcher/bootstrap-v0.1 --status success --limit 1 --json databaseId,headSha --jq '.[0] | [.databaseId,.headSha] | @tsv')"
          test -n "$row"
          IFS=$'\t' read -r run_id head_sha <<<"$row"
          test -n "$run_id" && test -n "$head_sha"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "Using launcher package run $run_id @ $head_sha"

      - name: Checkout current Stage 73 hotfix source
        uses: actions/checkout@v4
        with:
          ref: launcher/bootstrap-v0.1
          fetch-depth: 0

      - name: Download fresh Windows launcher packages
        uses: actions/download-artifact@v4
        with:
          name: GunGloryOnline-Launcher-Windows
          path: fresh/windows
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.source.outputs.run_id }}

      - name: Download fresh Linux launcher packages
        uses: actions/download-artifact@v4
        with:
          name: GunGloryOnline-Launcher-Linux
          path: fresh/linux
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.source.outputs.run_id }}

      - name: Download exact Stage 70 runtime baseline
        uses: actions/download-artifact@v4
        with:
          name: GunGloryOnline-Closed-Beta-Baseline-2026-08-22
          path: stage70-artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 32567000478

      - name: Assemble corrected Closed Beta bundle
        id: bundle
        run: |
          set -euo pipefail
          BASELINE_ZIP="stage70-artifact/GunGloryOnline-Closed-Beta-Baseline-2026-08-22.zip"
          test -f "$BASELINE_ZIP"
          echo 'f71ec514ae9df25cd85d20f0ebbfde768024ac5bb781cae983811225204b8687  stage70-artifact/GunGloryOnline-Closed-Beta-Baseline-2026-08-22.zip' | sha256sum -c -

          rm -rf stage70 corrected
          mkdir -p stage70 corrected/{launcher/windows,launcher/linux,web,game-server/mods,game-server/infra,receipts}
          unzip -q "$BASELINE_ZIP" -d stage70

          cp fresh/windows/GunGloryOnline-Launcher-Windows.exe corrected/launcher/windows/
          cp fresh/windows/GunGloryOnline-Launcher-Windows.msi corrected/launcher/windows/
          cp fresh/windows/GunGloryOnline-Launcher-Windows-Portable.zip corrected/launcher/windows/
          cp fresh/linux/GunGloryOnline-Launcher-Linux.AppImage corrected/launcher/linux/
          cp fresh/linux/GunGloryOnline-Launcher-Ubuntu-Debian.deb corrected/launcher/linux/
          cp fresh/linux/GunGloryOnline-Launcher-Fedora-RHEL.rpm corrected/launcher/linux/

          cp -a site corrected/web/site
          mkdir -p corrected/web/services corrected/web/site/content/files/v40
          cp -a services/ggo-auth corrected/web/services/ggo-auth

          cp stage70/final/runtime/server/mods/gungloryonline-core-runtime-v1-stage68.jar corrected/game-server/mods/
          cp stage70/final/runtime/client/mods/gungloryonline-core-runtime-v1-stage68.jar corrected/web/site/content/files/v40/
          cp stage70/final/runtime/client/mods/gungloryonline-ui-runtime-v1-stage69.jar corrected/web/site/content/files/v40/
          cp stage70/final/runtime/client/resourcepacks/GunGloryOnline-Official.zip corrected/web/site/content/files/v40/
          cp infra/vds/game-server/run.sh corrected/game-server/infra/run.sh

          chmod +x corrected/web/site/install-site.sh corrected/web/site/verify-production.sh corrected/web/site/recover-production.sh corrected/web/services/ggo-auth/install.sh corrected/game-server/infra/run.sh

          python3 - <<'PY'
          import hashlib, json, zipfile
          from pathlib import Path
          root=Path('corrected/web/site')
          manifest=json.loads((root/'content/manifests/beta.json').read_text(encoding='utf-8'))
          rows={x['path']:x for x in manifest['files']}
          wanted={
            'mods/gungloryonline-core-runtime-v1-stage68.jar':'gungloryonline-core-runtime-v1-stage68.jar',
            'mods/gungloryonline-ui-runtime-v1-stage69.jar':'gungloryonline-ui-runtime-v1-stage69.jar',
            'resourcepacks/GunGloryOnline-Official.zip':'GunGloryOnline-Official.zip',
          }
          for path,name in wanted.items():
              row=rows[path]
              f=root/'content/files/v40'/name
              raw=f.read_bytes()
              assert len(raw)==row['size'], (path,len(raw),row['size'])
              assert hashlib.sha256(raw).hexdigest()==row['sha256'], path
              assert row['required'] is True and row['side']=='client', row
          assert 'resourcepacks/GunGloryOnline-ResourcePack-1.20.1-v5-swittie-social.zip' not in rows

          core=Path('corrected/game-server/mods/gungloryonline-core-runtime-v1-stage68.jar')
          ui=root/'content/files/v40/gungloryonline-ui-runtime-v1-stage69.jar'
          with zipfile.ZipFile(core) as z:
              names=set(z.namelist())
              assert 'arena/forge/GgoLaunchTicketNetwork.class' in names
              assert 'arena/forge/GgoOfficialAuthState.class' in names
              assert 'arena/forge/GgoPreAuthQuarantine.class' in names
          with zipfile.ZipFile(ui) as z:
              names=set(z.namelist())
              assert 'arena/client/shell/GgoLaunchTicketClient.class' in names
              assert 'arena/client/shell/GgoSessionVerificationOverlay.class' in names
          print('manifest + GGO ACK runtime contract: PASS')
          PY

          bash -n corrected/web/site/install-site.sh
          bash -n corrected/web/site/verify-production.sh
          bash -n corrected/web/site/recover-production.sh
          bash -n corrected/game-server/infra/run.sh
          grep -q 'Disabling duplicate nginx vhost' corrected/web/site/install-site.sh
          grep -q 'proxy_pass http://127.0.0.1:8787' corrected/web/site/nginx/ggo.conf
          grep -q '/api/v1/auth/register' corrected/web/site/install-site.sh
          grep -q '/api/v1/auth/login' corrected/web/site/install-site.sh
          grep -q 'SIGN IN / CREATE ACCOUNT' launcher/src/AccountHub.tsx
          grep -q 'OFFLINE TRAINING FALLBACK' launcher/src/AccountHub.tsx
          grep -q 'returnAfterAuth' corrected/web/site/account/account.js
          grep -q "approve.*===.*'1'" corrected/web/site/account/device.html
          grep -q '24842' corrected/web/site/recover-production.sh
          grep -q 'GGO_SERVER_KEY' corrected/game-server/infra/run.sh
          grep -q 'set_property online-mode false' corrected/game-server/infra/run.sh
          grep -q 'set_property enforce-secure-profile false' corrected/game-server/infra/run.sh
          grep -q 'set_property online-mode false' corrected/web/site/recover-production.sh
          grep -q 'EnvironmentFile=\$GAME_ENV' corrected/web/site/recover-production.sh

          cat > corrected/DEPLOY-AND-VERIFY.md <<'EOF'
          # GunGloryOnline Stage 73 — Auth/Account hotfix bundle

          This bundle contains no VDS credentials and does not modify `main`.

          ## Deploy

          Copy the extracted bundle to the Ubuntu VDS and run from the bundle root:

          ```bash
          sudo ./web/site/recover-production.sh
          ```

          The recovery script backs up `/var/lib/ggo-auth/auth.db`, disables duplicate enabled nginx vhosts for `ggo.kvicloud.ru`, installs the canonical HTTPS config, verifies `/api/v1/health` and register/login POST routing, installs the Stage68 server Core and hardened official run script, configures the GGO-only game environment, and starts Forge on TCP 24842.

          The official listener uses `online-mode=false` and `enforce-secure-profile=false` because GGO Account + the short-lived one-shot GGO ticket are the official identity/authentication layer. The hardened server refuses to start without `GGO_SERVER_KEY`, and the server quarantines gameplay until the ticket is consumed and ACKed.

          Never delete `/var/lib/ggo-auth/auth.db`.

          ## Expected public green state

          - site HTTPS works;
          - `/api/v1/health` is JSON from `ggo-auth`;
          - empty register POST returns 400, never 405;
          - empty login POST returns 401, never 405;
          - `play.kvicloud.ru -> 2.26.100.125`;
          - TCP 24842 accepts connections.

          ## Final acceptance

          Install the launcher, choose `SIGN IN / CREATE ACCOUNT`, register/login in the official GGO Account UI, let the browser device flow return to the launcher, install/sync, press PLAY ONLINE, and verify that the server consumes the one-shot ticket, sends VerificationAck, and the VERIFYING overlay disappears before gameplay unlocks.
          EOF

          cp .ci/public/32570294198.txt corrected/receipts/public-before-hotfix-32570294198.txt || true
          printf 'launcher_package_run=%s\nlauncher_source_sha=%s\nhotfix_source_sha=%s\n' '${{ steps.source.outputs.run_id }}' '${{ steps.source.outputs.head_sha }}' "$GITHUB_SHA" > corrected/receipts/source.txt

          (cd corrected && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
          zip -qr GunGloryOnline-Stage73-Auth-Hotfix-Bundle-2026-08-22.zip corrected
          unzip -tq GunGloryOnline-Stage73-Auth-Hotfix-Bundle-2026-08-22.zip
          sha256sum GunGloryOnline-Stage73-Auth-Hotfix-Bundle-2026-08-22.zip > GunGloryOnline-Stage73-Auth-Hotfix-Bundle-2026-08-22.zip.sha256
          echo "bytes=$(stat -c%s GunGloryOnline-Stage73-Auth-Hotfix-Bundle-2026-08-22.zip)" >> "$GITHUB_OUTPUT"
          echo "sha256=$(cut -d' ' -f1 GunGloryOnline-Stage73-Auth-Hotfix-Bundle-2026-08-22.zip.sha256)" >> "$GITHUB_OUTPUT"

      - name: Upload corrected hotfix bundle
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: GunGloryOnline-Stage73-Auth-Hotfix-Bundle-2026-08-22
          path: |
            GunGloryOnline-Stage73-Auth-Hotfix-Bundle-2026-08-22.zip
            GunGloryOnline-Stage73-Auth-Hotfix-Bundle-2026-08-22.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Publish immutable Stage 73 receipt
        if: always()
        env:
          BUNDLE: ${{ steps.bundle.outcome }}
          UPLOAD: ${{ steps.upload.outcome }}
        run: |
          set -euo pipefail
          result=success
          [ "$BUNDLE" = success ] || result=failure
          [ "$UPLOAD" = success ] || result=failure
          mkdir -p .ci/deploy
          receipt=".ci/deploy/${GITHUB_RUN_ID}-stage73.txt"
          cat > "$receipt" <<EOF
          workflow=${GITHUB_WORKFLOW}
          run_id=${GITHUB_RUN_ID}
          run_attempt=${GITHUB_RUN_ATTEMPT}
          run_url=https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          hotfix_source_sha=${GITHUB_SHA}
          launcher_source_sha=${{ steps.source.outputs.head_sha }}
          launcher_package_run=${{ steps.source.outputs.run_id }}
          stage70_runtime_run=32567000478
          bundle=$BUNDLE
          upload=$UPLOAD
          bundle_bytes=${{ steps.bundle.outputs.bytes }}
          bundle_sha256=${{ steps.bundle.outputs.sha256 }}
          result=$result
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$receipt"
          git commit -m "ci: record Stage 73 auth hotfix bundle ${GITHUB_RUN_ID}" || exit 0
          git fetch origin launcher/bootstrap-v0.1
          git rebase origin/launcher/bootstrap-v0.1
          git push origin HEAD:launcher/bootstrap-v0.1
