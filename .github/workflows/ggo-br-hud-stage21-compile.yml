name: GGO BR HUD Stage 21 Compile

on:
  workflow_dispatch:
  push:
    paths:
      - 'hotfix/BattleRoyaleService.java'
      - 'hotfix/GgoHudNetwork.java'
      - 'hotfix/GgoHudStateService.java'
      - '.github/workflows/ggo-br-hud-stage21-compile.yml'

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SOURCE_ZIP: gunner-arena-forge-1.20.1-0.6.0-test52-GREPFIX-SOURCE.zip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Unpack Runtime v1 source
        shell: bash
        run: |
          set -euo pipefail
          test -f "$SOURCE_ZIP"
          rm -rf ga-build
          mkdir ga-build
          unzip -q "$SOURCE_ZIP" -d ga-build

      - name: Inject BR HUD Stage 21
        shell: bash
        run: |
          set -euo pipefail
          root=ga-build/src/main/java/arena/forge
          mkdir -p "$root"
          cp hotfix/BattleRoyaleService.java "$root/BattleRoyaleService.java"
          cp hotfix/GgoHudNetwork.java "$root/GgoHudNetwork.java"
          cp hotfix/GgoHudStateService.java "$root/GgoHudStateService.java"
          grep -q 'GGO-BR-V3' "$root/BattleRoyaleService.java"
          grep -q 'PLACEMENTS' "$root/BattleRoyaleService.java"
          grep -q 'private static final String VERSION="2"' "$root/GgoHudNetwork.java"
          grep -q 'secondsRemaining' "$root/GgoHudNetwork.java"

      - name: Bootstrap ForgeGradle wrapper
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x ga-build/gradlew ] || [ ! -f ga-build/gradle/wrapper/gradle-wrapper.jar ]; then
            rm -rf /tmp/forge-mdk /tmp/forge-mdk.zip
            curl -fL --retry 3 -o /tmp/forge-mdk.zip \
              https://maven.minecraftforge.net/net/minecraftforge/forge/1.20.1-47.4.10/forge-1.20.1-47.4.10-mdk.zip
            mkdir -p /tmp/forge-mdk
            unzip -q /tmp/forge-mdk.zip 'gradlew' 'gradlew.bat' 'gradle/*' -d /tmp/forge-mdk
            cp /tmp/forge-mdk/gradlew ga-build/gradlew
            cp /tmp/forge-mdk/gradlew.bat ga-build/gradlew.bat
            rm -rf ga-build/gradle
            cp -a /tmp/forge-mdk/gradle ga-build/gradle
            chmod +x ga-build/gradlew
          fi

      - name: Compile Forge Core
        working-directory: ga-build
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon compileJava --stacktrace

      - name: Verify Stage 21 classes
        shell: bash
        run: |
          set -euo pipefail
          root=ga-build/build/classes/java/main/arena/forge
          test -f "$root/BattleRoyaleService.class"
          test -f "$root/GgoHudNetwork.class"
          test -f "$root/GgoHudStateService.class"
