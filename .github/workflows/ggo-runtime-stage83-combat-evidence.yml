name: GGO Runtime Stage 83 Combat Evidence

on:
  workflow_dispatch:
  push:
    branches:
      - server/runtime-hardening-v1
    paths:
      - '.github/workflows/ggo-runtime-stage83-combat-evidence.yml'
      - 'hotfix/GgoCombatRateAntiCheat.java'
      - 'hotfix/apply_ggo_weapon_anticheat_stage83.py'
      - 'hotfix/GgoAntiCheatEvidence.java'
      - 'hotfix/apply_ggo_anticheat_stage82.py'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      SOURCE_ZIP: gunner-arena-forge-1.20.1-0.6.0-test52-GREPFIX-SOURCE.zip
    steps:
      - uses: actions/checkout@v4
        with:
          ref: server/runtime-hardening-v1
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Capture exact ref
        id: refs
        run: echo "server_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Prepare Forge wrapper
        run: |
          set -euo pipefail
          rm -rf /tmp/ggo-mdk /tmp/ggo-mdk.zip
          curl -fL --retry 3 -o /tmp/ggo-mdk.zip https://maven.minecraftforge.net/net/minecraftforge/forge/1.20.1-47.4.10/forge-1.20.1-47.4.10-mdk.zip
          mkdir -p /tmp/ggo-mdk
          unzip -q /tmp/ggo-mdk.zip 'gradlew' 'gradlew.bat' 'gradle/*' -d /tmp/ggo-mdk
      - name: Build Stage83 Core
        id: core
        run: |
          set -euo pipefail
          rm -rf ga-build stage83 && mkdir ga-build
          unzip -q "$SOURCE_ZIP" -d ga-build
          for patch in \
            apply_ggo_contract_rewards_stage26.py \
            apply_ggo_contract_map_stage27.py \
            apply_ggo_contract_push_stage28.py \
            apply_ggo_contract_persistence_stage29.py \
            apply_ggo_contract_lifecycle_stage30.py \
            apply_ggo_contract_balance_stage31.py \
            apply_ggo_contract_eligibility_stage32.py \
            apply_ggo_supply_lifecycle_stage33.py \
            apply_ggo_extraction_runtime_stage34.py \
            apply_ggo_contract_network_guard_stage36.py \
            apply_ggo_contract_reward_order_stage37.py \
            apply_ggo_compile_baseline_stage27.py \
            apply_ggo_spawn_presence_stage38.py \
            apply_ggo_deminecraft_world_stage39.py \
            apply_ggo_deminecraft_loot_stage41.py \
            apply_ggo_inventory_stage42.py \
            apply_ggo_visible_content_stage43.py \
            apply_ggo_medicine_stage47.py \
            apply_ggo_death_recap_stage48.py \
            apply_ggo_recovery_bag_stage49.py \
            apply_ggo_map_integrity_stage51.py \
            apply_ggo_map_palette_stage54.py \
            apply_ggo_official_auth_stage55.py \
            apply_ggo_pre_auth_quarantine_stage59.py \
            apply_ggo_ui_packets_stage65.py \
            apply_ggo_ui_channel_ownership_stage71.py \
            apply_ggo_anticheat_stage82.py \
            apply_ggo_weapon_anticheat_stage83.py; do
              python3 "hotfix/$patch"
          done
          cp /tmp/ggo-mdk/gradlew ga-build/gradlew
          cp /tmp/ggo-mdk/gradlew.bat ga-build/gradlew.bat
          rm -rf ga-build/gradle && cp -a /tmp/ggo-mdk/gradle ga-build/gradle
          chmod +x ga-build/gradlew
          (cd ga-build && ./gradlew --no-daemon clean build --stacktrace)
          CORE="$(find ga-build/build/libs -type f -name '*.jar' ! -name '*sources*' ! -name '*dev*' | head -n1)"
          test -n "$CORE" && test -f "$CORE"
          mkdir -p stage83/server/mods stage83/client/mods
          cp "$CORE" stage83/server/mods/gungloryonline-core-runtime-v1-stage83.jar
          cp "$CORE" stage83/client/mods/gungloryonline-core-runtime-v1-stage83.jar
          echo "sha256=$(sha256sum "$CORE" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
      - name: Verify Stage83 safety boundary
        id: gates
        run: |
          set -euo pipefail
          C=ga-build/src/main/java/arena/forge/GgoCombatRateAntiCheat.java
          E=ga-build/src/main/java/arena/forge/GgoAntiCheatEvidence.java
          test -f "$C" && test -f "$E"
          grep -q 'REPORT ONLY' "$C"
          grep -q 'EXTREME_SAME_TICK_IMPACTS = 20' "$C"
          grep -q 'GgoOfficialAuthState.isAuthenticated(player)' "$C"
          grep -q 'Kind.COMBAT_RATE' "$C"
          grep -q 'does NOT pretend LivingAttackEvent is a weapon fire event' "$C"
          ! grep -q '\.disconnect(' "$C" "$E"
          ! grep -qi 'banPlayer\|kickPlayer\|System.exit\|GGO_GAME_TICKET\|Authorization' "$C" "$E"
          J=stage83/server/mods/gungloryonline-core-runtime-v1-stage83.jar
          jar tf "$J" | grep -q 'arena/forge/GgoCombatRateAntiCheat.class'
          jar tf "$J" | grep -q 'arena/forge/GgoMovementAntiCheat.class'
          jar tf "$J" | grep -q 'arena/forge/GgoWeaponStateAntiCheat.class'
          jar tf "$J" | grep -q 'arena/forge/GgoInventoryAntiCheat.class'
          jar tf "$J" | grep -q 'arena/forge/GgoAntiCheatEvidence.class'
          cmp stage83/server/mods/gungloryonline-core-runtime-v1-stage83.jar stage83/client/mods/gungloryonline-core-runtime-v1-stage83.jar
      - uses: actions/upload-artifact@v4
        id: upload
        if: success()
        with:
          name: GunGloryOnline-Core-Stage83-Combat-Evidence
          path: stage83/**
          if-no-files-found: error
          retention-days: 30
      - name: Publish Stage83 receipt
        if: always()
        env:
          CORE_OUTCOME: ${{ steps.core.outcome }}
          GATES_OUTCOME: ${{ steps.gates.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
        run: |
          set -euo pipefail
          result=success
          for v in "$CORE_OUTCOME" "$GATES_OUTCOME" "$UPLOAD_OUTCOME"; do [ "$v" = success ] || result=failure; done
          mkdir -p ci-results
          cat > ci-results/stage83-combat-evidence.txt <<EOF
          workflow=${GITHUB_WORKFLOW}
          run_id=${GITHUB_RUN_ID}
          run_attempt=${GITHUB_RUN_ATTEMPT}
          run_url=https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          server_sha=${{ steps.refs.outputs.server_sha }}
          core_build=$CORE_OUTCOME
          anticheat_gates=$GATES_OUTCOME
          upload=$UPLOAD_OUTCOME
          core_sha256=${{ steps.core.outputs.sha256 }}
          movement_detector=true
          weapon_state_detector=true
          inventory_detector=true
          combat_impact_signal=true
          exact_fire_timing=false
          authenticated_players_only=true
          enforcement=report_only
          automatic_kick=false
          automatic_ban=false
          result=$result
          EOF
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ci-results/stage83-combat-evidence.txt
          git commit -m "ci: record Stage83 combat evidence ${GITHUB_RUN_ID}" || exit 0
          git fetch origin server/runtime-hardening-v1
          git rebase origin/server/runtime-hardening-v1
          git push origin HEAD:server/runtime-hardening-v1
