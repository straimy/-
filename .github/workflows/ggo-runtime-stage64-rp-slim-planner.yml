name: GGO Runtime Stage 64 RP Slim Planner

on:
  workflow_dispatch:
  push:
    branches:
      - client/runtime-migration-v1
    paths:
      - '.github/workflows/ggo-runtime-stage64-rp-slim-planner.yml'
      - 'hotfix/plan_ggo_resourcepack_slim_stage64.py'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: client/runtime-migration-v1
          fetch-depth: 0

      - name: Compile planner
        id: compile
        run: python3 -m py_compile hotfix/plan_ggo_resourcepack_slim_stage64.py

      - name: Verify conservative dependency planner
        id: planner
        run: |
          set -euo pipefail
          rm -rf /tmp/ggo-stage64 && mkdir -p /tmp/ggo-stage64
          python3 - <<'PY'
          import json, zipfile
          from pathlib import Path
          root=Path('/tmp/ggo-stage64')
          pack=root/'fixture.zip'
          entries={
            'pack.mcmeta': json.dumps({'pack':{'pack_format':15,'description':'fixture'}}),
            'assets/minecraft/blockstates/stone.json': json.dumps({'variants':{'':{'model':'minecraft:block/stone'}}}),
            'assets/minecraft/models/block/stone.json': json.dumps({'parent':'minecraft:block/cube_all','textures':{'all':'minecraft:block/stone'}}),
            'assets/minecraft/blockstates/dirt.json': json.dumps({'variants':{'':{'model':'minecraft:block/dirt'}}}),
            'assets/minecraft/models/block/dirt.json': json.dumps({'parent':'minecraft:block/cube_all','textures':{'all':'minecraft:block/dirt'}}),
            'assets/minecraft/models/block/cube_all.json': json.dumps({'parent':'minecraft:block/cube','textures':{'down':'#all','up':'#all','north':'#all','south':'#all','west':'#all','east':'#all','particle':'#all'}}),
            'assets/minecraft/models/block/cube.json': json.dumps({'textures':{'particle':'#down'}}),
            'assets/minecraft/textures/block/stone.png': b'png-stone',
            'assets/minecraft/textures/block/dirt.png': b'png-dirt',
            'assets/minecraft/textures/gui/ggo-preserved.png': b'gui',
            'assets/minecraft/textures/item/ggo-preserved.png': b'item',
            'assets/gunnerarena/textures/item/recovery_bag.png': b'ggo',
          }
          with zipfile.ZipFile(pack,'w') as z:
              for name,payload in entries.items():
                  if isinstance(payload,str): payload=payload.encode()
                  z.writestr(name,payload)
          (root/'palette.txt').write_text('# real format fixture\nminecraft:stone\ngunnerarena:custom_block\n',encoding='utf-8')
          (root/'empty.txt').write_text('# no blocks\n',encoding='utf-8')
          PY
          python3 hotfix/plan_ggo_resourcepack_slim_stage64.py /tmp/ggo-stage64/palette.txt \
            --pack /tmp/ggo-stage64/fixture.zip --report /tmp/ggo-stage64/report.txt
          grep -q '^mode=DRY_RUN_ONLY$' /tmp/ggo-stage64/report.txt
          grep -q '^write_performed=false$' /tmp/ggo-stage64/report.txt
          grep -q '^assets/minecraft/blockstates/stone.json$' /tmp/ggo-stage64/report.txt
          grep -q '^assets/minecraft/models/block/stone.json$' /tmp/ggo-stage64/report.txt
          grep -q '^assets/minecraft/textures/block/stone.png$' /tmp/ggo-stage64/report.txt
          grep -q '^assets/minecraft/blockstates/dirt.json$' /tmp/ggo-stage64/report.txt
          grep -q '^assets/minecraft/models/block/dirt.json$' /tmp/ggo-stage64/report.txt
          grep -q '^assets/minecraft/textures/block/dirt.png$' /tmp/ggo-stage64/report.txt
          test "$(grep -c '^assets/minecraft/textures/gui/ggo-preserved.png$' /tmp/ggo-stage64/report.txt || true)" -eq 0
          test "$(grep -c '^assets/minecraft/textures/item/ggo-preserved.png$' /tmp/ggo-stage64/report.txt || true)" -eq 0
          test "$(grep -c '^assets/gunnerarena/textures/item/recovery_bag.png$' /tmp/ggo-stage64/report.txt || true)" -eq 0
          if python3 hotfix/plan_ggo_resourcepack_slim_stage64.py /tmp/ggo-stage64/empty.txt --pack /tmp/ggo-stage64/fixture.zip --report /tmp/ggo-stage64/should-not-exist.txt; then
            echo 'planner accepted empty palette' >&2
            exit 1
          fi
          if python3 hotfix/plan_ggo_resourcepack_slim_stage64.py /tmp/ggo-stage64/missing.txt --pack /tmp/ggo-stage64/fixture.zip --report /tmp/ggo-stage64/should-not-exist-2.txt; then
            echo 'planner accepted missing palette' >&2
            exit 1
          fi
          test ! -f /tmp/ggo-stage64/should-not-exist.txt
          test ! -f /tmp/ggo-stage64/should-not-exist-2.txt

      - name: Verify production pack is readable without mutating it
        id: production
        run: |
          set -euo pipefail
          before=$(sha256sum GunnerArena-ResourcePack-1.20.1-v1.zip | awk '{print $1}')
          python3 - <<'PY'
          import zipfile
          p='GunnerArena-ResourcePack-1.20.1-v1.zip'
          with zipfile.ZipFile(p) as z:
              assert 'pack.mcmeta' in z.namelist()
          PY
          after=$(sha256sum GunnerArena-ResourcePack-1.20.1-v1.zip | awk '{print $1}')
          test "$before" = "$after"

      - name: Publish exact Stage 64 planner receipt
        if: always()
        env:
          COMPILE_OUTCOME: ${{ steps.compile.outcome }}
          PLANNER_OUTCOME: ${{ steps.planner.outcome }}
          PRODUCTION_OUTCOME: ${{ steps.production.outcome }}
        run: |
          set -euo pipefail
          result=success
          for value in "$COMPILE_OUTCOME" "$PLANNER_OUTCOME" "$PRODUCTION_OUTCOME"; do
            if [ "$value" != success ]; then result=failure; fi
          done
          mkdir -p ci-results
          cat > ci-results/stage64-rp-slim-planner.txt <<EOF
          workflow=${{ github.workflow }}
          run_id=${GITHUB_RUN_ID}
          run_attempt=${GITHUB_RUN_ATTEMPT}
          run_url=https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          source_sha=${GITHUB_SHA}
          python_compile=$COMPILE_OUTCOME
          dependency_planner=$PLANNER_OUTCOME
          production_pack_readonly=$PRODUCTION_OUTCOME
          real_palette_applied=false
          destructive_write_available=false
          result=$result
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ci-results/stage64-rp-slim-planner.txt
          git commit -m "ci: record Stage 64 RP planner run ${GITHUB_RUN_ID}" || exit 0
          git fetch origin client/runtime-migration-v1
          git rebase origin/client/runtime-migration-v1
          git push origin HEAD:client/runtime-migration-v1
