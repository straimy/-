name: GGO Stage100 Candidate Manifest

on:
  workflow_dispatch:
  push:
    branches:
      - launcher/bootstrap-v0.1
    paths:
      - '.github/workflows/ggo-stage100-candidate-manifest.yml'
      - 'launcher/hotfix/prepare_stage100_manifest.py'

permissions:
  contents: write

jobs:
  verify-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CORE_URL: https://ggo.kvicloud.ru/content/files/v100/gungloryonline-core-runtime-v1-stage100-ost-branding.jar
      UI_URL: https://ggo.kvicloud.ru/content/files/v100/gungloryonline-ui-runtime-v1-stage100-ost-branding.jar
      RP_URL: https://ggo.kvicloud.ru/content/files/v100/GunGloryOnline-Official-stage100.zip
      CORE_SHA256: c3c580b456ad5bd17144188a557d6d50ce2d3c23eee5685f7fdf28b632c1f2a1
      UI_SHA256: 75259d89f12e0f36add0bd82f02674aaad3313e7f807ae38ef2791026ca9e4fc
      RP_SHA256: b10b3228004b8d3068c93122c39e766df9778a1b277fef4a97d835c5ab0005ba
    steps:
      - uses: actions/checkout@v4
        with:
          ref: launcher/bootstrap-v0.1
          fetch-depth: 0

      - name: Verify public Stage100 assets
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 "$CORE_URL" -o /tmp/ggo-core.jar
          curl -fsSL --retry 3 "$UI_URL" -o /tmp/ggo-ui.jar
          curl -fsSL --retry 3 "$RP_URL" -o /tmp/ggo-rp.zip
          printf '%s  %s\n' "$CORE_SHA256" /tmp/ggo-core.jar | sha256sum -c -
          printf '%s  %s\n' "$UI_SHA256" /tmp/ggo-ui.jar | sha256sum -c -
          printf '%s  %s\n' "$RP_SHA256" /tmp/ggo-rp.zip | sha256sum -c -
          test "$(stat -c %s /tmp/ggo-core.jar)" = 462019
          test "$(stat -c %s /tmp/ggo-ui.jar)" = 209288
          test "$(stat -c %s /tmp/ggo-rp.zip)" = 29149214
          jar tf /tmp/ggo-ui.jar | grep -q '^arena/client/shell/GgoWindowIconClient.class$'
          jar tf /tmp/ggo-ui.jar | grep -q '^arena/mixin/GgoWindowTitleMixin.class$'
          jar tf /tmp/ggo-ui.jar | grep -q '^assets/ggo/icon.png$'
          unzip -p /tmp/ggo-ui.jar ggo-startup.mixins.json | grep -q 'GgoWindowTitleMixin'
          unzip -p /tmp/ggo-rp.zip assets/minecraft/sounds.json | grep -q 'ggo/music/digital_horizon'
          unzip -p /tmp/ggo-rp.zip assets/minecraft/sounds.json | grep -q 'ggo/music/distant_current'

      - name: Generate candidate manifest
        run: |
          set -euo pipefail
          python3 launcher/hotfix/prepare_stage100_manifest.py
          python3 -m json.tool site/content/manifests/beta-stage100-candidate.json >/dev/null
          grep -q '"gameVersion": "v100-candidate"' site/content/manifests/beta-stage100-candidate.json
          grep -q "$CORE_SHA256" site/content/manifests/beta-stage100-candidate.json
          grep -q "$UI_SHA256" site/content/manifests/beta-stage100-candidate.json
          grep -q "$RP_SHA256" site/content/manifests/beta-stage100-candidate.json
          ! grep -q '/v98/gungloryonline-' site/content/manifests/beta-stage100-candidate.json

      - name: Persist candidate manifest and receipt
        run: |
          set -euo pipefail
          mkdir -p .ci/launcher
          cat > .ci/launcher/stage100-candidate-manifest.txt <<EOF
          workflow=${GITHUB_WORKFLOW}
          run_id=${GITHUB_RUN_ID}
          source_sha=${GITHUB_SHA}
          build_id=runtime-stage100
          core_sha256=${CORE_SHA256}
          ui_sha256=${UI_SHA256}
          resource_pack_sha256=${RP_SHA256}
          public_assets_verified=true
          manifest_generated=true
          activated=false
          result=success
          EOF
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add site/content/manifests/beta-stage100-candidate.json .ci/launcher/stage100-candidate-manifest.txt
          git commit -m "ci: publish verified Stage100 candidate manifest ${GITHUB_RUN_ID}" || exit 0
          git fetch origin launcher/bootstrap-v0.1
          git rebase origin/launcher/bootstrap-v0.1
          git push origin HEAD:launcher/bootstrap-v0.1
