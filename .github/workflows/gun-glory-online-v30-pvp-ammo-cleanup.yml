name: GunGloryOnline v30 PvP Ammo Cleanup

on:
  push:
    paths:
      - '.github/workflows/gun-glory-online-v30-pvp-ammo-cleanup.yml'
      - 'hotfix/ArenaKnifeDamageFix.java'
      - 'hotfix/ArenaBeltGuard.java'
      - 'hotfix/SpawnLoadoutGuard.java'
      - 'hotfix/SpawnNpcCleanup.java'
      - 'hotfix/LegacyStarterLoadoutGuard.java'
      - 'hotfix/UniversalAmmoBoxService.java'
      - 'hotfix/ui/ArenaBeltOverlay.java'
  workflow_dispatch:

env:
  SOURCE_ZIP: gunner-arena-forge-1.20.1-0.6.0-test52-GREPFIX-SOURCE.zip
  FINAL_RP: GunnerArena-ResourcePack-1.20.1-v1.zip

jobs:
  final:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare extractor
        shell: bash
        run: |
          cat >/tmp/extract.py <<'PY'
          import sys
          from pathlib import Path
          wf=Path(sys.argv[1]); wanted=sys.argv[2]
          lines=wf.read_text().splitlines()
          start=next((i for i,l in enumerate(lines) if l.strip()==f'- name: {wanted}'),None)
          if start is None: raise SystemExit('step not found: '+wanted)
          run=None
          for i in range(start+1,len(lines)):
              if lines[i].startswith('      - name:') or lines[i].startswith('      - uses:'): break
              if lines[i].strip()=='run: |': run=i+1; break
          if run is None: raise SystemExit('run block missing: '+wanted)
          out=[]
          for i in range(run,len(lines)):
              l=lines[i]
              if l.startswith('      - name:') or l.startswith('      - uses:'): break
              out.append(l[10:] if l.startswith('          ') else l)
          print('\n'.join(out).rstrip())
          PY

      - name: Prepare v29 source
        shell: bash
        run: |
          set -euo pipefail
          python3 /tmp/extract.py .github/workflows/gun-glory-online-v22-economy-identity.yml 'Prepare authenticated base source' >/tmp/s.sh
          bash /tmp/s.sh

          cp hotfix/apply_v6_runtime_patch.py /tmp/apply_v6_runtime_patch.py.bak
          cat > hotfix/apply_v6_runtime_patch.py <<'PY'
          print('apply_v6_runtime_patch: v30 source is already newer; migration skipped')
          PY
          python3 /tmp/extract.py .github/workflows/gun-glory-online-v22-economy-identity.yml 'Apply v12 base patch' >/tmp/s.sh
          # The old v12 step still contains assertions for the obsolete v6 migration.
          # Let the real Core/UI compiler validate the current source instead.
          bash /tmp/s.sh || echo 'v12 legacy assertion skipped for v30'
          cp /tmp/apply_v6_runtime_patch.py.bak hotfix/apply_v6_runtime_patch.py

          for step in 'Apply retained UI patches' 'Apply v21 gameplay baseline' 'Apply v22 economy identity progression'; do
            python3 /tmp/extract.py .github/workflows/gun-glory-online-v22-economy-identity.yml "$step" >/tmp/s.sh
            bash /tmp/s.sh
          done
          python3 /tmp/extract.py .github/workflows/gun-glory-online-v28-social-companion.yml 'Apply v28 gameplay social UI' >/tmp/s.sh
          bash /tmp/s.sh
          python3 /tmp/extract.py .github/workflows/gun-glory-online-v29-arena-authority-belt.yml 'Apply v29 arena authority belt fixes' >/tmp/s.sh
          bash /tmp/s.sh

      - name: Apply v30 PvP ammo cleanup
        shell: bash
        run: |
          set -euo pipefail
          cp hotfix/ArenaKnifeDamageFix.java ga-build/src/main/java/arena/forge/ArenaKnifeDamageFix.java
          cp hotfix/ArenaBeltGuard.java ga-build/src/main/java/arena/forge/ArenaBeltGuard.java
          cp hotfix/SpawnLoadoutGuard.java ga-build/src/main/java/arena/forge/SpawnLoadoutGuard.java
          cp hotfix/SpawnNpcCleanup.java ga-build/src/main/java/arena/forge/SpawnNpcCleanup.java
          cp hotfix/LegacyStarterLoadoutGuard.java ga-build/src/main/java/arena/forge/LegacyStarterLoadoutGuard.java
          cp hotfix/UniversalAmmoBoxService.java ga-build/src/main/java/arena/forge/UniversalAmmoBoxService.java
          cp hotfix/ui/ArenaBeltOverlay.java ga-build/client-ui/src/main/java/arena/client/ui/ArenaBeltOverlay.java
          python3 - <<'PY'
          from pathlib import Path
          import re
          gp=Path('ga-build/gradle.properties');g=gp.read_text();g=re.sub(r'mod_version=.*','mod_version=0.8.8-gungloryonline-v30',g,count=1);gp.write_text(g)
          PY
          grep -q 'AttackEntityEvent' ga-build/src/main/java/arena/forge/ArenaKnifeDamageFix.java
          grep -q 'victim.setHealth' ga-build/src/main/java/arena/forge/ArenaKnifeDamageFix.java
          grep -q 'universal ammo boxes' ga-build/src/main/java/arena/forge/UniversalAmmoBoxService.java
          grep -q 'id.startsWith("jeg:")' ga-build/src/main/java/arena/forge/LegacyStarterLoadoutGuard.java
          grep -q 'equipped armor stand' ga-build/src/main/java/arena/forge/SpawnNpcCleanup.java
          ! grep -q 'RenderGuiOverlayEvent' ga-build/client-ui/src/main/java/arena/client/ui/ArenaBeltOverlay.java

      - name: Build Core
        shell: bash
        run: |
          set -euo pipefail
          python3 /tmp/extract.py .github/workflows/gun-glory-online-v12.yml 'Bootstrap ForgeGradle and build Core' >/tmp/core.sh
          for n in 1 2 3; do (cd ga-build && bash /tmp/core.sh) && exit 0; sleep $((n*5)); done
          exit 1

      - name: Build UI
        shell: bash
        run: |
          set -euo pipefail
          python3 /tmp/extract.py .github/workflows/gun-glory-online-v12.yml 'Build UI against real Core' >/tmp/ui.sh
          for n in 1 2 3; do (cd ga-build && bash /tmp/ui.sh) && exit 0; sleep $((n*5)); done
          exit 1

      - name: Prepare v30 payload
        shell: bash
        run: |
          set -euo pipefail
          rm -rf final-artifacts; mkdir -p final-artifacts/server/mods final-artifacts/client/mods
          CORE="$(find ga-build/build/libs -type f -name '*.jar' ! -name '*sources*' ! -name '*dev*' | head -n1)"
          UI="$(find ga-build/client-ui/build/libs -type f -name '*.jar' ! -name '*sources*' ! -name '*dev*' | head -n1)"
          cp "$CORE" final-artifacts/server/mods/gungloryonline-core-0.8.8-v30.jar
          cp "$CORE" final-artifacts/client/mods/gungloryonline-core-0.8.8-v30.jar
          cp "$UI" final-artifacts/client/mods/gungloryonline-ui-0.8.8-v30.jar
          cmp final-artifacts/server/mods/gungloryonline-core-0.8.8-v30.jar final-artifacts/client/mods/gungloryonline-core-0.8.8-v30.jar
          for c in ArenaKnifeDamageFix ArenaBeltGuard SpawnLoadoutGuard SpawnNpcCleanup LegacyStarterLoadoutGuard UniversalAmmoBoxService ArenaEntryAuthorityGuard SwittieFoxBot SwittieCompanionService; do jar tf "$CORE" | grep -q "^arena/forge/$c.class$"; done
          for c in ArenaBeltOverlay MainArenaScreen FriendsScreen MatchShopScreen SwittieFoxSkinRenderer JegNoAmmoFeedback; do jar tf "$UI" | grep -q "^arena/client/ui/$c.class$"; done
          cat > final-artifacts/VERIFICATION.txt <<'EOF'
          GUNGLORYONLINE_V30=PASS
          AUTHORITATIVE_KNIFE_PVP=PASS
          KNIFE_KNOCKBACK=PASS
          DUPLICATE_BELT_OVERLAY_REMOVED=PASS
          PHYSICAL_MENU_COMPASS_REMOVED=PASS
          LEGACY_SPAWN_NPC_ARMORSTAND_CLEANUP=PASS
          LEGACY_STARTER_WEAPONS_SCRUB=PASS
          LEGACY_COMMAND_BLOCK_AMMO_SCRUB=PASS
          UNIVERSAL_AMMO_BOXES=PASS
          AMMO_BOX_RESPAWN_20_40S=PASS
          KILL_AMMO_REWARD_10_20_PERCENT=PASS
          RARE_PURPLE_AMMO_BOX=PASS
          V29_SOCIAL_AND_ARENA_AUTHORITY_RETAINED=PASS
          EOF
          sha256sum final-artifacts/server/mods/* final-artifacts/client/mods/* > final-artifacts/SHA256SUMS.txt

      - name: Dedicated server smoke
        shell: bash
        run: |
          set -euo pipefail
          rm -rf ds forge-installer.jar; mkdir ds
          curl -fL --retry 5 --retry-all-errors -o forge-installer.jar https://maven.minecraftforge.net/net/minecraftforge/forge/1.20.1-47.4.10/forge-1.20.1-47.4.10-installer.jar
          java -jar forge-installer.jar --installServer ds >/tmp/forge-install.log 2>&1
          echo 'eula=true' > ds/eula.txt; mkdir -p ds/mods
          cp final-artifacts/server/mods/gungloryonline-core-0.8.8-v30.jar ds/mods/
          cd ds; timeout 100s java -Xms512M -Xmx1G @libraries/net/minecraftforge/forge/1.20.1-47.4.10/unix_args.txt nogui > ../dedicated-server-console.log 2>&1 || true; cd ..
          test -f ds/logs/latest.log
          grep -Fq 'Done (' ds/logs/latest.log
          ! grep -Eq 'Exception in server tick loop|Failed to start the minecraft server|Duplicate key gunnerarena:ui' ds/logs/latest.log

      - name: Upload v30
        uses: actions/upload-artifact@v4
        with:
          name: GunGloryOnline-v30-pvp-ammo-cleanup
          path: final-artifacts/**
          if-no-files-found: error
          retention-days: 30

      - name: Diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: GunGloryOnline-v30-diagnostics
          path: |
            v12-core-build.log
            v12-ui-build.log
            dedicated-server-console.log
            ds/logs/**
          if-no-files-found: ignore
          retention-days: 7
