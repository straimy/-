name: GGO Launcher Stage113 Final Linux

on:
  workflow_dispatch:
  push:
    branches:
      - launcher/bootstrap-v0.1
    paths:
      - '.github/workflows/ggo-launcher-stage103-final-linux.yml'
      - 'launcher/src/**'
      - 'launcher/src-tauri/src/**'
      - 'launcher/src-tauri/Cargo.toml'
      - 'launcher/src-tauri/tauri.conf.json'
      - 'launcher/package.json'

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: launcher
    steps:
      - uses: actions/checkout@v4
        with:
          ref: launcher/bootstrap-v0.1
          fetch-depth: 0

      - name: Install Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm install

      - name: Stage113 source gate
        id: source_gate
        run: |
          set -euo pipefail
          grep -Fq '"version": "0.2.14"' package.json
          grep -Fq 'version = "0.2.14"' src-tauri/Cargo.toml
          grep -Fq '"version": "0.2.14"' src-tauri/tauri.conf.json
          grep -Fq 'beta-stage113-candidate.json' src-tauri/src/core/bootstrap.rs
          grep -Fq 'game_version: "v113-candidate"' src-tauri/src/core/bootstrap.rs
          grep -Fq 'managed_stage_from_name' src-tauri/src/lib.rs
          grep -Fq 'format!("runtime-stage{stage}")' src-tauri/src/lib.rs
          grep -Fq 'GGO_READY_FILE' src-tauri/src/lib.rs
          grep -Fq 'unified_surface::supervise' src-tauri/src/lib.rs
          grep -Fq 'window.set_always_on_top(true)' src-tauri/src/lib.rs
          grep -Fq 'window.hide()' src-tauri/src/runtime/unified_surface.rs
          grep -Fq 'game_process_status()' src-tauri/src/runtime/unified_surface.rs
          grep -Fq 'fetch_profile(http, api_url, &session.access_token)' src-tauri/src/core/ggo_auth.rs
          grep -Fq 'store.clear().await' src-tauri/src/core/ggo_auth.rs
          grep -Fq 'ggo-hero-headphones.webp' src/App.tsx
          grep -Fq 'ggo-hero-lantern.webp' src/App.tsx
          grep -Fq '(["home","accounts","news","settings"] as Page[])' src/App.tsx
          grep -Fq 'play:"PLAY"' src/App.tsx
          ! grep -Fq 'play:"PLAY ONLINE"' src/App.tsx
          ! grep -Fq '>TRAINING<' src/App.tsx

      - name: Frontend build
        id: frontend
        run: npm run build

      - name: Rust format/check/test
        id: rust
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
          cargo check --manifest-path src-tauri/Cargo.toml
          cargo test --manifest-path src-tauri/Cargo.toml

      - name: Generate platform icons
        run: npm run tauri icon src-tauri/icons/icon.png

      - name: Build Stage113 AppImage
        id: package
        run: npm run tauri build -- --bundles appimage

      - name: Verify AppImage
        id: verify
        run: |
          set -euo pipefail
          APP="$(find src-tauri/target/release/bundle/appimage -maxdepth 1 -type f -name '*.AppImage' | head -n1)"
          test -n "$APP" && test -f "$APP"
          case "$(basename "$APP")" in
            *0.2.14*) ;;
            *) echo "unexpected launcher filename: $APP" >&2; exit 1 ;;
          esac
          sha256sum "$APP"
          echo "app=$APP" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$APP" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "bytes=$(stat -c%s "$APP")" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        id: upload
        with:
          name: GunGloryOnline-Linux-Stage113-Final-0.2.14
          path: launcher/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 30

      - name: Publish receipt
        if: always()
        env:
          SOURCE_GATE: ${{ steps.source_gate.outcome }}
          FRONTEND: ${{ steps.frontend.outcome }}
          RUST: ${{ steps.rust.outcome }}
          PACKAGE: ${{ steps.package.outcome }}
          VERIFY: ${{ steps.verify.outcome }}
          UPLOAD: ${{ steps.upload.outcome }}
        working-directory: .
        run: |
          set -euo pipefail
          result=failure
          [ "$SOURCE_GATE" = success ] && [ "$FRONTEND" = success ] && [ "$RUST" = success ] && [ "$PACKAGE" = success ] && [ "$VERIFY" = success ] && [ "$UPLOAD" = success ] && result=success

          git reset --hard HEAD

          mkdir -p .ci/launcher
          cat > .ci/launcher/stage113-final-linux.txt <<EOF
          workflow=${GITHUB_WORKFLOW}
          run_id=${GITHUB_RUN_ID}
          source_sha=${GITHUB_SHA}
          launcher_version=0.2.14
          game_version=v113-candidate
          manifest=beta-stage113-candidate.json
          stale_session_validation=true
          dual_character_art=true
          unified_surface=true
          appimage_sha256=${{ steps.verify.outputs.sha256 }}
          appimage_bytes=${{ steps.verify.outputs.bytes }}
          source_gate=$SOURCE_GATE
          frontend=$FRONTEND
          rust=$RUST
          package=$PACKAGE
          verify=$VERIFY
          upload=$UPLOAD
          result=$result
          EOF
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .ci/launcher/stage113-final-linux.txt
          git commit -m "ci: record Stage113 final Linux launcher ${GITHUB_RUN_ID}" || exit 0
          git fetch origin launcher/bootstrap-v0.1
          git rebase origin/launcher/bootstrap-v0.1
          git push origin HEAD:launcher/bootstrap-v0.1
