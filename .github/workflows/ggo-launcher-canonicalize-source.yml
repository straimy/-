name: GGO Launcher Canonicalize Source

on:
  push:
    branches:
      - launcher/bootstrap-v0.1
    paths:
      - '.github/workflows/ggo-launcher-canonicalize-source.yml'
      - 'launcher/hotfix/apply_menu_first_beta_stage76.py'
      - 'launcher/hotfix/apply_client_integrity_stage84.py'
      - 'launcher/hotfix/apply_ticket_binding_stage90.py'
      - 'launcher/hotfix/apply_launcher_surface_stage99.py'
      - 'launcher/hotfix/apply_session_validation_stage104.py'
      - 'launcher/hotfix/apply_character_art_stage104.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  canonicalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: launcher/bootstrap-v0.1
          fetch-depth: 0

      - name: Apply canonical launcher chain to tracked source
        working-directory: launcher
        run: |
          set -euo pipefail
          python3 hotfix/apply_menu_first_beta_stage76.py
          python3 hotfix/apply_launcher_surface_stage99.py
          python3 hotfix/apply_session_validation_stage104.py
          python3 hotfix/apply_character_art_stage104.py
          grep -Fq 'play:"PLAY"' src/App.tsx
          ! grep -Fq 'play:"PLAY ONLINE"' src/App.tsx
          ! grep -Fq 'onClick={()=>void launch(true)}' src/App.tsx
          grep -Fq '?t.install:updateAvailable?t.updateGame:t.play' src/App.tsx
          grep -Fq 'setGameInstalled(plan.files.length===0)' src/App.tsx
          grep -Fq '(["home","accounts","news","settings"] as Page[])' src/App.tsx
          grep -Fq 'async fn launch_game(' src-tauri/src/lib.rs
          grep -Fq 'fetch_profile(http, api_url, &session.access_token)' src-tauri/src/core/ggo_auth.rs
          grep -Fq 'ggo-character-art' src/App.tsx
          grep -Fq 'ggo-hero-headphones.webp' src/App.tsx
          grep -Fq 'ggo-hero-lantern.webp' src/App.tsx
          grep -Fq "img-src 'self' data: https://ggo.kvicloud.ru" src-tauri/tauri.conf.json

      - name: Persist canonical source
        run: |
          set -euo pipefail
          if git diff --quiet -- launcher/src launcher/src-tauri/src launcher/src-tauri/tauri.conf.json; then
            echo 'Launcher source already canonical'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add launcher/src launcher/src-tauri/src launcher/src-tauri/tauri.conf.json
          git commit -m 'fix(launcher): persist Stage104 canonical source'
          git fetch origin launcher/bootstrap-v0.1
          git rebase origin/launcher/bootstrap-v0.1
          git push origin HEAD:launcher/bootstrap-v0.1
