name: GGO Auth Ticket TTL Migration

on:
  push:
    branches:
      - launcher/bootstrap-v0.1
    paths:
      - '.github/workflows/ggo-auth-ticket-ttl-migration.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: launcher/bootstrap-v0.1
          fetch-depth: 0
      - name: Extend unused one-shot ticket window
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          server = Path('services/ggo-auth/server.py')
          s = server.read_text(encoding='utf-8')
          old = 'DEVICE_TTL = 10 * 60\nGAME_TICKET_TTL = 75\n'
          new = (
              'DEVICE_TTL = 10 * 60\n'
              '# Still one-shot: this is only the maximum pre-consume window for slow first starts.\n'
              'GAME_TICKET_TTL = 3 * 60\n'
          )
          if old not in s:
              raise SystemExit('expected 75-second game ticket TTL not found')
          server.write_text(s.replace(old, new, 1), encoding='utf-8')

          test = Path('services/ggo-auth/test_auth.py')
          t = test.read_text(encoding='utf-8')
          old_assert = '        self.assertLessEqual(ticket["expires_in"], 90)\n'
          new_assert = (
              '        self.assertGreaterEqual(ticket["expires_in"], 175)\n'
              '        self.assertLessEqual(ticket["expires_in"], 180)\n'
          )
          if old_assert not in t:
              raise SystemExit('expected legacy ticket TTL assertion not found')
          test.write_text(t.replace(old_assert, new_assert, 1), encoding='utf-8')
          PY
          python3 -m py_compile services/ggo-auth/server.py services/ggo-auth/test_auth.py
          python3 services/ggo-auth/test_auth.py -v
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add services/ggo-auth/server.py services/ggo-auth/test_auth.py
          git commit -m 'fix(auth): extend unused game-ticket startup window'
          git fetch origin launcher/bootstrap-v0.1
          git rebase origin/launcher/bootstrap-v0.1
          git push origin HEAD:launcher/bootstrap-v0.1
