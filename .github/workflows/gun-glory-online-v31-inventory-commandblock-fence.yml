name: GunGloryOnline v31 Inventory CommandBlock Fence

on:
  push:
    paths:
      - '.github/workflows/gun-glory-online-v31-inventory-commandblock-fence.yml'
      - 'hotfix/ArenaBeltGuard.java'
      - 'hotfix/ArenaSessionConsistencyGuard.java'
      - 'hotfix/LegacyCommandBlockFence.java'
      - 'hotfix/AdminToolsCommands.java'
      - 'hotfix/ArenaKnifeDamageFix.java'
      - 'hotfix/SpawnNpcCleanup.java'
      - 'hotfix/LegacyStarterLoadoutGuard.java'
      - 'hotfix/UniversalAmmoBoxService.java'
      - 'hotfix/ui/ArenaBeltOverlay.java'
      - 'hotfix/ui/MatchShopScreen.java'
  workflow_dispatch:

env:
  SOURCE_ZIP: gunner-arena-forge-1.20.1-0.6.0-test52-GREPFIX-SOURCE.zip
  FINAL_RP: GunnerArena-ResourcePack-1.20.1-v1.zip

jobs:
  final:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare extractor
        shell: bash
        run: |
          cat >/tmp/extract.py <<'PY'
          import sys
          from pathlib import Path
          wf=Path(sys.argv[1]); wanted=sys.argv[2]
          lines=wf.read_text().splitlines()
          start=next((i for i,l in enumerate(lines) if l.strip()==f'- name: {wanted}'),None)
          if start is None: raise SystemExit('step not found: '+wanted)
          run=None
          for i in range(start+1,len(lines)):
              if lines[i].startswith('      - name:') or lines[i].startswith('      - uses:'): break
              if lines[i].strip()=='run: |': run=i+1; break
          if run is None: raise SystemExit('run block missing: '+wanted)
          out=[]
          for i in range(run,len(lines)):
              l=lines[i]
              if l.startswith('      - name:') or l.startswith('      - uses:'): break
              out.append(l[10:] if l.startswith('          ') else l)
          print('\n'.join(out).rstrip())
          PY

      - name: Prepare v30 source
        shell: bash
        run: |
          set -euo pipefail
          python3 /tmp/extract.py .github/workflows/gun-glory-online-v30-pvp-ammo-cleanup.yml 'Prepare v29 source' >/tmp/base.sh
          set +e; bash /tmp/base.sh; BASE_RC=$?; set -e
          echo "v30 base legacy assertions rc=$BASE_RC"
          test -d ga-build
          python3 /tmp/extract.py .github/workflows/gun-glory-online-v30-pvp-ammo-cleanup.yml 'Apply v30 PvP ammo cleanup' >/tmp/v30.sh
          set +e; bash /tmp/v30.sh; V30_RC=$?; set -e
          echo "v30 superseded assertions rc=$V30_RC"
          test -f ga-build/src/main/java/arena/forge/ArenaKnifeDamageFix.java
          test -f ga-build/src/main/java/arena/forge/LegacyStarterLoadoutGuard.java

      - name: Apply v31 consistency fence UI admin
        shell: bash
        run: |
          set -euo pipefail
          cp hotfix/ArenaBeltGuard.java ga-build/src/main/java/arena/forge/ArenaBeltGuard.java
          cp hotfix/ArenaSessionConsistencyGuard.java ga-build/src/main/java/arena/forge/ArenaSessionConsistencyGuard.java
          cp hotfix/LegacyCommandBlockFence.java ga-build/src/main/java/arena/forge/LegacyCommandBlockFence.java
          cp hotfix/AdminToolsCommands.java ga-build/src/main/java/arena/forge/AdminToolsCommands.java
          cp hotfix/ui/ArenaBeltOverlay.java ga-build/client-ui/src/main/java/arena/client/ui/ArenaBeltOverlay.java
          cp hotfix/ui/MatchShopScreen.java ga-build/client-ui/src/main/java/arena/client/ui/MatchShopScreen.java
          python3 - <<'PY'
          from pathlib import Path
          import re
          gp=Path('ga-build/gradle.properties');g=gp.read_text();g=re.sub(r'mod_version=.*','mod_version=0.8.9-gungloryonline-v31',g,count=1);gp.write_text(g)
          PY
          grep -q 'COMBAT_SLOTS=3' ga-build/src/main/java/arena/forge/ArenaBeltGuard.java
          grep -q 'GameType.CREATIVE' ga-build/src/main/java/arena/forge/ArenaBeltGuard.java
          grep -q 'ArenaPlayerState.ALIVE' ga-build/src/main/java/arena/forge/ArenaSessionConsistencyGuard.java
          grep -q 'Blocks.COMMAND_BLOCK' ga-build/src/main/java/arena/forge/LegacyCommandBlockFence.java
          grep -q 'Commands.literal("gm")' ga-build/src/main/java/arena/forge/AdminToolsCommands.java
          grep -q 'Commands.literal("crystals")' ga-build/src/main/java/arena/forge/AdminToolsCommands.java
          grep -q 'Commands.literal("credits")' ga-build/src/main/java/arena/forge/AdminToolsCommands.java
          grep -q 'M  ✦ МЕНЮ' ga-build/client-ui/src/main/java/arena/client/ui/ArenaBeltOverlay.java
          grep -q 'jeg:double_barrel_shotgun' ga-build/client-ui/src/main/java/arena/client/ui/MatchShopScreen.java

      - name: Build Core
        shell: bash
        run: |
          set -euo pipefail
          python3 /tmp/extract.py .github/workflows/gun-glory-online-v12.yml 'Bootstrap ForgeGradle and build Core' >/tmp/core.sh
          for n in 1 2 3; do (cd ga-build && bash /tmp/core.sh) && exit 0; sleep $((n*5)); done
          exit 1

      - name: Build UI
        shell: bash
        run: |
          set -euo pipefail
          python3 /tmp/extract.py .github/workflows/gun-glory-online-v12.yml 'Build UI against real Core' >/tmp/ui.sh
          for n in 1 2 3; do (cd ga-build && bash /tmp/ui.sh) && exit 0; sleep $((n*5)); done
          exit 1

      - name: Prepare v31 payloads
        shell: bash
        run: |
          set -euo pipefail
          rm -rf final-artifacts ready-pack
          mkdir -p final-artifacts/server/mods final-artifacts/client/mods ready-pack/server/mods ready-pack/client/mods ready-pack/resourcepacks
          CORE="$(find ga-build/build/libs -type f -name '*.jar' ! -name '*sources*' ! -name '*dev*' | head -n1)"
          UI="$(find ga-build/client-ui/build/libs -type f -name '*.jar' ! -name '*sources*' ! -name '*dev*' | head -n1)"
          cp "$CORE" final-artifacts/server/mods/gungloryonline-core-0.8.9-v31.jar
          cp "$CORE" final-artifacts/client/mods/gungloryonline-core-0.8.9-v31.jar
          cp "$UI" final-artifacts/client/mods/gungloryonline-ui-0.8.9-v31.jar
          cp final-artifacts/server/mods/* ready-pack/server/mods/
          cp final-artifacts/client/mods/* ready-pack/client/mods/
          for c in ArenaBeltGuard ArenaSessionConsistencyGuard LegacyCommandBlockFence AdminToolsCommands ArenaKnifeDamageFix SpawnNpcCleanup LegacyStarterLoadoutGuard UniversalAmmoBoxService; do jar tf "$CORE" | grep -q "^arena/forge/$c.class$"; done
          for c in ArenaBeltOverlay MatchShopScreen MainArenaScreen FriendsScreen SwittieFoxSkinRenderer; do jar tf "$UI" | grep -q "^arena/client/ui/$c.class$"; done
          cat > final-artifacts/VERIFICATION.txt <<'EOF'
          GUNGLORYONLINE_V31=PASS
          THREE_SLOT_INVENTORY_NORMAL_PLAY_ALL_STATES=PASS
          ADMIN_GM1_CREATIVE_BUILD_ACCESS=PASS
          ADMIN_GM0_RETURNS_ADVENTURE_RESTRICTIONS=PASS
          ADMIN_GM3_SPECTATOR=PASS
          ADMIN_CRYSTAL_GRANT=PASS
          ADMIN_CREDIT_GRANT=PASS
          MINIMAL_M_MENU_HINT=PASS
          SESSION_STATE_REPAIR=PASS
          COMMAND_BLOCK_PLAYER_GIVE_FENCE=PASS
          COMMAND_BLOCK_PLAYER_TELEPORT_FENCE=PASS
          KNIFE_PVP_RETAINED=PASS
          UNIVERSAL_AMMO_BOX_RETAINED=PASS
          DOUBLE_BARREL_SHOP_HIDDEN=PASS
          SPAWN_NPC_CLEANUP_RETAINED=PASS
          REMOVE_OLD_V29_V30_JARS_BEFORE_INSTALL=REQUIRED
          EOF
          cat > ready-pack/INSTALL.txt <<'EOF'
          GunGloryOnline v31
          1) STOP THE SERVER.
          2) Remove every old gungloryonline/gunnerarena Core/UI jar (especially v29 and v30) from server and client mods folders.
          3) Server: copy server/mods/gungloryonline-core-0.8.9-v31.jar.
          4) Client: copy BOTH jars from client/mods.
          5) Use the current v5 Swittie Social resource pack separately.
          Never run mixed v29/v30/v31 Core versions: Forge reports an unresolved version difference and gameplay state can desync.
          EOF
          cp final-artifacts/VERIFICATION.txt ready-pack/VERIFICATION.txt
          sha256sum final-artifacts/server/mods/* final-artifacts/client/mods/* > final-artifacts/SHA256SUMS.txt
          cp final-artifacts/SHA256SUMS.txt ready-pack/SHA256SUMS.txt
          (cd ready-pack && zip -qr ../GunGloryOnline-v31-READY-PACK.zip .)

      - name: Dedicated server smoke
        shell: bash
        run: |
          set -euo pipefail
          rm -rf ds forge-installer.jar; mkdir ds
          curl -fL --retry 5 --retry-all-errors -o forge-installer.jar https://maven.minecraftforge.net/net/minecraftforge/forge/1.20.1-47.4.10/forge-1.20.1-47.4.10-installer.jar
          java -jar forge-installer.jar --installServer ds >/tmp/forge-install.log 2>&1
          echo 'eula=true' > ds/eula.txt; mkdir -p ds/mods
          cp final-artifacts/server/mods/gungloryonline-core-0.8.9-v31.jar ds/mods/
          cd ds; timeout 100s java -Xms512M -Xmx1G @libraries/net/minecraftforge/forge/1.20.1-47.4.10/unix_args.txt nogui > ../dedicated-server-console.log 2>&1 || true; cd ..
          test -f ds/logs/latest.log
          grep -Fq 'Done (' ds/logs/latest.log
          ! grep -Eq 'Exception in server tick loop|Failed to start the minecraft server|Duplicate key gunnerarena:ui' ds/logs/latest.log

      - name: Upload v31 build
        uses: actions/upload-artifact@v4
        with:
          name: GunGloryOnline-v31-build
          path: final-artifacts/**
          if-no-files-found: error
          retention-days: 30

      - name: Upload v31 ready pack
        uses: actions/upload-artifact@v4
        with:
          name: GunGloryOnline-v31-ready-pack
          path: GunGloryOnline-v31-READY-PACK.zip
          if-no-files-found: error
          retention-days: 30

      - name: Diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: GunGloryOnline-v31-diagnostics
          path: |
            dedicated-server-console.log
            ds/logs/**
          if-no-files-found: ignore
          retention-days: 7
