name: GGO Launcher Stage 84 Integrity

on:
  workflow_dispatch:
  push:
    branches:
      - launcher/bootstrap-v0.1
    paths:
      - '.github/workflows/ggo-launcher-stage84-integrity.yml'
      - 'launcher/hotfix/apply_menu_first_beta_stage76.py'
      - 'launcher/hotfix/apply_client_integrity_stage84.py'
      - 'launcher/src-tauri/src/lib.rs'
      - 'launcher/src-tauri/Cargo.toml'
      - 'launcher/src/App.tsx'
      - 'launcher/package.json'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: launcher/bootstrap-v0.1
          fetch-depth: 0

      - name: Capture exact ref
        id: refs
        run: echo "launcher_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install Tauri Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply Stage76 and Stage84 transforms
        id: patch
        run: |
          set -euo pipefail
          python3 launcher/hotfix/apply_menu_first_beta_stage76.py
          python3 launcher/hotfix/apply_client_integrity_stage84.py

      - name: Verify integrity boundary
        id: gates
        run: |
          set -euo pipefail
          R=launcher/src-tauri/src/lib.rs
          grep -q 'fn ggo_integrity_pair(' "$R"
          grep -q 'runtime-stage77' "$R"
          grep -q 'runtime-stage68-69' "$R"
          grep -q 'Sha256::digest(core_bytes)' "$R"
          grep -q 'Sha256::digest(ui_bytes)' "$R"
          grep -q 'GGO_CLIENT_BUILD_ID' "$R"
          grep -q 'GGO_CORE_SHA256' "$R"
          grep -q 'GGO_UI_SHA256' "$R"
          grep -q 'GGO_GAME_TICKET_EXPIRES_AT' "$R"
          grep -q 'options.connect_server = false;' "$R"
          ! grep -q 'async fn launch_minecraft(' "$R"
          ! grep -q 'async fn preview_minecraft_launch(' "$R"

      - name: Build launcher web UI
        id: web
        working-directory: launcher
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Rust format gate
        id: fmt
        working-directory: launcher
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Rust compile gate
        id: rust
        working-directory: launcher/src-tauri
        run: cargo check

      - name: Publish Stage84 receipt
        if: always()
        env:
          PATCH_OUTCOME: ${{ steps.patch.outcome }}
          GATES_OUTCOME: ${{ steps.gates.outcome }}
          WEB_OUTCOME: ${{ steps.web.outcome }}
          FMT_OUTCOME: ${{ steps.fmt.outcome }}
          RUST_OUTCOME: ${{ steps.rust.outcome }}
        run: |
          set -euo pipefail
          result=success
          for v in "$PATCH_OUTCOME" "$GATES_OUTCOME" "$WEB_OUTCOME" "$FMT_OUTCOME" "$RUST_OUTCOME"; do
            [ "$v" = success ] || result=failure
          done
          mkdir -p .ci/launcher
          cat > .ci/launcher/stage84-integrity.txt <<EOF
          workflow=${GITHUB_WORKFLOW}
          run_id=${GITHUB_RUN_ID}
          run_attempt=${GITHUB_RUN_ATTEMPT}
          run_url=https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          launcher_sha=${{ steps.refs.outputs.launcher_sha }}
          patch=$PATCH_OUTCOME
          integrity_gates=$GATES_OUTCOME
          web_build=$WEB_OUTCOME
          rustfmt=$FMT_OUTCOME
          rust_check=$RUST_OUTCOME
          local_core_sha256=true
          local_ui_sha256=true
          managed_pair_fail_closed=true
          child_build_metadata=true
          launch_autoconnect=false
          result=$result
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .ci/launcher/stage84-integrity.txt
          git commit -m "ci: record launcher Stage84 integrity ${GITHUB_RUN_ID}" || exit 0
          git fetch origin launcher/bootstrap-v0.1
          git rebase origin/launcher/bootstrap-v0.1
          git push origin HEAD:launcher/bootstrap-v0.1
