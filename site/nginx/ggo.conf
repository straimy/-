limit_req_zone $binary_remote_addr zone=ggo_auth_login:10m rate=6r/m;
limit_req_zone $binary_remote_addr zone=ggo_auth_register:10m rate=3r/m;

server {
    listen 80;
    listen [::]:80;
    server_name ggo.kvicloud.ru 2.26.100.125;

    root /var/www/gungloryonline;
    index index.html;
    client_max_body_size 16m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    location = /api/v1/auth/login {
        limit_req zone=ggo_auth_login burst=4 nodelay;
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store" always;
    }

    location = /api/v1/auth/register {
        limit_req zone=ggo_auth_register burst=2 nodelay;
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store" always;
    }

    location /api/v1/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 20s;
        proxy_connect_timeout 3s;
        add_header Cache-Control "no-store" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /downloads/ {
        autoindex off;
        add_header Cache-Control "public, max-age=300";
        try_files $uri =404;
    }

    location /content/ {
        add_header Cache-Control "public, max-age=60";
        try_files $uri =404;
    }

    location ~* \.(exe|AppImage|zip|deb|rpm)$ {
        add_header Content-Disposition "attachment";
        add_header X-Content-Type-Options "nosniff";
        try_files $uri =404;
    }
}
