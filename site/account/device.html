<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Подтверждение входа — GunGloryOnline</title><link rel="stylesheet" href="/portal.css"></head><body><header class="portal-shell portal-nav"><a class="portal-logo" href="/"><i>G</i><span>GunGloryOnline</span></a><nav><a href="/">Главная</a><a href="/account/">Аккаунт</a><a href="/legal/privacy.html">Privacy</a></nav></header><main class="portal-shell"><section class="device-box"><div class="device-mark">G</div><h1>Вход в GGO Launcher</h1><p id="deviceText">Лаунчер запросил доступ к твоему GunGloryOnline аккаунту. Подтверди вход только если ты сам только что нажал «Войти через сайт» в лаунчере.</p><div id="deviceCode" class="device-code"></div><button id="approve" class="auth-submit">Подтвердить вход</button><p id="deviceMessage" class="message"></p><p class="form-note">Если ты не запускал вход в лаунчере — просто закрой эту страницу.</p></section></main><script>const id=new URLSearchParams(location.search).get('device_id')||'';document.getElementById('deviceCode').textContent=id?`Device request · ${id.slice(0,12)}…`:'Некорректный запрос';const btn=document.getElementById('approve'),msg=document.getElementById('deviceMessage');if(!id)btn.disabled=true;btn.onclick=async()=>{btn.disabled=true;msg.textContent='Проверяем аккаунт…';try{const session=await fetch('/api/v1/auth/session',{credentials:'same-origin'});if(session.status===401){location.href='/account/?return='+encodeURIComponent(location.href);return}const r=await fetch('/api/v1/auth/device/approve',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({device_id:id})});if(!r.ok)throw new Error((await r.json()).error||`HTTP ${r.status}`);msg.className='message ok';msg.textContent='Вход подтверждён ✓ Можно вернуться в лаунчер.'}catch(e){msg.className='message err';msg.textContent=String(e.message||e);btn.disabled=false}};</script></body></html>
